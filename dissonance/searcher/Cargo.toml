[package]
name = "searcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
machine = { path = "../machine", version = "=0.1.0" }
# Pinned for reproducibility; upgrade deliberately.
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tetanes-core = "=0.15.0"

[dev-dependencies]
criterion = "=0.5.1"

[[bench]]
name = "empirical_steps"
harness = false
