[package]
name = "searcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Pinned for reproducibility; upgrade deliberately.
postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[dev-dependencies]
criterion = "=0.5.1"

[[bench]]
name = "empirical_steps"
harness = false

[[bench]]
name = "archive_admission"
harness = false

[[bench]]
name = "duration"
harness = false

[[bench]]
name = "parent_selection"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }

[target.'cfg(all(target_arch = "aarch64", any(target_os = "linux", target_os = "macos"), not(miri)))'.dependencies]
sha2 = { version = "=0.10.9", features = ["asm"] }
