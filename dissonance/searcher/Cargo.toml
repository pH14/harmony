[package]
name = "searcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
machine = { path = "../machine", version = "=0.1.0" }
# Pinned for reproducibility; upgrade deliberately.
postcard = { version = "=1.1.3", features = ["alloc", "use-std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
# The fault-library adapter drives a Consonance control server directly, so it
# needs the host crates in addition to the machine crate's Consonance backend.
control-proto = { path = "../../consonance/control-proto", version = "=0.1.0", optional = true }
environment = { path = "../../consonance/environment", version = "=0.1.0", optional = true }
vmm-backend = { path = "../../consonance/vmm-backend", version = "=0.1.0", optional = true }
vmm-core = { path = "../../consonance/vmm-core", version = "=0.1.0", optional = true }

[features]
consonance = [
    "machine/consonance",
    "dep:control-proto",
    "dep:environment",
    "dep:vmm-backend",
    "dep:vmm-core",
]

[[bin]]
name = "nova-consonance-campaign"
path = "src/bin/nova-consonance-campaign.rs"
required-features = ["consonance"]

[[bin]]
name = "nova-consonance-observation-oracle"
path = "src/bin/nova-consonance-observation-oracle.rs"
required-features = ["consonance"]

[[bin]]
name = "faultlab-campaign"
path = "src/bin/faultlab-campaign.rs"
required-features = ["consonance"]

[dev-dependencies]
criterion = "=0.5.1"
machine = { path = "../machine", version = "=0.1.0", features = ["test-loopback"] }

[[bench]]
name = "empirical_steps"
harness = false
