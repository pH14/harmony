[package]
name = "machine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Phase 5: the machine boundary now has its real consonance transport and
# reproducer implementations. Keep these path dependencies schema-authoritative.
control-proto = { path = "../../consonance/control-proto", version = "0.1.0" }
environment = { path = "../../consonance/environment", version = "0.1.0" }
# Pinned for reproducibility; upgrade deliberately.
serde = { version = "=1.0.228", features = ["derive"] }
tetanes-core = "=0.15.0"

[dev-dependencies]
vmm-backend = { path = "../../consonance/vmm-backend", version = "0.1.0", features = ["mock"] }
vmm-core = { path = "../../consonance/vmm-core", version = "0.1.0" }
