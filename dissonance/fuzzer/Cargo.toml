[package]
name = "fuzzer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Pinned against LibAFL minor-version API churn; upgrade once, deliberately.
libafl = "=0.15.4"
libafl_bolts = "=0.15.4"
postcard = { version = "=1.1.3", features = ["alloc"] }
regex = "=1.13.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
proptest = "=1.9.0"
tempfile = "=3.27.0"
