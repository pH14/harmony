# SPDX-License-Identifier: AGPL-3.0-or-later

# Standalone policy for the pinned LibAFL 0.15.4 prototype workspace.  Zlib,
# BSL-1.0, and MPL-2.0 are AGPL-compatible; the root workspace does not need them
# because LibAFL and TetaNES are deliberately isolated here.  The
# atomic-polyfill notice is an unmaintained advisory (not a vulnerability) in
# LibAFL's pinned postcard chain, and RustSec reports that no safe upgrade is
# available.

[advisories]
version = 2
yanked = "deny"
ignore = [
  "RUSTSEC-2023-0089",
  # bincode 2.0.1 is pulled by pinned LibAFL 0.15.4; this is an
  # unmaintained notice, not a vulnerability, and has no safe upgrade.
  "RUSTSEC-2025-0141",
]

[bans]
wildcards = "deny"
multiple-versions = "warn"

[licenses]
version = 2
allow = [
  "AGPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "BSL-1.0",
  "MPL-2.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
