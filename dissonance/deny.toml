# SPDX-License-Identifier: AGPL-3.0-or-later

# Standalone dependency policy for the Dissonance workspace. The
# atomic-polyfill notice is unmaintained rather than vulnerable, and RustSec
# reports no safe upgrade in the pinned postcard chain.

[advisories]
version = 2
yanked = "deny"
ignore = [
  "RUSTSEC-2023-0089",
]

[bans]
wildcards = "deny"
multiple-versions = "warn"

[licenses]
version = 2
allow = [
  "AGPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
