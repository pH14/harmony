[package]
name = "acceptance-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Integration tests composing the acceptance oracles, VMM, and telemetry"

[dev-dependencies]
fault-policy = { version = "=0.1.0", path = "../../workloads/fault-policy" }
environment = { version = "=0.1.0", path = "../environment" }
control-proto = { version = "=0.1.0", path = "../control-proto" }
# This crate is the composition root for tests that exercise the acceptance
# oracle against the real VMM bridge. Keeping these edges here prevents the
# execution core from acquiring application/test dependencies.
acceptance-suite = { path = "../acceptance-suite", version = "0.1.0", default-features = false }
telemetry = { path = "../telemetry", version = "0.1.0", default-features = false }
unison = { path = "../unison", version = "0.1.0" }
vmm-backend = { path = "../vmm-backend", version = "0.1.0", features = ["mock"] }
vmm-core = { path = "../vmm-core", version = "0.1.0" }
sha2 = "0.10"

[lints]
workspace = true
