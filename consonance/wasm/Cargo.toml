[package]
name = "consonance-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace]
members = ["runtime"]

[dependencies]
wasmi = { package = "harmony-wasmi", path = "runtime", version = "=0.46.0" }
wasmparser = "=0.236.1"
wasm-encoder = { version = "=0.236.1", features = ["wasmparser"] }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
thiserror = "2"
postcard = { version = "=1.1.3", features = ["use-std"] }
environment = { path = "../environment", version = "=0.1.0" }
consonance-client = { path = "../client", version = "=0.1.0" }
control-proto = { path = "../control-proto", version = "=0.1.0" }
snapshot-store = { path = "../snapshot-store", version = "=0.1.0" }
blake3 = "1"
hypercall-proto = { path = "../hypercall-proto", version = "=0.1.0" }

[dev-dependencies]
wat = "=1.236.0"
