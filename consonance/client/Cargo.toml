[package]
name = "consonance-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
in-process = ["dep:vmm-core", "dep:vmm-backend", "dep:environment"]
uml = ["in-process", "dep:uml"]

[dependencies]
hypercall-proto = { path = "../hypercall-proto", version = "=0.1.0", default-features = false }
vmm-core = { path = "../vmm-core", version = "=0.1.0", optional = true }
vmm-backend = { path = "../vmm-backend", version = "=0.1.0", optional = true }
control-proto = { path = "../control-proto", version = "=0.1.0" }
environment = { path = "../environment", version = "=0.1.0", optional = true }
uml = { path = "../uml", version = "=0.1.0", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
thiserror = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "=1.0.151"
tempfile = "3"

[target.'cfg(target_arch = "aarch64")'.dev-dependencies]
vmm-backend = { path = "../vmm-backend", version = "=0.1.0", features = ["mock"] }
vtime = { path = "../vtime", version = "=0.1.0" }

[lints]
workspace = true
