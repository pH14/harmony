# Pinned upstream sources for the minimal Linux guest (task 04 Part B).
# Pinned 2026-06-12: linux 6.18.35 was the newest longterm (LTS) release on
# kernel.org; busybox 1.38.0 the newest stable on busybox.net. Hashes were
# cross-checked against the upstream-published sha256 sums at pin time.
# `make -C consonance/harmony-linux fetch` downloads into consonance/harmony-linux/dl/ and verifies before any build.
KERNEL_VERSION=6.18.35
KERNEL_URL=https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.18.35.tar.xz
KERNEL_SHA256=f78602932219125e211c5f5bfd84edcfd4ec5ce88fc944f8248413f665bef236
BUSYBOX_VERSION=1.38.0
BUSYBOX_URL=https://busybox.net/downloads/busybox-1.38.0.tar.bz2
BUSYBOX_SHA256=34f9ea6ff8636f2c9241153b9114eefa9e65674a45318ae1ef95bb5f31c53bb2

# musl supplies the fully owned static C runtime for the arm64 platform
# userspace. Pinned 2026-08-26; the hash matches the official release tarball
# and the independently published Buildroot source hash.
MUSL_VERSION=1.2.6
MUSL_URL=https://musl.libc.org/releases/musl-1.2.6.tar.gz
MUSL_SHA256=d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a

# runc is the only OCI runtime shipped in the platform guest. The x86_64
# release asset remains pinned below; arm64 is built from the pinned source with
# the pinned Go bootstrap and local LSE-only runtime patch series.
RUNC_VERSION=1.5.0
RUNC_X86_64_URL=https://github.com/opencontainers/runc/releases/download/v1.5.0/runc.amd64
RUNC_X86_64_SHA256=0363e69bebd3a027d1239364ab9b4f4873f6bc4e7a7878e94b4ea59f08551297
RUNC_SOURCE_URL=https://github.com/opencontainers/runc/archive/refs/tags/v1.5.0.tar.gz
RUNC_SOURCE_SHA256=1bcd55af6081cf080557b148d906f64e6e4ca886d8345fe4b5510a90b52815d1
GO_BOOTSTRAP_VERSION=1.25.0
GO_BOOTSTRAP_URL=https://dl.google.com/go/go1.25.0.linux-arm64.tar.gz
