# The harmony in-guest fault agent: the guest half of the standing-fault
# mechanism. It supervises the workload's node processes, polls the host for the
# standing faults active at the current `Moment` (`ServiceId::Standing`), and
# applies the difference against the previous answer as process signals and hook
# launches.
#
# Standalone workspace (like `consonance/harmony-linux/play-agent`): the root
# Cargo.toml excludes `consonance/harmony-linux/`, so this crate declares its own
# `[workspace]` and carries its own lockfile. It is a guest-resident
# harmony-linux artifact, so the no-`cfg(target_os)` portability rule is waived;
# the supervision brain (bundle parsing, fault reconciliation, hook directive
# parsing, register bookkeeping) is nonetheless target-agnostic so it builds and
# is unit-tested on the macOS dev host, and only the `/dev/harmony` ioctl,
# process spawning, and signalling are Linux.
[package]
name = "harmony-fault-agent"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "The Harmony in-guest fault agent: standing-fault poll, process supervision, and workload hooks"

# Own workspace root so cargo does not fold this into the excluded harmony-linux
# tree or the repo root workspace.
[workspace]

[lib]
name = "harmony_fault_agent"
path = "src/lib.rs"

[[bin]]
name = "fault-agent"
path = "src/main.rs"

# Explicit `version` alongside `path` for `cargo deny`'s wildcard ban, mirroring
# the other guest crates.
[dependencies]
# The guest SDK: assertions, IJON state registers, and `setup_complete`.
harmony-sdk = { path = "../sdk", version = "0.1.0" }
# The guest-side hypercall client, `Client::standing_poll`, and `parse_standing`.
hypercall-proto = { path = "../../hypercall-proto", version = "0.1.0", default-features = false, features = ["guest"] }
# The fault catalog and the `DecisionClass::Process` target encoding, shared
# byte-for-byte with the host frontier.
environment = { path = "../../environment", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"

# Guest-resident Linux glue: the `/dev/harmony` ioctl and process-group
# signalling. Only referenced under the x86-64 Linux cfg.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = { version = "0.2" }

[lints.clippy]
all = { level = "deny", priority = -1 }
