[package]
name = "uml"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "User-mode Linux profile verification and process launcher"

[lints]
workspace = true

[dependencies]
hypercall-proto = { path = "../hypercall-proto", version = "0.1.0", features = [
    "host",
] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
