[package]
name = "uml"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "User-mode Linux profile verification and process launcher"

[lints]
workspace = true

[features]
strict-host = []

[dependencies]
blake3 = "1"
environment = { path = "../environment", version = "0.1.0" }
hypercall-proto = { path = "../hypercall-proto", version = "0.1.0", features = [
    "host",
] }
host-code-identity = { path = "../host-code-identity", version = "0.1.0" }
libc = "0.2"
rustix = { version = "1", features = ["event", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snapshot-store = { path = "../snapshot-store", version = "0.1.0" }
tempfile = "3"
thiserror = "2"

[dev-dependencies]
snapshot-store = { path = "../snapshot-store", version = "0.1.0", features = ["test-utils"] }
