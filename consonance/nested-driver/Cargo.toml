[package]
name = "nested-driver"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
host-search = ["dep:consonance-client", "dep:oci-support", "dep:searcher", "dep:serde", "dep:serde_json", "dep:sha2", "dep:tempfile"]

[lints]
workspace = true

[dependencies]
vmm-core = { path = "../vmm-core", version = "=0.1.0" }
vmm-backend = { path = "../vmm-backend", version = "=0.1.0" }
harmony-sdk = { path = "../harmony-linux/sdk", version = "=0.1.0" }
hypercall-doorbell = { path = "../hypercall-doorbell", version = "=0.1.0", features = ["linux-device"] }
control-proto = { path = "../control-proto", version = "=0.1.0" }
environment = { path = "../environment", version = "=0.1.0" }
consonance-client = { path = "../client", version = "=0.1.0", features = ["in-process"], optional = true }
oci-support = { path = "../oci", version = "=0.1.0", optional = true }
searcher = { path = "../../dissonance/searcher", version = "=0.1.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
consonance-client = { path = "../client", version = "=0.1.0", features = ["in-process"] }
vmm-backend = { path = "../vmm-backend", version = "=0.1.0", features = ["mock"] }
oci-support = { path = "../oci", version = "=0.1.0" }
tempfile = "3"
