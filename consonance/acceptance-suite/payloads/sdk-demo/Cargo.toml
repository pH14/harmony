[package]
name = "sdk-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

# The SDK-instrumented demo guest: a bare-metal payload that drives the
# generic SDK catalog, assertion verbs, IJON state, and
# the setup-complete lifecycle — over the real `Client<VmcallTransport>` doorbell
# transport. Box-only to *run* (needs the patched KVM + the vmm-core doorbell
# seam); builds standalone for x86_64-unknown-none as the compile proof.
[dependencies]
common = { path = "../common" }
# The generic guest SDK and doorbell transport (consonance). Path deps cross
# workspaces; guest-side no_std throughout.
harmony-sdk = { path = "../../../../consonance/harmony-linux/sdk" }
hypercall-doorbell = { path = "../../../hypercall-doorbell" }
