# Example corpus manifest — the schema `load_manifest` / `to_manifest` speak.
#
# The canonical registry is consonance/acceptance-suite/corpus-manifest.toml. This smaller file documents
# the schema beside the runner. Each [[item]] declares which oracles apply to a workload;
# a diff to such a file is how "we added/changed a determinism test" is reviewed.
#
# Tokens:
#   kind     = "micro" | "workload" | "fuzz_seed"
#   oracles  = any of:
#                "determinism"            (O1)
#                "conformance"            (O2 — requires `golden`)
#                "seed_sensitivity:rng"   (O3, RNG-consuming payload)
#                "seed_sensitivity:pure"  (O3, seed-pure payload)
#   golden   = path to the committed digest; required iff "conformance" is listed.
#   hosts    = which hosts can execute this cell:
#                "portable" | "det-cfl-v1" | "msr1"   (default: ["portable"])
#   virt     = "l1" (guest on bare metal) | "l2" (nested)   (default: "l1")
#
# A row IS one cell of the acceptance matrix (docs/TESTING.md):
# (workload) x (oracle set) x (host) x (virt level). `acceptance-suite run
# --host <id>` selects which cells execute.

[[item]]
name = "rdtsc-monotonic"
kind = "micro"
source = "consonance/acceptance-suite/payloads/rdtsc.bin"
oracles = ["determinism", "conformance"]
golden = "consonance/acceptance-suite/golden/rdtsc.digest"

[[item]]
name = "rdrand-stream"
kind = "micro"
source = "consonance/acceptance-suite/payloads/rdrand.bin"
oracles = ["determinism", "conformance", "seed_sensitivity:rng"]
golden = "consonance/acceptance-suite/golden/rdrand.digest"

[[item]]
name = "cpuid-sweep"
kind = "micro"
source = "consonance/acceptance-suite/payloads/cpuid.bin"
oracles = ["determinism", "seed_sensitivity:pure"]

[[item]]
name = "compute"
kind = "workload"
source = "consonance/acceptance-suite/payloads/compute.bin"
oracles = ["determinism"]
