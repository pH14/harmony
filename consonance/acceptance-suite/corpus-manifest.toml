# Acceptance corpus registry.
#
# Each row identifies a workload, the oracles applied to it, and the host and
# virtualization level required to execute it. `golden` names the committed
# observable digest for conformance rows.
#
# Kinds: `micro`, `workload`, `fuzz_seed`.
# Oracles: `determinism`, `conformance`, `seed_sensitivity:rng`, and
# `seed_sensitivity:pure`.
# Hosts: `portable`, `det-cfl-v1`, and `msr1`.
# Virtualization levels: `l1` and `l2`.
#
# `acceptance-suite run --host <id>` selects matching rows. A row for which no
# selected host is available is reported as unrun.

[[item]]
name = "insn-rdtsc"
kind = "micro"
source = "consonance/acceptance-suite/payloads/insn-rdtsc"
oracles = ["determinism", "seed_sensitivity:pure", "conformance"]
golden = "consonance/acceptance-suite/golden/insn-rdtsc.digest"
hosts = ["portable", "det-cfl-v1"]
virt = "l1"

