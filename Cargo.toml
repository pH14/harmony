[workspace]
resolver = "2"
# Crates are grouped under harmony-themed top-level dirs (task 90). `consonance/`
# is the deterministic engine — vmm-core/vmm-backend and the crates they compose,
# plus `consonance/unison` (the determinism harness, ex-`detharness`) and the
# engine's contract surface, `consonance/environment` + `consonance/control-proto`
# (the decision vocabulary and control-transport wire; relocated here from the
# retired `dissonance/` tree, which they never should have lived under —
# consonance is their only consumer). The v1 dissonance searcher was removed;
# its rebuild lives in the standalone `dissonance-v2/` workspace.
members = ["consonance/*"]
# harmony-linux/ contains standalone Linux-side crates; the acceptance-suite
# payloads use custom targets/linker flags. Neither belongs to this workspace.
# spikes/differential-lineage is a standalone workspace root by design (tasks/120);
# the exclusion lets workspace members path-depend on it (tasks/121 M2 wires the
# revision coordinator to the spike dataflow) without merging the two graphs.
# dissonance-v2/ is a standalone workspace root by design (the LibAFL rebuild,
# docs/LIBAFL-PLAN.md); it must not share this build graph before its phase 5.
exclude = ["harmony-linux", "spikes/differential-lineage", "dissonance-v2"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
debug = true
