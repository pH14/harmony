[workspace]
resolver = "2"
# Crates are grouped under harmony-themed top-level dirs (task 90). `consonance/`
# is the deterministic engine — vmm-core/vmm-backend and the crates they compose,
# plus `consonance/unison` (the determinism harness, ex-`detharness`) and the
# engine's contract surface, `consonance/environment` + `consonance/control-proto`
# (the decision vocabulary and control-transport wire; relocated here from the
# retired v1 `dissonance/` tree, which they never should have lived under —
# consonance is their only consumer). The v1 dissonance searcher was removed;
# its rebuild lives in the standalone `dissonance/` workspace.
members = ["consonance/*"]
# consonance/harmony-linux/ contains standalone Linux-side crates; the acceptance-suite
# payloads use custom targets/linker flags. Neither belongs to this workspace.
# dissonance/ is a standalone workspace root by design (the LibAFL rebuild,
# docs/LIBAFL-PLAN.md); it must not share this build graph before its phase 5.
# dissonance/differential-lineage inside it is in turn its own workspace root,
# keeping the differential-dataflow/timely graph separate from both.
exclude = [
  "consonance/harmony-linux",
  "dissonance",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
debug = true
