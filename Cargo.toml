[workspace]
resolver = "2"
# Crates are grouped under harmony-themed top-level dirs. `consonance/`
# is the deterministic engine — vmm-core/vmm-backend and the crates they compose,
# plus `consonance/unison` (the determinism harness, ex-`detharness`) and the
# engine's contract surface, `consonance/environment` + `consonance/control-proto`
# (the decision vocabulary and control-transport wire; relocated here from the
# retired v1 tree of the same name, which they never should have lived under —
# consonance is their only consumer). The v1 dissonance searcher was removed;
# its rebuild lives in the standalone `dissonance/` workspace.
members = ["cli", "consonance/*"]
# consonance/harmony-linux/ contains standalone Linux-side crates.
exclude = [
  "consonance/wasm",
  "consonance/harmony-linux",
  "dissonance",
  "workloads/nes",
  "workloads/tools",
  "workloads/nes-machine",
  "workloads/nes-protocol",
  "workloads/nes-guest",
  "workloads/nes-agent",
  "workloads/nes-wasm",
  "workloads/fault-policy",
  "workloads/faults",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
debug = true

[profile.release.package.harmony-wasmi]
codegen-units = 1

# Mutation builds inherit the test profile's assertions and panic behavior while
# omitting debug information. Incremental compilation is enabled by the CI
# mutation steps because each mutant is a small source change built in a
# separate scratch tree.
[profile.mutants]
inherits = "test"
debug = 0
