[workspace]
resolver = "2"
# The root workspace contains the CLI and Consonance's deterministic engine,
# execution contracts, and determinism harness. Dissonance and workloads use
# standalone workspaces.
members = ["cli", "consonance/*"]
# consonance/harmony-linux/ contains standalone Linux-side crates.
exclude = [
  "consonance/harmony-linux",
  "dissonance",
  "workloads/nes",
  "workloads/tools",
  "workloads/tiny-worlds",
  "workloads/nes-machine",
  "workloads/nes-protocol",
  "workloads/nes-guest",
  "workloads/fault-policy",
  "workloads/faults",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
debug = true

# Mutation builds inherit the test profile's assertions and panic behavior while
# omitting debug information. Incremental compilation is enabled by the CI
# mutation steps because each mutant is a small source change built in a
# separate scratch tree.
[profile.mutants]
inherits = "test"
debug = 0
