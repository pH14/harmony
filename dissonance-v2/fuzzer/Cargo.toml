[package]
name = "fuzzer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Pinned for all phases; upgrade once, deliberately, at phase 5
# (docs/LIBAFL-PLAN.md "Version churn").
libafl = "=0.15.4"
libafl_bolts = "=0.15.4"
postcard = { version = "=1.1.3", features = ["alloc"] }
serde = { version = "=1.0.228", features = ["derive"] }

[dev-dependencies]
proptest = "=1.9.0"
tempfile = "=3.27.0"
