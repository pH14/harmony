# Cargo dependency ownership for the current extraction graph.
#
# Members are repository-relative crate directories.  The checker resolves
# these to canonical Cargo.toml paths, so a crate can move between workspaces
# without changing its package name.  Every first-party package must occur in
# exactly one group.  Dependency kinds (normal/build/dev), optional edges, and
# target-specific edges all use the same group direction unless an exact
# migration exception below says otherwise.
version = 1

[groups]
search_core = [
    "dissonance/searcher",
]
execution_core = [
    "consonance/gicv3",
    "consonance/lapic",
    "consonance/snapshot-store",
    "consonance/unison",
    "consonance/vm-state",
    "consonance/vmm-backend",
    "consonance/vmm-core",
    "consonance/vtime",
]
platform_contracts = [
    "consonance/control-proto",
    "consonance/environment",
    "consonance/hypercall-proto",
]
consonance_client = [
    "consonance/client",
    "consonance/hypercall-doorbell",
]
workload_support = [
    "consonance/harmony-linux/sdk",
    "consonance/guest-image",
    "consonance/oci",
    "workloads/nes-protocol",
    "workloads/nes-machine",
]
workload_packages = [
    "workloads/fault-agent",
    "workloads/nes-guest",
    "workloads/fault-policy",
    "workloads/faults",
    "workloads/nes",
]
composition_apps_tests = [
    "workloads/tools",
    "cli",
    "consonance/control-proto/fuzz",
    "consonance/telemetry",
]

[allowed]
search_core = ["search_core"]
execution_core = ["execution_core", "platform_contracts"]
platform_contracts = ["platform_contracts"]
consonance_client = ["consonance_client", "platform_contracts", "execution_core"]
workload_support = [
    "consonance_client",
    "platform_contracts",
    "workload_support",
]
workload_packages = [
    "consonance_client",
    "platform_contracts",
    "search_core",
    "workload_packages",
    "workload_support",
]
composition_apps_tests = [
    "composition_apps_tests",
    "consonance_client",
    "execution_core",
    "platform_contracts",
    "search_core",
    "workload_packages",
    "workload_support",
]
