[package]
name = "fault-sdk"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Optional no_std fault-package adapters over the generic Harmony SDK service channel"

[workspace]

[dependencies]
harmony-sdk = { path = "../../consonance/harmony-linux/sdk", version = "0.1.0" }
hypercall-proto = { path = "../../consonance/hypercall-proto", version = "0.1.0", default-features = false, features = ["guest"] }

[dev-dependencies]
hypercall-proto = { path = "../../consonance/hypercall-proto", version = "0.1.0", features = ["host", "guest"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
