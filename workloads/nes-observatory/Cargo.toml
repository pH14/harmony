[package]
name = "nes-observatory"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace]

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "fs"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls", "query"] }
nes-workload = { path = "../nes", version = "=0.1.0" }
searcher = { path = "../../dissonance/searcher", version = "=0.1.0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "2"
