[package]
name = "oci-support"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace]

[dependencies]
guest-image = { path = "../guest-image", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
