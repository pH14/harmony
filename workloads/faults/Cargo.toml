[package]
name = "faults-workload"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Deterministic replicated-service fault-search workload"

[workspace]

[features]
consonance = ["dep:consonance-client", "consonance-client/in-process"]

[dependencies]
oci-support = { path = "../oci", version = "=0.1.0" }
guest-image = { path = "../guest-image", version = "=0.1.0" }
tempfile = "3"
consonance-client = { path = "../../consonance/client", version = "=0.1.0", optional = true }
fault-runtime = { path = "../fault-runtime", version = "=0.1.0" }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }
searcher = { path = "../../dissonance/searcher", version = "=0.1.0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "2"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
tempfile = "3"
