[package]
name = "faults-workload"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Deterministic fault-search package for distributed workloads"

[workspace]

[features]
consonance = [
    "dep:consonance-client",
    "dep:environment",
    "dep:uml",
    "consonance-client/uml",
]

[dependencies]
consonance-client = { path = "../../consonance/client", version = "=0.1.0", optional = true }
control-proto = { path = "../../consonance/control-proto", version = "=0.1.0" }
environment = { path = "../../consonance/environment", version = "=0.1.0", optional = true }
fault-policy = { path = "../fault-policy", version = "=0.1.0" }
oci-support = { path = "../../consonance/oci", version = "=0.1.0" }
object = { version = "=0.37.3", default-features = false, features = ["read_core", "elf", "std"] }
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder"] }
process-proto = { path = "../../consonance/process-proto", version = "=0.1.0" }
searcher = { path = "../../dissonance/searcher", version = "=0.1.0" }
uml = { path = "../../consonance/uml", version = "=0.1.0", optional = true }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "3"

[lints.clippy]
all = { level = "deny", priority = -1 }

[dev-dependencies]
postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }
tempfile = "3"
