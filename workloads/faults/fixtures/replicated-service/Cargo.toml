[package]
name = "fault-replicated-fixture"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Small TCP replicated-state fixture for the faults workload"

[workspace]

[lib]
name = "fault_replicated_fixture"
path = "src/lib.rs"

[[bin]]
name = "fault-replica"
path = "src/bin/fault-replica.rs"

[[bin]]
name = "fault-check"
path = "src/bin/fault-check.rs"

[[bin]]
name = "fault-recovery"
path = "src/bin/fault-recovery.rs"

[[bin]]
name = "fault-pending"
path = "src/bin/fault-pending.rs"

[[bin]]
name = "fault-ready"
path = "src/bin/fault-ready.rs"

[lints.clippy]
all = { level = "deny", priority = -1 }
