[package]
name = "nes-wasm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace]

[dependencies]
consonance-wasm = { path = "../../consonance/wasm", version = "=0.1.0" }
consonance-client = { path = "../../consonance/client", version = "=0.1.0" }
control-proto = { path = "../../consonance/control-proto", version = "=0.1.0" }
environment = { path = "../../consonance/environment", version = "=0.1.0" }
machine = { path = "../nes-machine", version = "=0.1.0", features = ["consonance"] }
hypercall-proto = { path = "../../consonance/hypercall-proto", version = "=0.1.0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }

[dev-dependencies]
wat = "=1.236.0"
tempfile = "=3.27.0"

[profile.release.package.harmony-wasmi]
codegen-units = 1
