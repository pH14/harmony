[package]
name = "blue-workload"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace]

[dependencies]
searcher = { path = "../../dissonance/searcher", version = "=0.1.0" }
machine = { package = "gb-machine", path = "../gb-machine", version = "=0.1.0" }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints.clippy]
all = { level = "deny", priority = -1 }

[[bin]]
name = "blue-campaign"
path = "src/bin/blue-campaign.rs"

[[bin]]
name = "blue-film"
path = "src/bin/blue-film.rs"

[[bin]]
name = "blue-probe"
path = "src/bin/blue-probe.rs"
