[package]
name = "nes-games"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace]

[dependencies]
searcher = { path = "../../dissonance/searcher", version = "=0.1.0" }
machine = { path = "../nes-machine", version = "=0.1.0" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }
lz4_flex = { version = "=0.11.6", default-features = false, features = ["safe-decode", "safe-encode", "std"] }

[features]
consonance = ["machine/consonance"]
test-support = ["machine/test-loopback"]

[dev-dependencies]
machine = { path = "../nes-machine", version = "=0.1.0", features = ["test-loopback"] }
