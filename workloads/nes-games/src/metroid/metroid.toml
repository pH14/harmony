goal = "ending"
reject = ["dead"]
capacity = 1
spread = ["area", "map_x", "map_y", "boss_damage", "zebetite_hits_left"]
identity = ["x / 16", "y / 16", "posture", "door"]
prefer = [
    ["min(items, 15): more", "min(tanks, 63): more", "missiles: more", "min(health, 8191): more"],
    ["min(items, 15): more", "min(tanks, 63): more", "balance: more", "above"],
]
prefer_scope = "0"

[[stage]]
name = "maru_mari"
objective = "0 * 2048 + max(last(if index(cell, to_maru_mari) != none then index(cell, to_maru_mari) else if objective / 2048 != 0 then 0 else none), 0)"
goal = "(equipment / 16) % 2 == 1"

[[stage]]
name = "energy_before_missiles"
objective = "1 * 2048 + health / 10"
goal = "health / 10 >= 64"
latch = true

[[stage]]
name = "missiles"
objective = "2 * 2048 + max(last(if index(cell, to_missiles) != none then index(cell, to_missiles) else if objective / 2048 != 2 then 0 else none), 0)"
goal = "missile_capacity > 0"

[[stage]]
name = "energy_before_bombs"
objective = "3 * 2048 + health / 10"
goal = "health / 10 >= 64"
latch = true

[[stage]]
name = "bombs"
objective = "4 * 2048 + max(last(if index(cell, to_bombs) != none then index(cell, to_bombs) else if objective / 2048 != 4 then 0 else none), 0)"
goal = "equipment % 2 == 1"

[[stage]]
name = "energy_before_kraid_door"
objective = "5 * 2048 + health / 10"
goal = "health / 10 >= 64"
latch = true

[[stage]]
name = "kraid_door"
objective = "6 * 2048 + max(last(if index(cell, to_kraid_door) != none then index(cell, to_kraid_door) else if objective / 2048 != 6 then 0 else none), 0)"
goal = "objective % 2048 + 1 >= 62"
latch = true

[[stage]]
name = "energy_before_kraid"
objective = "7 * 2048 + health / 10"
goal = "health / 10 >= 80"
latch = true

[[stage]]
name = "kraid"
objective = "8 * 2048 + boss_damage"
goal = "kraid_defeated"

[[stage]]
name = "after_kraid"
objective = "9 * 2048"
goal = "false"

[define]
cell = "area * 10000 + map_x * 100 + map_y"
boss_damage = "if boss_health == 0 then 0 else min((highest(max(boss_health_ceiling, boss_health), area) - boss_health + 3) / 4, 255)"

