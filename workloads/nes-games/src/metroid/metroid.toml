goal = "ending"
reject = ["dead"]
capacity = 1
spread = ["area", "map_x", "map_y", "boss_damage", "zebetite_hits_left"]
identity = ["x / 16", "y / 16", "posture", "door"]
prefer = [
    ["min(items, 15): more", "min(tanks, 63): more", "missiles: more", "min(health, 8191): more"],
    ["min(items, 15): more", "min(tanks, 63): more", "balance: more", "above"],
]
prefer_scope = "0"

[[stage]]
name = "maru_mari"
objective = "max(last(index(cell, to_maru_mari), stage), 0)"
goal = "(equipment / 16) % 2 == 1"

[[stage]]
name = "energy_before_missiles"
objective = "health / 10"
goal = "action_end and health / 10 >= 64"
latch = true

[[stage]]
name = "missiles"
objective = "max(last(index(cell, to_missiles), stage), 0)"
goal = "missile_capacity > 0"

[[stage]]
name = "energy_before_bombs"
objective = "health / 10"
goal = "action_end and health / 10 >= 64"
latch = true

[[stage]]
name = "bombs"
objective = "max(last(index(cell, to_bombs), stage), 0)"
goal = "equipment % 2 == 1"

[[stage]]
name = "energy_before_kraid_door"
objective = "health / 10"
goal = "action_end and health / 10 >= 64"
latch = true

[[stage]]
name = "kraid_door"
objective = "max(last(index(cell, to_kraid_door), stage), 0)"
goal = "objective + 1 >= len(to_kraid_door)"
latch = true

[[stage]]
name = "energy_before_kraid"
objective = "health / 10"
goal = "action_end and health / 10 >= 80"
latch = true

[[stage]]
name = "kraid"
objective = "boss_damage"
goal = "kraid_defeated"

[[stage]]
name = "after_kraid"
goal = "false"

[define]
cell = "area * 10000 + map_x * 100 + map_y"
boss_damage = "if boss_health == 0 then 0 else min((highest(max(boss_health_ceiling, boss_health), area) - boss_health + 3) / 4, 255)"

