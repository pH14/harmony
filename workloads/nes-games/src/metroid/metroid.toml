goal = "ending"
reject = ["dead"]
capacity = 1
spread = ["area", "map_x", "map_y", "boss_damage", "zebetite_hits_left"]
identity = ["x / 16", "y / 16", "posture", "door"]
prefer = [
    ["min(items, 15): more", "min(tanks, 63): more", "missiles: more", "min(health, 8191): more"],
    ["min(items, 15): more", "min(tanks, 63): more", "balance: more", "above"],
]
prefer_scope = "0"

[[stage]]
name = "maru_mari"
objective = "max(last(if action_end then index(cell, to_maru_mari) else none, stage), 0)"
goal = "(equipment / 16) % 2 == 1"

[[stage]]
name = "energy_before_missiles"
objective = "health / 10"
goal = "action_end and health / 10 >= 64"
latch = true

[[stage]]
name = "missiles"
objective = "max(last(if action_end then index(cell, to_missiles) else none, stage), 0)"
goal = "missile_capacity > 0"

[[stage]]
name = "energy_before_bombs"
objective = "health / 10"
goal = "action_end and health / 10 >= 64"
latch = true

[[stage]]
name = "bombs"
objective = "max(last(if action_end then index(cell, to_bombs) else none, stage), 0)"
goal = "equipment % 2 == 1"

[[stage]]
name = "energy_before_kraid_door"
objective = "health / 10"
goal = "action_end and health / 10 >= 64"
latch = true

[[stage]]
name = "kraid_door"
objective = "max(last(if action_end then index(cell, to_kraid_door) else none, stage), 0)"
goal = "action_end and objective + 1 >= len(to_kraid_door)"
latch = true

[[stage]]
name = "energy_before_kraid"
objective = "health / 10"
goal = "action_end and health / 10 >= 80"
latch = true

[[stage]]
name = "kraid"
objective = "boss_damage"
goal = "kraid_defeated"

[[stage]]
name = "energy_after_kraid"
objective = "health / 10"
goal = "action_end and health / 10 >= 120"
latch = true

[[stage]]
name = "norfair_elevator"
objective = "max(last(if action_end then index(cell, to_norfair) else none, stage), 0)"
goal = "action_end and objective + 1 >= len(to_norfair)"
latch = true

[[stage]]
name = "energy_before_ridley_elevator"
objective = "health / 10"
goal = "action_end and health / 10 >= 80"
latch = true

[[stage]]
name = "ridley_elevator"
objective = "max(last(if action_end then index(cell, to_ridley_elevator) else none, stage), 0)"
goal = "action_end and objective + 1 >= len(to_ridley_elevator)"
latch = true

[[stage]]
name = "energy_before_ridley_door"
objective = "health / 10"
goal = "action_end and health / 10 >= 96"
latch = true

[[stage]]
name = "ridley_door"
objective = "max(last(if action_end then index(cell, to_ridley_door) else none, stage), 0)"
goal = "action_end and objective + 1 >= len(to_ridley_door)"
latch = true

[[stage]]
name = "energy_before_ridley"
objective = "health / 10"
goal = "action_end and health / 10 >= 96"
latch = true

[[stage]]
name = "ridley"
objective = "boss_damage"
goal = "ridley_defeated"

[[stage]]
name = "after_ridley"
goal = "false"

[define]
cell = "area * 10000 + map_x * 100 + map_y"
boss_damage = "if boss_health == 0 then 0 else min((highest(max(boss_health_ceiling, boss_health), area) - boss_health + 3) / 4, 255)"

