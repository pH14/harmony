[package]
name = "fault-guest"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Guest supervisor for the deterministic replicated-service fault workload"

[workspace]

[dependencies]
fault-runtime = { path = "../fault-runtime", version = "=0.1.0" }
harmony-sdk = { path = "../../consonance/harmony-linux/sdk", version = "0.1.0" }
hypercall-proto = { path = "../../consonance/hypercall-proto", version = "0.1.0", default-features = false, features = ["guest"] }
hypercall-doorbell = { path = "../../consonance/hypercall-doorbell", version = "0.1.0", features = ["linux-device"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.clippy]
all = { level = "deny", priority = -1 }
