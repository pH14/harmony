# Copy to ~/.config/harmony/arcade-machines.toml and list your own machines.

# A directory with super-mario-bros.nes, mega-man-2.nes and metroid.nes, for
# the games whose ROMs the site does not ship. Leave it out to run only the
# homebrew games.
roms = "~/arcade-roms"

# One table per machine. `ssh` is any destination `ssh` accepts, such as a
# Host alias from ~/.ssh/config. The machine needs Linux with systemd, the
# repository-pinned Rust toolchain through rustup, git, curl, a C++ compiler,
# make, patch, flock and sha256sum. The SSH account must be able to start
# systemd user units (or system units as root) and write to `dir`.
# `dir` holds the source, builds, ROMs and runs.
# `workers` and `memory_mib` are the worker and archive ceilings the page offers.
# `memory_max_mib` is the required whole-unit RAM ceiling, greater than the
# archive ceiling, with swap disabled. Each simultaneous run gets this ceiling;
# size aggregate runs plus host services within actual host RAM. `runs`
# lists directories that hold other `nes-eval` campaigns; the page lists every
# running campaign under them so it can be watched. Set workers = 128 to offer
# that choice; select 128 in the dialog to use it. Famidash uses a fixed window
# of 512 expansion tasks (up to 7168 pending edge attempts), independent of
# workers; other games use window = 4 per worker. Memory/feedback capacity at
# the Famidash task window remains to be qualified. The whole-unit ceiling
# includes workers, pending tasks/results, stream/live buffers and transients;
# no universal archive-to-overhead formula is assumed.
# This config sets limits, not a throughput or resource-adequacy guarantee.
[machines.example]
ssh = "builder.example.com"
dir = "/srv/harmony-arcade"
workers = 8
memory_mib = 16384
memory_max_mib = 24576
runs = ["/srv/campaigns"]
