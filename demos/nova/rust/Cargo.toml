[package]
name = "nova-browser"
version = "0.1.0"
edition = "2024"
description = "Static Nova exploration demo using the Dissonance archive"
repository = "https://github.com/pH14/harmony"
license = "AGPL-3.0-or-later"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miniz_oxide = "=0.9.1"
searcher = { version = "=0.1.0", path = "../../../dissonance/searcher" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
wasm-bindgen = "=0.2.104"

[profile.release]
opt-level = 3
lto = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.54"
