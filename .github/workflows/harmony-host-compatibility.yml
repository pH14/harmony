# SPDX-License-Identifier: AGPL-3.0-or-later
name: Checks / Harmony Host Compatibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: harmony-host-compatibility-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0
  # Hosted Apple Silicon runs under Apple's Virtualization Framework and offers
  # no nested virtualization, and hosted Linux Arm64 offers no usable /dev/kvm.
  # These jobs therefore compile and link the host-gated backends and run the
  # portable tests; they are not evidence that HVF or Arm KVM executes a guest
  # correctly. That evidence comes from a host with a real hypervisor.
  # A host whose portable suite silently stopped selecting tests must fail
  # rather than report a green skip, so each suite checks its floor.
  PORTABLE_TEST_FLOOR: 1000
  DISSONANCE_PORTABLE_TEST_FLOOR: 300

jobs:
  scope:
    name: Change Selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_checks: ${{ steps.rust_checks.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: rust_checks
        uses: ./.github/actions/ci-scope
        with:
          kind: rust_checks
          target: harmony-host-compatibility.yml

  macos-arm64:
    name: macOS Arm64
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: harmony-host-compatibility-macos
          workspaces: |
            . -> target
            dissonance -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Compile and link the macOS backend
        run: |
          set -euo pipefail
          cargo build -p harmony-cli
          # hvf.rs is the only caller of Hypervisor.framework, and a missing
          # framework or a changed symbol surfaces at link time on this host
          # alone.
          otool -L target/debug/harmony | grep -q 'Hypervisor.framework'
      - name: Run the portable Consonance, Harmony and Dissonance tests
        run: |
          set -euo pipefail
          cargo nextest run --workspace --no-fail-fast 2>&1 | tee host-tests.log
          cargo nextest run --manifest-path dissonance/Cargo.toml --workspace \
            --no-fail-fast 2>&1 | tee -a host-tests.log
          scripts/check-portable-tests.sh host-tests.log "$PORTABLE_TEST_FLOOR"
      - name: Verify Darwin descriptor receive qualification
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sed $'s/\033\[[0-9;]*m//g' host-tests.log > darwin-rights-tests.log
          for test_name in \
            darwin_control_bound_recovers_all_installed_rights_before_protocol_refusal \
            darwin_frame_remainders_own_and_refuse_unexpected_rights; do
            grep -Eq "^[[:space:]]*PASS[[:space:]]+\[[^]]+\][[:space:]]+(\([[:space:]]*[0-9]+/[0-9]+\)[[:space:]]+)?consonance-client[[:space:]]+session::worker::tests::${test_name}$" darwin-rights-tests.log
          done
      - name: Verify direct extent export copy accounting on Arm64
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          sed $'s/\033\[[0-9;]*m//g' host-tests.log > copy-work-tests.log
          grep -Eq '^[[:space:]]*PASS[[:space:]]+\[[^]]+\][[:space:]]+(\([[:space:]]*[0-9]+/[0-9]+\)[[:space:]]+)?consonance-client[[:space:]]+session::live::tests::served_export_writes_once_into_the_allocated_destination$' copy-work-tests.log
      - name: Compare ARM and software SHA-256 in one executable
        run: |
          cargo fetch --locked
          python3 consonance/vmm-core/qualification/qualify-sha256.py --check
          python3 consonance/vmm-core/qualification/qualify-contract.py --check
          python3 consonance/vmm-core/qualification/qualify-contract.py --architecture arm64 --check
          python3 consonance/vm-state/qualification/qualify-codec.py --check
          python3 consonance/vmm-core/qualification/qualify-capture.py --check
          python3 consonance/vmm-core/qualification/qualify-sdk-capture.py --check
          python3 consonance/vmm-core/qualification/qualify-sdk-capture.py --encoding --check
          python3 consonance/vmm-core/qualification/qualify-control-capture.py --check
          python3 consonance/vmm-core/qualification/qualify-control-capture.py --inputs --check
          python3 consonance/vmm-core/qualification/qualify-control-capture.py --borrowed --check
          python3 consonance/vmm-core/qualification/qualify-restore.py --check
          cargo fetch --locked --manifest-path dissonance/Cargo.toml
          python3 scripts/qualify-host-sha256.py --check
  macos-consonance-host-package:
    name: macOS Consonance Host Package
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: harmony-host-compatibility-macos-package
      - name: Build and constrain the paired executables
        run: |
          set -euo pipefail
          cargo build --locked -p harmony-cli --bin harmony
          cargo build --locked -p harmony-cli --no-default-features \
            --features consonance-host --bin harmony-consonance-host
          codesign --force --sign - --identifier org.harmony.consonance-host \
            --options runtime,hard,kill \
            --entitlements consonance/vmm-backend/hvf.entitlements.plist \
            --library-constraint scripts/macos-os-only-library-constraint.coderequirement \
            target/debug/harmony-consonance-host
      - name: Prove signed host admission and native QuickNES routing
        run: |
          python3 scripts/test-consonance-host-package.py \
            --frontend target/debug/harmony \
            --host target/debug/harmony-consonance-host \
            --platform macos
      - name: Report strict host readiness on macOS
        run: |
          set -euo pipefail
          status=0
          target/debug/harmony check --offline --json >check.json || status=$?
          cat check.json
          test "$(jq -r .os check.json)" = macos
          test "$(jq -r .architecture check.json)" = aarch64
          jq -e 'has("ready") and has("blockers")' check.json >/dev/null
          jq -r '"backend: \(.backend); ready: \(.ready)"' check.json
          echo "check exit: ${status}"

  linux-arm64:
    name: Linux Arm64
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: harmony-host-compatibility-linux-arm64
          workspaces: |
            . -> target
            dissonance -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Compile and link the Arm64 Linux backend
        run: |
          set -euo pipefail
          # The CLI builds the Arm64 KVM ioctl surface only on this host.
          cargo build -p harmony-cli
      - name: Run the portable Consonance and Harmony tests
        run: |
          set -euo pipefail
          cargo nextest run --workspace --no-fail-fast 2>&1 | tee host-tests.log
          scripts/check-portable-tests.sh host-tests.log "$PORTABLE_TEST_FLOOR"

  linux-arm64-dissonance:
    name: Linux Arm64 Dissonance
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: harmony-host-compatibility-linux-arm64-dissonance
          workspaces: |
            dissonance -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run the portable Dissonance tests
        run: |
          set -euo pipefail
          cargo nextest run --manifest-path dissonance/Cargo.toml --workspace \
            --no-fail-fast 2>&1 | tee host-dissonance-tests.log
          scripts/check-portable-tests.sh host-dissonance-tests.log "$DISSONANCE_PORTABLE_TEST_FLOOR"

  linux-arm64-qualification:
    name: Linux Arm64 Qualification
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: harmony-host-compatibility-linux-arm64-qualification
          workspaces: |
            . -> target
            dissonance -> target
      - name: Compare ARM and software SHA-256 in one executable
        run: |
          cargo fetch --locked
          python3 consonance/vmm-core/qualification/qualify-sha256.py --check
          python3 consonance/vmm-core/qualification/qualify-contract.py --check
          python3 consonance/vmm-core/qualification/qualify-contract.py --architecture arm64 --check
          python3 consonance/vm-state/qualification/qualify-codec.py --check
          python3 consonance/vmm-core/qualification/qualify-capture.py --check
          python3 consonance/vmm-core/qualification/qualify-sdk-capture.py --check
          python3 consonance/vmm-core/qualification/qualify-sdk-capture.py --encoding --check
          python3 consonance/vmm-core/qualification/qualify-control-capture.py --check
          python3 consonance/vmm-core/qualification/qualify-control-capture.py --inputs --check
          python3 consonance/vmm-core/qualification/qualify-control-capture.py --borrowed --check
          python3 consonance/vmm-core/qualification/qualify-restore.py --check
          cargo fetch --locked --manifest-path dissonance/Cargo.toml
          python3 scripts/qualify-host-sha256.py --check
