# SPDX-License-Identifier: AGPL-3.0-or-later
# The historical discovery benchmark: independent campaigns of each focused,
# general and ablation arm on the User-mode Linux profile at one fixed budget,
# a fresh replay of each campaign's first scored finding, and a scorecard.
# workloads/bugs/historical/DISCOVERY.md holds the experiment and its scoring
# rules. A miss is a reported outcome; broken execution, a missing conclusive
# check and an unconfirmed or unreplayable finding fail their campaign job.
name: Benchmarks / Harmony Workloads / Historical Discovery

on:
  workflow_dispatch:
    inputs:
      arms:
        description: Comma-separated case ids (every discovery arm and its focused case when empty)
        required: false
        type: string
      seeds:
        description: Comma-separated campaign seeds
        required: false
        default: "1001,1002,1003,1004,1005,1006,1007,1008,1009,1010"
        type: string
      wall_minutes:
        description: Wall budget per campaign
        required: false
        default: "90"
        type: string
      executions:
        description: Execution ceiling per campaign
        required: false
        default: "1000000"
        type: string

permissions:
  contents: read

concurrency:
  group: harmony-historical-discovery-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HARMONY_RUST_TOOLCHAIN: 1.97.0
  REPLAY_REPEATS: 2
  REPLAY_TIMEOUT_SECONDS: 1800

jobs:
  manifest:
    name: Case Manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      arms: ${{ steps.read.outputs.arms }}
      campaigns: ${{ steps.read.outputs.campaigns }}
    steps:
      - uses: actions/checkout@v4
      - name: Expand arms and seeds
        id: read
        env:
          ARMS: ${{ inputs.arms }}
          SEEDS: ${{ inputs.seeds }}
          WALL: ${{ inputs.wall_minutes }}
          EXECUTIONS: ${{ inputs.executions }}
        run: |
          set -euo pipefail
          [[ "${WALL}" =~ ^[1-9][0-9]*$ && "${EXECUTIONS}" =~ ^[1-9][0-9]*$ ]]
          (( WALL <= 240 ))
          python3 scripts/historical-manifest.py --check
          arms=$(python3 scripts/historical-manifest.py --runnable-matrix --panel discovery --case "${ARMS}")
          campaigns=$(python3 scripts/historical-manifest.py --runnable-matrix --panel discovery --case "${ARMS}" --seeds "${SEEDS}")
          replay=$(( 2 * REPLAY_TIMEOUT_SECONDS / 60 ))
          campaigns=$(jq -c --argjson wall "${WALL}" --argjson executions "${EXECUTIONS}" --argjson replay "${replay}" \
            '.include |= map(.wall_minutes = $wall | .executions = $executions | .job_timeout_minutes = ($wall + 20 + $replay))' \
            <<<"${campaigns}")
          printf 'arms=%s\ncampaigns=%s\n' "${arms}" "${campaigns}" >>"${GITHUB_OUTPUT}"
          jq -r '.include[] | "\(.id)\t\(.discovery_mode)\t\(.focused_case)"' <<<"${arms}"

  guest:
    name: Guest Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Compute platform source key
        id: source
        run: echo "key=$(python3 consonance/harmony-linux/scripts/runtime-artifacts.py source-key --architecture x86_64)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: runtime
        with:
          path: consonance/harmony-linux/build/x86_64
          key: consonance-platform-v1-x86_64-${{ steps.source.outputs.key }}
      - name: Build exact platform artifacts
        if: steps.runtime.outputs.cache-hit != 'true'
        env:
          HARMONY_RDTSC_ALLOWLIST: ${{ github.workspace }}/consonance/harmony-linux/linux/rdtsc-allowlist-gha.txt
          HARMONY_RDRAND_ALLOWLIST: ${{ github.workspace }}/consonance/harmony-linux/linux/rdrand-allowlist-gha.txt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential flex bison libelf-dev libssl-dev bc cpio kmod bzip2 wget python3
          rustup toolchain install nightly-2026-06-16 --profile minimal --component rust-src --target x86_64-unknown-linux-musl
          make -C consonance/harmony-linux fetch
          consonance/harmony-linux/scripts/build-platform-runtime.sh
      - name: Verify exact platform inputs
        run: |
          python3 consonance/harmony-linux/scripts/runtime-artifacts.py verify --architecture x86_64 \
            --artifacts consonance/harmony-linux/build/x86_64 --output platform-provenance.json
          python3 -c 'import json; assert json.load(open("platform-provenance.json"))["scope"] == "exact-input"'
          cp platform-provenance.json consonance/harmony-linux/build/x86_64/
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-guest-${{ github.run_id }}
          path: |
            consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz
            consonance/harmony-linux/build/x86_64/platform-provenance.json
          if-no-files-found: error
          retention-days: 1

  profile:
    name: UML Profile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the profile from the locked toolchain
        run: nix run .#uml-images -- --output "$RUNNER_TEMP/uml"
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: consonance-uml-qualify-x86_64
      - name: Build the qualification binary
        run: |
          set -euo pipefail
          cargo build --release --locked -p uml --bin harmony-uml-qualify
          install -m 0755 target/release/harmony-uml-qualify "$RUNNER_TEMP/uml/"
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/uml
          if-no-files-found: error
          retention-days: 1

  tools:
    name: Harmony
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build tools
        run: |
          cargo build --locked --release -p harmony-cli
          mkdir -p tools
          cp target/release/harmony tools/harmony
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-tools-${{ github.run_id }}
          path: tools
          if-no-files-found: error
          retention-days: 1

  images:
    name: Workload Image — ${{ matrix.id }}
    needs: manifest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.arms) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build the arm's workload image
        env:
          CASE_DIR: ${{ matrix.dir }}
          IMAGE_PREFIX: ${{ matrix.image_prefix }}
        run: |
          set -euo pipefail
          case_json="${CASE_DIR}/case.json"
          context=$(jq -er .image.context "${case_json}")
          dockerfile=$(jq -er .image.dockerfile "${case_json}")
          version=$(jq -er '.workload.version' "${case_json}")
          mapfile -t build_args < <(jq -r \
            '.image.build_args // {} | to_entries[] | "\(.key)=\(.value)"' "${case_json}")
          runtime=$(bash workloads/languages/build-runtime.sh)
          args=(--build-arg "HARMONY_RUNTIME_IMAGE=$runtime")
          for build_arg in "${build_args[@]}"; do
            args+=(--build-arg "${build_arg}")
          done
          mkdir -p oci-images
          tag="harmony-${IMAGE_PREFIX}:${version}"
          docker build "${args[@]}" --tag "${tag}" --file "${dockerfile}" "${context}"
          docker save --output "oci-images/${IMAGE_PREFIX}-${version}.oci" "${tag}"
          (cd oci-images && sha256sum -- *.oci >MANIFEST.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: discovery-image-${{ matrix.id }}-${{ github.run_id }}
          path: oci-images
          if-no-files-found: error
          retention-days: 7

  campaign:
    name: ${{ matrix.display_name }}
    needs: [manifest, guest, profile, tools, images]
    if: >-
      ${{ !cancelled() && needs.manifest.result == 'success' && needs.guest.result == 'success'
      && needs.profile.result == 'success' && needs.tools.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.manifest.outputs.campaigns) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.job_timeout_minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: discovery-guest-${{ github.run_id }}
          path: guest
      - uses: actions/download-artifact@v4
        with:
          name: discovery-profile-${{ github.run_id }}
          path: guest/uml
      - uses: actions/download-artifact@v4
        with:
          name: discovery-tools-${{ github.run_id }}
          path: tools
      - uses: actions/download-artifact@v4
        with:
          name: discovery-image-${{ matrix.id }}-${{ github.run_id }}
          path: oci-images
      - name: Search as an ordinary user with ptrace and KVM denied
        env:
          BACKEND: uml
          CASE_DIR: ${{ matrix.dir }}
          CASE_ID: ${{ matrix.id }}
          RUN_KEY: ${{ matrix.run_key }}
          SOFTWARE_NAME: ${{ matrix.software }}
          WORKLOAD_VERSION: ${{ matrix.workload_version }}
          IMAGE_PREFIX: ${{ matrix.image_prefix }}
          RAM_MIB: ${{ matrix.ram_mib }}
          SEED: ${{ matrix.seed }}
          EXECUTIONS: ${{ matrix.executions }}
          WALL_MINUTES: ${{ matrix.wall_minutes }}
          KNOBS: ${{ matrix.knobs }}
          ORACLE_ASSERTION: ${{ matrix.oracle_assertion }}
          ORACLE_EVIDENCE: ${{ matrix.oracle_evidence }}
        run: scripts/historical-search.sh || true
      - name: Replay the first scored finding in fresh processes
        env:
          BACKEND: uml
          CASE_ID: ${{ matrix.id }}
          RUN_KEY: ${{ matrix.run_key }}
          SOFTWARE_NAME: ${{ matrix.software }}
          WORKLOAD_VERSION: ${{ matrix.workload_version }}
          IMAGE_PREFIX: ${{ matrix.image_prefix }}
          RAM_MIB: ${{ matrix.ram_mib }}
          KNOBS: ${{ matrix.knobs }}
          ORACLE_ASSERTION: ${{ matrix.oracle_assertion }}
          ORACLE_EVIDENCE: ${{ matrix.oracle_evidence }}
          MAX_REPLAY_SESSIONS: ${{ env.REPLAY_REPEATS }}
        run: |
          set -euo pipefail
          export REPORT_DIR="reports/${RUN_KEY}"
          search="${REPORT_DIR}/${CASE_ID}.search"
          [[ -s "${search}/report.json" ]] || exit 0
          finding=$(jq -r --arg id "${ORACLE_ASSERTION}" '
            [.bugs // [] | to_entries[] | select(.value.confirmed and ((.value.violations // []) | index($id)) != null)]
            | sort_by(.value.execution) | first | if . == null then "" else .key + 1 end' "${search}/report.json")
          [[ -n "${finding}" ]] || { echo "no confirmed finding carries the scored assertion"; exit 0; }
          FINDING=${finding} scripts/historical-replay.sh reproduce "${search}/bug-${finding}.json" || true
      - name: Score the campaign
        env:
          CASE_ID: ${{ matrix.id }}
          RUN_KEY: ${{ matrix.run_key }}
        run: |
          set -euo pipefail
          mkdir -p "reports/${RUN_KEY}"
          sha256sum tools/harmony guest/initramfs-oci.cpio.gz guest/uml/* oci-images/*.oci \
            >"reports/${RUN_KEY}/identity.sha256"
          python3 scripts/historical-discovery.py --reports "reports/${RUN_KEY}" \
            --json "reports/${RUN_KEY}/outcome.json" >>"${GITHUB_STEP_SUMMARY}"
          outcome=$(jq -r '.[0].outcome // "infra-failure"' "reports/${RUN_KEY}/outcome.json")
          crashes=$(jq -r '.[0].crashes // 0' "reports/${RUN_KEY}/outcome.json")
          echo "${CASE_ID} seed ${RUN_KEY}: ${outcome}"
          if (( crashes > 0 )); then
            echo "::warning::${RUN_KEY}: ${crashes} confirmed guest crash finding(s)"
          fi
          case "${outcome}" in
            discovery|internal-discovery|miss|other-violation|guest-crash) ;;
            *) echo "::error::${RUN_KEY}: ${outcome}"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-campaign-${{ matrix.run_key }}-${{ github.run_id }}
          path: |
            reports
            !reports/**/uml-work
            !reports/**/checkpoints
          if-no-files-found: error
          retention-days: 90

  scorecard:
    name: Scorecard
    needs: [manifest, campaign]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: discovery-campaign-*-${{ github.run_id }}
          path: reports
          merge-multiple: true
      - name: Render the comparison
        run: |
          set -euo pipefail
          mkdir -p scorecard
          python3 scripts/historical-discovery.py --reports reports --json scorecard/campaigns.json \
            | tee scorecard/scorecard.md >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-scorecard-${{ github.run_id }}
          path: scorecard
          if-no-files-found: warn
          retention-days: 90
