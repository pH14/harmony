# SPDX-License-Identifier: AGPL-3.0-or-later
name: Acceptance / Workload backends

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - .github/workflows/nova-consonance-experiment.yml
      - consonance/**
      - workloads/**
      - dissonance/**
      - cli/**
      - scripts/build-quicknes-core.sh
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

concurrency:
  group: nova-consonance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  whole-vm-search-campaign:
    name: Dissonance search · QuickNES guest · Consonance snapshots
    runs-on: ubuntu-24.04
    # A cold guest build precedes the 10,000-execution campaign.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # GitHub-hosted x86 runners draw from both Intel and AMD pools. Keep
      # every draw's oracle and campaign evidence separate so either vendor's
      # result remains inspectable after the runner disappears.
      matrix:
        replica: [1, 2, 3, 4]
    env:
      NOVA_BUILD: workloads/nes/build/nova
      HARMONY_QUICKNES_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install Nova and initramfs build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils cc65 cpio ffmpeg g++ shellcheck
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            dissonance -> dissonance/target
            workloads/nes-guest -> target
      - name: Reproduce pinned Nova and QuickNES
        run: |
          workloads/nes/scripts/build-nova-rom.sh "${NOVA_BUILD}"
          HARMONY_QUICKNES_STATIC_OUTPUT="${NOVA_BUILD}/libquicknes_libretro.a" \
            scripts/build-quicknes-core.sh "${NOVA_BUILD}/quicknes_libretro.so"
      - name: Restore locked guest artifacts
        id: guest-cache
        uses: actions/cache/restore@v4
        with:
          path: nix-guest-output
          key: guest-x86_64-v1-${{ hashFiles('flake.nix', 'flake.lock', 'consonance/harmony-linux/linux/**', 'consonance/harmony-linux/nix/**', 'consonance/harmony-linux/libvoidstar/**') }}
      - name: Build the locked Harmony guest kernel
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p nix-guest-output
          nix run .#guest-images -- --output "$PWD/nix-guest-output"
          (cd nix-guest-output && sha256sum -c MANIFEST.sha256)
      - name: Verify locked guest artifacts
        run: (cd nix-guest-output && sha256sum -c MANIFEST.sha256)
      - name: Save successful guest build
        if: steps.guest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: nix-guest-output
          key: ${{ steps.guest-cache.outputs.cache-primary-key }}
      - name: Fetch only the pinned BusyBox source
        run: |
          source consonance/harmony-linux/linux/versions.lock
          mkdir -p consonance/harmony-linux/dl
          archive="consonance/harmony-linux/dl/$(basename "${BUSYBOX_URL}")"
          # The mirror serves the same pinned bytes; keep Nix as a fallback
          # when that endpoint is unavailable. Both paths verify the lock hash.
          mirror="https://sources.buildroot.net/busybox/$(basename "${BUSYBOX_URL}")"
          if ! curl --fail --location --connect-timeout 15 --max-time 60 \
              --retry 2 --output "${archive}.part" "${mirror}"; then
            busybox_source="$(nix build .#busybox-source --no-link --print-out-paths)"
            install -m 0644 "${busybox_source}" "${archive}.part"
          fi
          printf '%s  %s\n' "${BUSYBOX_SHA256}" "${archive}.part" | sha256sum --check
          mv "${archive}.part" "${archive}"
      - name: Build Nova, QuickNES, and the SDK agent into the guest
        env:
          HARMONY_NOVA_ROM: ${{ github.workspace }}/workloads/nes/build/nova/nova.nes
          HARMONY_NOVA_CORE_STATIC: ${{ github.workspace }}/workloads/nes/build/nova/libquicknes_libretro.a
        run: consonance/harmony-linux/linux/build-nova-game-image.sh
      - name: Build the Consonance-backed Dissonance campaign
        run: |
          cargo build --locked --release --manifest-path workloads/nes/Cargo.toml \
            -p nes-workload --features consonance \
            --bin nova-consonance-campaign \
            --bin nova-consonance-observation-oracle
      - name: Build the x86 in-place restore oracle
        run: cargo build --locked --release --manifest-path workloads/tools/Cargo.toml --bin kvm_x86_nova_probe
      - name: Grant nested KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          mkdir -p nova-consonance-report
          grep -m1 'model name' /proc/cpuinfo | tee nova-consonance-report/runner.txt
      - name: Verify x86 in-place restore oracle
        env:
          HARMONY_CONSONANCE_RESTORE_ORACLE: "1"
        run: |
          timeout -k 10 600 \
            workloads/tools/target/release/kvm_x86_nova_probe \
              nix-guest-output/x86_64/bzImage \
              consonance/harmony-linux/build/initramfs-nova.cpio.gz \
            2>&1 | tee nova-consonance-report/restore-oracle.txt
          grep -Eq 'NOVA_CONSONANCE_RESTORE_ORACLE_OK equal=200 tree_actions=50 .* fallbacks=0$' \
            nova-consonance-report/restore-oracle.txt
      - name: Compare direct and whole-VM Nova observations
        run: |
          timeout -k 10 300 \
            workloads/nes/target/release/nova-consonance-observation-oracle \
              --kernel nix-guest-output/x86_64/bzImage \
              --initramfs consonance/harmony-linux/build/initramfs-nova.cpio.gz \
              --rom "${NOVA_BUILD}/nova.nes" \
              --core "${NOVA_BUILD}/quicknes_libretro.so" \
              --seed 20260901 \
              --sequences 4 \
              --actions-per-sequence 4 \
            2>&1 | tee nova-consonance-report/observation-oracle.txt
          grep -Eq 'NOVA_CONSONANCE_OBSERVATION_ORACLE_OK sequences=4 actions=[1-9][0-9]* seed=0000000001352825 stream_sha256=[0-9a-f]{64}$' \
            nova-consonance-report/observation-oracle.txt
      - name: Search Nova through whole-VM Consonance branches
        run: |
          timeout -k 10 3300 \
            workloads/nes/target/release/nova-consonance-campaign \
              --kernel nix-guest-output/x86_64/bzImage \
              --initramfs consonance/harmony-linux/build/initramfs-nova.cpio.gz \
              --rom "${NOVA_BUILD}/nova.nes" \
              --core "${NOVA_BUILD}/quicknes_libretro.so" \
              --output nova-consonance-report \
              --seed 20260901 \
              --executions 10000 \
              --workers 4 \
              --fixed-execution-soak \
              --action-limit 512 \
              --wall-seconds 3000 \
              --memory-budget-mib 2048 \
            2>&1 | tee nova-consonance-report/campaign.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path("nova-consonance-report/campaign-summary.json")
          summary = json.loads(summary_path.read_text())
          if summary.get("workers") != 4:
              raise SystemExit(f"campaign used {summary.get('workers')} workers")
          if summary.get("execution_budget") != 10000:
              raise SystemExit(
                  f"campaign budget was {summary.get('execution_budget')}, not 10000"
              )
          if summary.get("executions") != 10000:
              raise SystemExit(
                  f"campaign completed {summary.get('executions')} executions, not 10000"
              )
          if summary.get("memory_budget_mib") != 2048:
              raise SystemExit("campaign did not enforce the 2048 MiB process budget")
          if summary.get("archive_memory_budget_mib") != 64:
              raise SystemExit("campaign archive budget did not retain the RSS cushion")
          if summary.get("process_memory_reserve_mib") != 1984:
              raise SystemExit("campaign process reserve did not include the RSS cushion")
          peak_rss = summary.get("peak_rss_bytes")
          if not isinstance(peak_rss, int) or peak_rss <= 0:
              raise SystemExit(f"campaign did not record process peak RSS: {peak_rss!r}")
          budget_bytes = summary["memory_budget_mib"] * 1024 * 1024
          if peak_rss > budget_bytes:
              raise SystemExit(
                  f"campaign peak RSS {peak_rss} exceeded process budget {budget_bytes}"
              )
          video = summary.get("video") or {}
          if not video.get("mp4_sha256"):
              raise SystemExit("campaign did not produce a hashed film")
          PY
          cp nix-guest-output/MANIFEST.sha256 nova-consonance-report/guest-kernel-manifest.sha256
          sha256sum \
            consonance/harmony-linux/build/initramfs-nova.cpio.gz \
            "${NOVA_BUILD}/nova.nes" \
            "${NOVA_BUILD}/libquicknes_libretro.a" \
            >nova-consonance-report/workload.sha256
          {
            echo "## Nova inside Consonance"
            echo
            echo "The game-blind Dissonance searcher drove QuickNES and Nova inside the Linux guest."
            echo "Every mutation restored a Consonance whole-VM snapshot and supplied an opaque SDK controller payload."
            echo "The champion tape was replayed headlessly through QuickNES into a video with game audio."
            echo
            printf '\140\140\140json\n'
            cat nova-consonance-report/campaign-summary.json
            printf '\140\140\140\n'
          } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-consonance-campaign-${{ github.run_id }}-${{ matrix.replica }}
          path: nova-consonance-report
          if-no-files-found: warn
          retention-days: 30

  compare-replicas:
    name: Compare deterministic campaign hashes across replicas
    needs: whole-vm-search-campaign
    if: ${{ always() && needs.whole-vm-search-campaign.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nova-consonance-campaign-${{ github.run_id }}-*
          path: replicas
      - name: Require cross-replica stream and audio equality
        # The x86 X3 contract normalizes Intel/AMD guest-visible execution, and
        # QuickNES' integer work/audio stream has no documented vendor carveout.
        # A differing hash is therefore a regression, not permitted variance.
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          summaries = sorted(Path("replicas").glob("**/campaign-summary.json"))
          if len(summaries) != 4:
              raise SystemExit(f"expected 4 campaign summaries, found {len(summaries)}")

          rows = []
          for summary_path in summaries:
              summary = json.loads(summary_path.read_text())
              runner_path = summary_path.with_name("runner.txt")
              runner = runner_path.read_text().strip() if runner_path.exists() else "unknown CPU"
              rows.append((
                  summary_path,
                  runner,
                  summary.get("stream_sha256"),
                  (summary.get("video") or {}).get("audio_pcm_sha256"),
              ))

          for field_index, field_name in [(2, "stream_sha256"), (3, "audio_pcm_sha256")]:
              values = {row[field_index] for row in rows}
              if None in values or "" in values:
                  raise SystemExit(f"a replica omitted {field_name}: {rows!r}")
              if len(values) != 1:
                  details = "\n".join(
                      f"{path.parent.name}: {runner}: {value}"
                      for path, runner, stream, audio in rows
                      for value in [stream if field_index == 2 else audio]
                  )
                  raise SystemExit(f"cross-replica {field_name} divergence:\n{details}")

          print("all four replicas have identical stream_sha256 and audio_pcm_sha256")
          PY

  package-backend-acceptance:
    name: NES package native/Consonance backend acceptance
    runs-on: ubuntu-24.04
    # Leave room for a cold guest build before the two backend checks.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install NES build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils cc65 cpio g++ jq patch shellcheck
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            cli -> target
            workloads/nes -> target
            workloads/nes-guest -> target
            workloads/nes-machine -> target
            dissonance -> dissonance/target
      - name: Reproduce pinned Nova and QuickNES artifacts
        env:
          NOVA_BUILD: workloads/nes/build/nova
          HARMONY_QUICKNES_BUILD_JOBS: "2"
        run: |
          workloads/nes/scripts/build-nova-rom.sh "${NOVA_BUILD}"
          HARMONY_QUICKNES_STATIC_OUTPUT="${NOVA_BUILD}/libquicknes_libretro.a" \
            scripts/build-quicknes-core.sh "${NOVA_BUILD}/quicknes_libretro.so"
      - name: Restore locked guest artifacts
        id: guest-cache
        uses: actions/cache/restore@v4
        with:
          path: nix-guest-output
          key: guest-x86_64-v1-${{ hashFiles('flake.nix', 'flake.lock', 'consonance/harmony-linux/linux/**', 'consonance/harmony-linux/nix/**', 'consonance/harmony-linux/libvoidstar/**') }}
      - name: Build the locked Harmony guest kernel
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p nix-guest-output
          nix run .#guest-images -- --output "$PWD/nix-guest-output"
          test -s nix-guest-output/x86_64/bzImage
      - name: Verify locked guest artifacts
        run: (cd nix-guest-output && sha256sum -c MANIFEST.sha256)
      - name: Save successful guest build
        if: steps.guest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: nix-guest-output
          key: ${{ steps.guest-cache.outputs.cache-primary-key }}
      - name: Fetch only the pinned BusyBox source
        run: |
          source consonance/harmony-linux/linux/versions.lock
          mkdir -p consonance/harmony-linux/dl
          archive="consonance/harmony-linux/dl/$(basename "${BUSYBOX_URL}")"
          # The mirror serves the same pinned bytes; keep Nix as a fallback
          # when that endpoint is unavailable. Both paths verify the lock hash.
          mirror="https://sources.buildroot.net/busybox/$(basename "${BUSYBOX_URL}")"
          if ! curl --fail --location --connect-timeout 15 --max-time 60 \
              --retry 2 --output "${archive}.part" "${mirror}"; then
            busybox_source="$(nix build .#busybox-source --no-link --print-out-paths)"
            install -m 0644 "${busybox_source}" "${archive}.part"
          fi
          printf '%s  %s\n' "${BUSYBOX_SHA256}" "${archive}.part" | sha256sum --check
          mv "${archive}.part" "${archive}"
      - name: Build the ROM-free generic NES base image
        env:
          HARMONY_QUICKNES_STATIC_LIB: ${{ github.workspace }}/workloads/nes/build/nova/libquicknes_libretro.a
        run: |
          workloads/nes-guest/build-base-image.sh
          test -s consonance/harmony-linux/build/initramfs-nes.cpio.gz
      - name: Grant nested KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Build the backend oracle and Harmony CLI
        run: |
          cargo build --locked --release --manifest-path workloads/nes/Cargo.toml \
            --features consonance --bin nes-backend-oracle
          cargo build --locked --release -p harmony-cli
      - name: Compare Nova native and Consonance backends
        run: |
          mkdir -p package-backend-report
          timeout -k 10 900 \
            workloads/nes/target/release/nes-backend-oracle \
              workloads/nes/build/nova/nova.nes \
              workloads/nes/build/nova/quicknes_libretro.so \
              nix-guest-output/x86_64/bzImage \
              consonance/harmony-linux/build/initramfs-nes.cpio.gz \
            2>&1 | tee package-backend-report/nes-backend-oracle.txt
          grep -Eq '^NES_BACKEND_ORACLE_OK actions=[1-9][0-9]* sha256=[0-9a-f]{64}$' \
            package-backend-report/nes-backend-oracle.txt
      - name: Run bounded CLI searches on both explicit backends
        env:
          PACKAGE_SEED: "20260901"
          PACKAGE_WORKERS: "1"
          PACKAGE_EXECUTIONS: "8"
          PACKAGE_ACTIONS: "16"
        run: |
          rm -rf package-native package-consonance
          target/release/harmony search --package nes --backend native \
            --core workloads/nes/build/nova/quicknes_libretro.so \
            --seed "${PACKAGE_SEED}" --workers "${PACKAGE_WORKERS}" \
            --executions "${PACKAGE_EXECUTIONS}" --actions "${PACKAGE_ACTIONS}" \
            --out package-native workloads/nes/build/nova/nova.nes
          target/release/harmony search --package nes --backend consonance \
            --kernel nix-guest-output/x86_64/bzImage \
            --base-initramfs consonance/harmony-linux/build/initramfs-nes.cpio.gz \
            --seed "${PACKAGE_SEED}" --workers "${PACKAGE_WORKERS}" \
            --executions "${PACKAGE_EXECUTIONS}" --actions "${PACKAGE_ACTIONS}" \
            --out package-consonance workloads/nes/build/nova/nova.nes
          python3 - <<'PY'
          import json
          from pathlib import Path

          native = json.loads(Path("package-native/prepared.json").read_text())
          consonance = json.loads(Path("package-consonance/prepared.json").read_text())
          if native["workload"] != consonance["workload"]:
              raise SystemExit("native and Consonance workload identities differ")
          if native["search"] != consonance["search"]:
              raise SystemExit("native and Consonance search identities differ")
          if native["execution"]["backend"] != "native":
              raise SystemExit("native search did not record native backend")
          if consonance["execution"]["backend"] != "consonance":
              raise SystemExit("Consonance search did not record Consonance backend")
          for directory in (Path("package-native"), Path("package-consonance")):
              for name in ("prepared.json", "stream.jsonl", "report.json", "checkpoint.json"):
                  if not (directory / name).is_file():
                      raise SystemExit(f"{directory / name} was not produced")
          def jobs(directory):
              return [row for line in Path(directory, "stream.jsonl").read_text().splitlines()
                      if (row := json.loads(line)).get("event") in ("job", "skip")]
          if jobs("package-native") != jobs("package-consonance"):
              raise SystemExit("native and Consonance campaign choices or semantic results differ")
          print("native and Consonance searches have equal identities, choices, and semantic results")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nes-package-backend-acceptance-${{ github.run_id }}
          path: |
            package-backend-report
            package-native/prepared.json
            package-native/report.json
            package-native/stream.jsonl
            package-consonance/prepared.json
            package-consonance/report.json
            package-consonance/stream.jsonl
          if-no-files-found: warn
          retention-days: 30

  faults-vm-acceptance:
    name: Faults OCI · Consonance VM acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install fault workload build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cpio musl-tools
          rustup target add x86_64-unknown-linux-musl
          docker version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            workloads/faults -> target
            workloads/fault-guest -> target
            workloads/faults/fixtures/replicated-service -> target
      - name: Restore locked guest artifacts
        id: guest-cache
        uses: actions/cache/restore@v4
        with:
          path: nix-guest-output
          key: guest-x86_64-v1-${{ hashFiles('flake.nix', 'flake.lock', 'consonance/harmony-linux/linux/**', 'consonance/harmony-linux/nix/**', 'consonance/harmony-linux/libvoidstar/**') }}
      - name: Build the package-neutral guest kernel and base initramfs
        if: steps.guest-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p nix-guest-output
          nix run .#guest-images -- --output "$PWD/nix-guest-output"
          (cd nix-guest-output && sha256sum -c MANIFEST.sha256)
          test -s nix-guest-output/x86_64/bzImage
          test -s nix-guest-output/x86_64/initramfs.cpio.gz
      - name: Verify locked guest artifacts
        run: (cd nix-guest-output && sha256sum -c MANIFEST.sha256)
      - name: Save successful guest build
        if: steps.guest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: nix-guest-output
          key: ${{ steps.guest-cache.outputs.cache-primary-key }}
      - name: Build the static fault supervisor and fixture commands
        run: |
          cargo build --locked --release \
            --manifest-path workloads/fault-guest/Cargo.toml \
            --target x86_64-unknown-linux-musl
          cargo build --locked --release \
            --manifest-path workloads/faults/fixtures/replicated-service/Cargo.toml \
            --target x86_64-unknown-linux-musl --bins
          test -x workloads/fault-guest/target/x86_64-unknown-linux-musl/release/fault-guest
          file workloads/fault-guest/target/x86_64-unknown-linux-musl/release/fault-guest | grep -Eiq 'static'
          for binary in fault-replica fault-check fault-recovery fault-pending fault-ready; do
            test -x "workloads/faults/fixtures/replicated-service/target/x86_64-unknown-linux-musl/release/$binary"
            file "workloads/faults/fixtures/replicated-service/target/x86_64-unknown-linux-musl/release/$binary" | grep -Eiq 'static'
          done
      - name: Assemble the Alpine OCI fixture
        run: |
          rm -rf fault-vm-context
          mkdir -p fault-vm-context/harmony fault-vm-context/opt/harmony
          cp workloads/faults/fixtures/replicated-service/workload.json \
            workloads/faults/fixtures/replicated-service/network-init.sh \
            workloads/faults/fixtures/replicated-service/netns-exec \
            fault-vm-context/opt/harmony/
          for binary in fault-replica fault-check fault-recovery fault-pending fault-ready; do
            cp "workloads/faults/fixtures/replicated-service/target/x86_64-unknown-linux-musl/release/$binary" \
              "fault-vm-context/opt/harmony/$binary"
          done
          cp workloads/fault-guest/target/x86_64-unknown-linux-musl/release/fault-guest \
            fault-vm-context/opt/harmony/fault-guest
          cp workloads/faults/fixtures/replicated-service/workload.json \
            fault-vm-context/harmony/workload.json
          cat > fault-vm-context/Dockerfile <<'EOF'
          FROM alpine:3.20
          RUN apk add --no-cache iproute2 procps
          COPY harmony/workload.json /harmony/workload.json
          COPY opt/harmony/ /opt/harmony/
          RUN chmod 0755 /opt/harmony/network-init.sh /opt/harmony/netns-exec \
              /opt/harmony/fault-guest /opt/harmony/fault-replica \
              /opt/harmony/fault-check /opt/harmony/fault-recovery \
              /opt/harmony/fault-pending \
              /opt/harmony/fault-ready
          EOF
          docker build --pull --tag harmony-fault-fixture fault-vm-context
          docker save --output fault-fixture.tar harmony-fault-fixture
          test -s fault-fixture.tar
      - name: Grant nested KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Build the faults VM oracle
        run: |
          cargo build --locked --release \
            --manifest-path workloads/faults/Cargo.toml \
            --features consonance --bin fault-vm-oracle
          test -x workloads/faults/target/release/fault-vm-oracle
          cargo build --locked --release -p harmony-cli
          test -x target/release/harmony
      - name: Exercise nominal, partition, restore, recovery, and bounded search
        run: |
          rm -rf faults-vm-report
          mkdir -p faults-vm-report
          timeout -k 10 1200 \
            workloads/faults/target/release/fault-vm-oracle \
              --oci fault-fixture.tar \
              --kernel nix-guest-output/x86_64/bzImage \
              --base-initramfs nix-guest-output/x86_64/initramfs.cpio.gz \
              --fault-agent workloads/fault-guest/target/x86_64-unknown-linux-musl/release/fault-guest \
              --out faults-vm-report/search \
            2>&1 | tee faults-vm-report/oracle.txt
          grep -Eq '^FAULT_VM_ORACLE_OK nominal=1 partition_assertion=1 restore_equal=1 delay_restore=1 delay_pending=1 restart_restore=1 pause_restore=1 recovery=1 search_victory=1$' \
            faults-vm-report/oracle.txt
      - name: Exercise the bounded faults search through Harmony CLI
        env:
          FAULT_PACKAGE_SEED: "250"
          FAULT_PACKAGE_WORKERS: "1"
          FAULT_PACKAGE_EXECUTIONS: "64"
          FAULT_PACKAGE_ACTIONS: "4"
        run: |
          rm -rf faults-cli-report
          timeout -k 10 1200 \
            target/release/harmony search --package faults --backend consonance \
              --kernel nix-guest-output/x86_64/bzImage \
              --base-initramfs nix-guest-output/x86_64/initramfs.cpio.gz \
              --fault-agent workloads/fault-guest/target/x86_64-unknown-linux-musl/release/fault-guest \
              --seed "${FAULT_PACKAGE_SEED}" --workers "${FAULT_PACKAGE_WORKERS}" \
              --executions "${FAULT_PACKAGE_EXECUTIONS}" --actions "${FAULT_PACKAGE_ACTIONS}" \
              --out faults-cli-report fault-fixture.tar \
            2>&1 | tee faults-vm-report/cli.txt
          grep -Fq 'artifacts   faults-cli-report' faults-vm-report/cli.txt
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path("faults-cli-report")
          required = ("prepared.json", "stream.jsonl", "report.json", "checkpoint.json", "victory.json")
          for name in required:
              path = root / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"missing or empty CLI artifact: {path}")

          prepared = json.loads((root / "prepared.json").read_text())
          if prepared["workload"]["package"] != "faults-v2":
              raise SystemExit("prepared identity has the wrong workload package")
          if prepared["execution"]["backend"] != "consonance":
              raise SystemExit("prepared identity did not record the Consonance backend")
          expected_search = {"seed": 250, "workers": 1, "executions": 64, "actions": 4}
          if prepared["search"] != expected_search:
              raise SystemExit(f"unexpected prepared search identity: {prepared['search']}")
          if not prepared["execution"]["core_contract"].startswith("consonance-session-v2;"):
              raise SystemExit("prepared identity is missing the Consonance session contract")
          for name in ("kernel", "initramfs"):
              digest = prepared["execution"]["artifacts"].get(name, "")
              if not re.fullmatch(r"[0-9a-f]{64}", digest):
                  raise SystemExit(f"prepared identity has no SHA-256 for {name}")

          stream_bytes = (root / "stream.jsonl").read_bytes()
          stream = [json.loads(line) for line in stream_bytes.decode().splitlines()]
          if not stream or stream[0].get("format") != "fault-campaign-stream-v2":
              raise SystemExit("fault stream header is missing or has the wrong format")
          header = stream[0]
          if header.get("campaign_seed") != 250 or header.get("workers") != 1:
              raise SystemExit("fault stream header does not match the requested search")
          if not any(record.get("event") == "job" for record in stream[1:]):
              raise SystemExit("fault stream contains no executed job")

          report = json.loads((root / "report.json").read_text())
          if report.get("mode") != "campaign":
              raise SystemExit("fault report is not a campaign report")
          if report.get("campaign_seed") != 250 or report.get("workers") != 1:
              raise SystemExit("fault report identity does not match the requested search")
          if report.get("execution_budget") != 64 or report.get("action_limit") != 4:
              raise SystemExit("fault report limits do not match the requested search")
          if report.get("victories", 0) < 1 or report.get("executions_to_first_victory") is None:
              raise SystemExit("fault report did not record a discovered victory")
          if report.get("stream_sha256") != hashlib.sha256(stream_bytes).hexdigest():
              raise SystemExit("fault report stream digest does not match stream.jsonl")

          checkpoint = json.loads((root / "checkpoint.json").read_text())
          if checkpoint.get("format") != "fault-campaign-snapshot-checkpoint-v2":
              raise SystemExit("fault checkpoint has the wrong format")
          if not checkpoint.get("entries"):
              raise SystemExit("fault checkpoint contains no retained snapshots")

          victory = json.loads((root / "victory.json").read_text())
          if not victory.get("actions"):
              raise SystemExit("fault victory input contains no reproducing actions")
          if report.get("victory_input") != victory:
              raise SystemExit("report victory input differs from victory.json")
          print("faults CLI identity, stream, report, checkpoint, and victory verified")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: faults-vm-acceptance-${{ github.run_id }}
          path: |
            faults-vm-report
            faults-cli-report/prepared.json
            faults-cli-report/stream.jsonl
            faults-cli-report/report.json
            faults-cli-report/checkpoint.json
            faults-cli-report/victory.json
            fault-fixture.tar
          if-no-files-found: warn
          retention-days: 30
