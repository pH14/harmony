# SPDX-License-Identifier: AGPL-3.0-or-later
name: Acceptance / Workload backends

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Acceptance suite to run
        required: true
        default: all
        type: choice
        options:
          - all
          - nested-runtime
  pull_request:
    paths:
      - .github/workflows/nova-consonance-experiment.yml
      - flake.nix
      - flake.lock
      - consonance/**
      - workloads/**
      - '!workloads/bugs/**'
      - dissonance/**
      - cli/**
      - scripts/build-quicknes-core.sh
      - Cargo.toml
      - Cargo.lock

  push:
    branches: [main]
    paths:
      - .github/workflows/nova-consonance-experiment.yml
      - flake.nix
      - flake.lock
      - consonance/**
      - workloads/**
      - '!workloads/bugs/**'
      - dissonance/**
      - cli/**
      - scripts/build-quicknes-core.sh
      - Cargo.toml
      - Cargo.lock
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: nova-consonance-${{ github.event_name }}-${{ github.ref }}-${{ inputs.suite || 'all' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0
  HARMONY_GUEST_TOOLCHAIN: nightly-2026-06-16

jobs:
  whole-vm-search-campaign:
    name: Dissonance search · QuickNES guest · Consonance snapshots
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'nested-runtime')
    runs-on: ubuntu-24.04
    # A cold guest build precedes the 10,000-execution campaign. Slow hosted
    # replicas need more than 50 minutes for the fixed work; the assertions
    # below still require all 10,000 executions and matching replica hashes.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # GitHub-hosted x86 runners draw from both Intel and AMD pools. Keep
      # every draw's oracle and campaign evidence separate so either vendor's
      # result remains inspectable after the runner disappears.
      matrix:
        replica: [1, 2, 3, 4]
    env:
      NOVA_BUILD: workloads/nes/build/nova
      HARMONY_QUICKNES_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "$HARMONY_RUST_TOOLCHAIN" --profile minimal
          rustup default "$HARMONY_RUST_TOOLCHAIN"
          rustup toolchain install "$HARMONY_GUEST_TOOLCHAIN" --profile minimal \
            --component rust-src --target x86_64-unknown-linux-musl
      - name: Install Nova and platform build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binutils bison build-essential bzip2 cc65 cpio ffmpeg flex g++ kmod libelf-dev libssl-dev python3 shellcheck wget
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            dissonance -> dissonance/target
            workloads/nes-guest -> target
      - name: Reproduce pinned Nova and QuickNES
        run: |
          workloads/nes/scripts/build-nova-rom.sh "${NOVA_BUILD}"
          HARMONY_QUICKNES_STATIC_OUTPUT="${NOVA_BUILD}/libquicknes_libretro.a" \
            scripts/build-quicknes-core.sh "${NOVA_BUILD}/quicknes_libretro.so"
      - name: Compute platform source key
        id: platform-source
        run: echo "key=$(python3 consonance/harmony-linux/scripts/runtime-artifacts.py source-key --architecture x86_64)" >>"$GITHUB_OUTPUT"
      - name: Restore the canonical platform runtime
        id: platform-cache
        uses: actions/cache/restore@v4
        with:
          path: consonance/harmony-linux/build/x86_64
          key: consonance-platform-v1-x86_64-${{ steps.platform-source.outputs.key }}
      - name: Build the canonical platform runtime
        if: steps.platform-cache.outputs.cache-hit != 'true'
        env:
          HARMONY_RDTSC_ALLOWLIST: ${{ github.workspace }}/consonance/harmony-linux/linux/rdtsc-allowlist-gha.txt
          HARMONY_RDRAND_ALLOWLIST: ${{ github.workspace }}/consonance/harmony-linux/linux/rdrand-allowlist-gha.txt
        run: |
          make -C consonance/harmony-linux fetch
          consonance/harmony-linux/scripts/build-platform-runtime.sh
      - name: Verify exact platform runtime
        run: |
          python3 consonance/harmony-linux/scripts/runtime-artifacts.py verify --architecture x86_64 \
            --artifacts consonance/harmony-linux/build/x86_64 \
            --output nova-consonance-report/platform-provenance.json
          python3 -c 'import json; assert json.load(open("nova-consonance-report/platform-provenance.json"))["scope"] == "exact-input"'
      - name: Build the ROM-free generic NES OCI image
        env:
          HARMONY_QUICKNES_STATIC_LIB: ${{ github.workspace }}/workloads/nes/build/nova/libquicknes_libretro.a
        run: |
          make -C consonance/harmony-linux fetch
          workloads/nes-guest/build-base-image.sh
          test -s consonance/harmony-linux/build/nes.oci.sha256
          test -s consonance/harmony-linux/build/nes.oci/index.json
      - name: Build the Consonance-backed Dissonance campaign
        run: |
          cargo build --locked --release --manifest-path workloads/nes/Cargo.toml \
            -p nes-workload --features consonance \
            --bin nova-consonance-campaign \
            --bin nova-consonance-observation-oracle
      - name: Build the x86 in-place restore oracle
        run: cargo build --locked --release --manifest-path workloads/tools/Cargo.toml --bin kvm_x86_nova_probe
      - name: Grant nested KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          mkdir -p nova-consonance-report
          grep -m1 'model name' /proc/cpuinfo | tee nova-consonance-report/runner.txt
      - name: Verify x86 in-place restore oracle
        env:
          HARMONY_CONSONANCE_RESTORE_ORACLE: "1"
        run: |
          timeout -k 10 600 \
            workloads/tools/target/release/kvm_x86_nova_probe \
              consonance/harmony-linux/build/x86_64/bzImage \
              consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
              consonance/harmony-linux/build/nes.oci \
              "${NOVA_BUILD}/nova.nes" \
            2>&1 | tee nova-consonance-report/restore-oracle.txt
          grep -Eq 'NOVA_CONSONANCE_RESTORE_ORACLE_OK equal=200 tree_actions=50 .* fallbacks=0$' \
            nova-consonance-report/restore-oracle.txt
      - name: Compare direct and whole-VM Nova observations
        run: |
          timeout -k 10 300 \
            workloads/nes/target/release/nova-consonance-observation-oracle \
              --kernel consonance/harmony-linux/build/x86_64/bzImage \
              --platform-initramfs consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
              --image consonance/harmony-linux/build/nes.oci \
              --rom "${NOVA_BUILD}/nova.nes" \
              --core "${NOVA_BUILD}/quicknes_libretro.so" \
              --seed 20260901 \
              --sequences 4 \
              --actions-per-sequence 4 \
            2>&1 | tee nova-consonance-report/observation-oracle.txt
          grep -Eq 'NOVA_CONSONANCE_OBSERVATION_ORACLE_OK sequences=4 actions=[1-9][0-9]* seed=0000000001352825 stream_sha256=[0-9a-f]{64}$' \
            nova-consonance-report/observation-oracle.txt
      - name: Search Nova through whole-VM Consonance branches
        run: |
          timeout -k 10 4800 \
            workloads/nes/target/release/nova-consonance-campaign \
              --kernel consonance/harmony-linux/build/x86_64/bzImage \
              --platform-initramfs consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
              --image consonance/harmony-linux/build/nes.oci \
              --rom "${NOVA_BUILD}/nova.nes" \
              --core "${NOVA_BUILD}/quicknes_libretro.so" \
              --output nova-consonance-report \
              --seed 20260901 \
              --executions 10000 \
              --workers 4 \
              --fixed-execution-soak \
              --action-limit 512 \
              --wall-seconds 4500 \
              --memory-budget-mib 2048 \
            2>&1 | tee nova-consonance-report/campaign.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary_path = Path("nova-consonance-report/campaign-summary.json")
          summary = json.loads(summary_path.read_text())
          if summary.get("workers") != 4:
              raise SystemExit(f"campaign used {summary.get('workers')} workers")
          if summary.get("execution_budget") != 10000:
              raise SystemExit(
                  f"campaign budget was {summary.get('execution_budget')}, not 10000"
              )
          if summary.get("executions") != 10000:
              raise SystemExit(
                  f"campaign completed {summary.get('executions')} executions, not 10000"
              )
          if summary.get("memory_budget_mib") != 2048:
              raise SystemExit("campaign did not enforce the 2048 MiB process budget")
          if summary.get("archive_memory_budget_mib") != 64:
              raise SystemExit("campaign archive budget did not retain the RSS cushion")
          if summary.get("process_memory_reserve_mib") != 1984:
              raise SystemExit("campaign process reserve did not include the RSS cushion")
          peak_rss = summary.get("peak_rss_bytes")
          if not isinstance(peak_rss, int) or peak_rss <= 0:
              raise SystemExit(f"campaign did not record process peak RSS: {peak_rss!r}")
          budget_bytes = summary["memory_budget_mib"] * 1024 * 1024
          if peak_rss > budget_bytes:
              raise SystemExit(
                  f"campaign peak RSS {peak_rss} exceeded process budget {budget_bytes}"
              )
          video = summary.get("video") or {}
          if not video.get("mp4_sha256"):
              raise SystemExit("campaign did not produce a hashed film")
          PY
          cp consonance/harmony-linux/build/x86_64/runtime-manifest.json \
            nova-consonance-report/platform-runtime-manifest.json
          sha256sum \
            consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
            consonance/harmony-linux/build/nes.oci.sha256 \
            consonance/harmony-linux/build/x86_64/runtime-manifest.json \
            "${NOVA_BUILD}/nova.nes" \
            "${NOVA_BUILD}/libquicknes_libretro.a" \
            >nova-consonance-report/workload.sha256
          {
            echo "## Nova inside Consonance"
            echo
            echo "The game-blind Dissonance searcher drove QuickNES and Nova inside the Linux guest."
            echo "Every mutation restored a Consonance whole-VM snapshot and supplied an opaque SDK controller payload."
            echo "The champion tape was replayed headlessly through QuickNES into a video with game audio."
            echo
            printf '\140\140\140json\n'
            cat nova-consonance-report/campaign-summary.json
            printf '\140\140\140\n'
          } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-consonance-campaign-${{ github.run_id }}-${{ matrix.replica }}
          path: nova-consonance-report
          if-no-files-found: warn
          retention-days: 30

  compare-replicas:
    name: Compare deterministic campaign hashes across replicas
    needs: whole-vm-search-campaign
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'nested-runtime')) && needs.whole-vm-search-campaign.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nova-consonance-campaign-${{ github.run_id }}-*
          path: replicas
      - name: Require cross-replica stream and audio equality
        # The x86 X3 contract normalizes Intel/AMD guest-visible execution, and
        # QuickNES' integer work/audio stream has no documented vendor carveout.
        # A differing hash is therefore a regression, not permitted variance.
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          summaries = sorted(Path("replicas").glob("**/campaign-summary.json"))
          if len(summaries) != 4:
              raise SystemExit(f"expected 4 campaign summaries, found {len(summaries)}")

          rows = []
          for summary_path in summaries:
              summary = json.loads(summary_path.read_text())
              runner_path = summary_path.with_name("runner.txt")
              runner = runner_path.read_text().strip() if runner_path.exists() else "unknown CPU"
              rows.append((
                  summary_path,
                  runner,
                  summary.get("stream_sha256"),
                  (summary.get("video") or {}).get("audio_pcm_sha256"),
              ))

          for field_index, field_name in [(2, "stream_sha256"), (3, "audio_pcm_sha256")]:
              values = {row[field_index] for row in rows}
              if None in values or "" in values:
                  raise SystemExit(f"a replica omitted {field_name}: {rows!r}")
              if len(values) != 1:
                  details = "\n".join(
                      f"{path.parent.name}: {runner}: {value}"
                      for path, runner, stream, audio in rows
                      for value in [stream if field_index == 2 else audio]
                  )
                  raise SystemExit(f"cross-replica {field_name} divergence:\n{details}")

          print("all four replicas have identical stream_sha256 and audio_pcm_sha256")
          PY

  package-backend-acceptance:
    name: NES package native/Consonance backend acceptance
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite != 'nested-runtime')
    runs-on: ubuntu-24.04
    # Leave room for a cold guest build before the two backend checks.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "$HARMONY_RUST_TOOLCHAIN" --profile minimal
          rustup default "$HARMONY_RUST_TOOLCHAIN"
          rustup toolchain install "$HARMONY_GUEST_TOOLCHAIN" --profile minimal \
            --component rust-src --target x86_64-unknown-linux-musl
      - name: Install NES and platform build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binutils bison build-essential bzip2 cc65 cpio flex g++ kmod libelf-dev libssl-dev python3 shellcheck wget
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            cli -> target
            workloads/nes -> target
            workloads/nes-guest -> target
            workloads/nes-machine -> target
            dissonance -> dissonance/target
      - name: Reproduce pinned Nova and QuickNES artifacts
        env:
          NOVA_BUILD: workloads/nes/build/nova
          HARMONY_QUICKNES_BUILD_JOBS: "2"
        run: |
          workloads/nes/scripts/build-nova-rom.sh "${NOVA_BUILD}"
          HARMONY_QUICKNES_STATIC_OUTPUT="${NOVA_BUILD}/libquicknes_libretro.a" \
            scripts/build-quicknes-core.sh "${NOVA_BUILD}/quicknes_libretro.so"
      - name: Compute platform source key
        id: platform-source
        run: echo "key=$(python3 consonance/harmony-linux/scripts/runtime-artifacts.py source-key --architecture x86_64)" >>"$GITHUB_OUTPUT"
      - name: Restore the canonical platform runtime
        id: platform-cache
        uses: actions/cache/restore@v4
        with:
          path: consonance/harmony-linux/build/x86_64
          key: consonance-platform-v1-x86_64-${{ steps.platform-source.outputs.key }}
      - name: Build the canonical platform runtime
        if: steps.platform-cache.outputs.cache-hit != 'true'
        env:
          HARMONY_RDTSC_ALLOWLIST: ${{ github.workspace }}/consonance/harmony-linux/linux/rdtsc-allowlist-gha.txt
          HARMONY_RDRAND_ALLOWLIST: ${{ github.workspace }}/consonance/harmony-linux/linux/rdrand-allowlist-gha.txt
        run: |
          make -C consonance/harmony-linux fetch
          consonance/harmony-linux/scripts/build-platform-runtime.sh
      - name: Verify exact platform runtime
        run: |
          python3 consonance/harmony-linux/scripts/runtime-artifacts.py verify --architecture x86_64 \
            --artifacts consonance/harmony-linux/build/x86_64 \
            --output package-backend-report/platform-provenance.json
          python3 -c 'import json; assert json.load(open("package-backend-report/platform-provenance.json"))["scope"] == "exact-input"'
      - name: Build the ROM-free generic NES base image
        env:
          HARMONY_QUICKNES_STATIC_LIB: ${{ github.workspace }}/workloads/nes/build/nova/libquicknes_libretro.a
        run: |
          make -C consonance/harmony-linux fetch
          workloads/nes-guest/build-base-image.sh
          test -s consonance/harmony-linux/build/nes.oci.sha256
          test -s consonance/harmony-linux/build/nes.oci/index.json
      - name: Grant nested KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Build the backend oracle and Harmony CLI
        run: |
          cargo build --locked --release --manifest-path workloads/nes/Cargo.toml \
            --features consonance --bin nes-backend-oracle
          cargo build --locked --release -p harmony-cli
      - name: Compare Nova native and Consonance backends
        run: |
          mkdir -p package-backend-report
          timeout -k 10 900 \
            workloads/nes/target/release/nes-backend-oracle \
              workloads/nes/build/nova/nova.nes \
              workloads/nes/build/nova/quicknes_libretro.so \
              consonance/harmony-linux/build/x86_64/bzImage \
              consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
              consonance/harmony-linux/build/nes.oci \
            2>&1 | tee package-backend-report/nes-backend-oracle.txt
          grep -Eq '^NES_BACKEND_ORACLE_OK actions=[1-9][0-9]* sha256=[0-9a-f]{64}$' \
            package-backend-report/nes-backend-oracle.txt
      - name: Run bounded CLI searches on both explicit backends
        env:
          PACKAGE_SEED: "20260901"
          PACKAGE_WORKERS: "1"
          PACKAGE_EXECUTIONS: "8"
          PACKAGE_ACTIONS: "16"
        run: |
          rm -rf package-native package-consonance
          target/release/harmony search --package nes --backend native \
            --core workloads/nes/build/nova/quicknes_libretro.so \
            --seed "${PACKAGE_SEED}" --workers "${PACKAGE_WORKERS}" \
            --executions "${PACKAGE_EXECUTIONS}" --actions "${PACKAGE_ACTIONS}" \
            --out package-native workloads/nes/build/nova/nova.nes
          target/release/harmony search --package nes --backend consonance \
            --kernel consonance/harmony-linux/build/x86_64/bzImage \
            --base-initramfs consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
            --image consonance/harmony-linux/build/nes.oci \
            --seed "${PACKAGE_SEED}" --workers "${PACKAGE_WORKERS}" \
            --executions "${PACKAGE_EXECUTIONS}" --actions "${PACKAGE_ACTIONS}" \
            --out package-consonance workloads/nes/build/nova/nova.nes
          python3 - <<'PY'
          import json
          from pathlib import Path

          native = json.loads(Path("package-native/prepared.json").read_text())
          consonance = json.loads(Path("package-consonance/prepared.json").read_text())
          if native["workload"] != consonance["workload"]:
              raise SystemExit("native and Consonance workload identities differ")
          if native["search"] != consonance["search"]:
              raise SystemExit("native and Consonance search identities differ")
          if native["execution"]["backend"] != "native":
              raise SystemExit("native search did not record native backend")
          if consonance["execution"]["backend"] != "consonance":
              raise SystemExit("Consonance search did not record Consonance backend")
          for directory in (Path("package-native"), Path("package-consonance")):
              for name in ("prepared.json", "stream.jsonl", "report.json", "checkpoint.json"):
                  if not (directory / name).is_file():
                      raise SystemExit(f"{directory / name} was not produced")
          def jobs(directory):
              return [row for line in Path(directory, "stream.jsonl").read_text().splitlines()
                      if (row := json.loads(line)).get("event") in ("job", "skip")]
          if jobs("package-native") != jobs("package-consonance"):
              raise SystemExit("native and Consonance campaign choices or semantic results differ")
          print("native and Consonance searches have equal identities, choices, and semantic results")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nes-package-backend-acceptance-${{ github.run_id }}
          path: |
            package-backend-report
            package-native/prepared.json
            package-native/report.json
            package-native/stream.jsonl
            package-consonance/prepared.json
            package-consonance/report.json
            package-consonance/stream.jsonl
          if-no-files-found: warn
          retention-days: 30

  pr-native-smoke:
    name: Native Dissonance search smoke
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize smoke artifact directory
        run: mkdir -p nova-native-pr-smoke && touch nova-native-pr-smoke.console.txt
      - name: Install Nova build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils cc65 curl g++ git
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce the pinned Nova ROM and QuickNES core
        env:
          NOVA_BUILD: workloads/nes/build/nova
          HARMONY_QUICKNES_BUILD_JOBS: "2"
        run: |
          workloads/nes/scripts/build-nova-rom.sh "${NOVA_BUILD}"
          scripts/build-quicknes-core.sh "${NOVA_BUILD}/quicknes_libretro.so"
      - name: Run a bounded native Nova search
        run: |
          set -euo pipefail
          mkdir -p nova-native-pr-smoke
          cargo build --locked --release -p harmony-cli
          timeout -k 10 120 target/release/harmony search --package nes --backend native \
            --core workloads/nes/build/nova/quicknes_libretro.so \
            --seed 20260901 --workers 1 --executions 4 --actions 8 \
            --out nova-native-pr-smoke workloads/nes/build/nova/nova.nes \
            2>&1 | tee nova-native-pr-smoke.console.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("nova-native-pr-smoke/report.json").read_text())
          if report.get("executions_completed", 0) <= 0:
              raise SystemExit("native Nova smoke admitted no executions")
          if len(report.get("archive", {}).get("entries", [])) <= 0:
              raise SystemExit("native Nova smoke retained no archive work")
          stream = Path("nova-native-pr-smoke/stream.jsonl").read_text().splitlines()
          if not any(json.loads(line).get("event") == "job" for line in stream[1:]):
              raise SystemExit("native Nova smoke recorded no job event")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-native-pr-smoke-${{ github.run_id }}
          path: |
            nova-native-pr-smoke
            nova-native-pr-smoke.console.txt
          if-no-files-found: error
          retention-days: 14

  pr-consonance-smoke:
    name: Nova search inside Consonance smoke
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize smoke artifact directory
        run: mkdir -p nova-consonance-pr-smoke
      - name: Install Nova and image build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils build-essential cc65 curl ffmpeg g++ git jq python3 shellcheck wget
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            workloads/nes -> target
            workloads/nes-guest -> target
      - name: Compute platform source key
        id: platform-source
        run: echo "key=$(python3 consonance/harmony-linux/scripts/runtime-artifacts.py source-key --architecture x86_64)" >>"$GITHUB_OUTPUT"
      - name: Restore the exact platform runtime
        id: platform-cache
        uses: actions/cache/restore@v4
        with:
          path: consonance/harmony-linux/build/x86_64
          key: consonance-platform-v1-x86_64-${{ steps.platform-source.outputs.key }}
      - name: Locate the exact cross-branch platform handoff
        id: handoff
        if: steps.platform-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KEY: ${{ steps.platform-source.outputs.key }}
        run: |
          set -euo pipefail
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="consonance-platform-v1-x86_64-$SOURCE_KEY" -F per_page=100 \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .workflow_run.id // empty')
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
      - name: Clear the runtime directory before handoff
        if: steps.handoff.outputs.run_id != ''
        run: rm -rf consonance/harmony-linux/build/x86_64
      - uses: actions/download-artifact@v4
        if: steps.handoff.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.handoff.outputs.run_id }}
          name: consonance-platform-v1-x86_64-${{ steps.platform-source.outputs.key }}
          path: consonance/harmony-linux/build/x86_64
      - name: Verify exact platform provenance
        env:
          CACHE_HIT: ${{ steps.platform-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.platform-cache.outputs.cache-matched-key }}
          CACHE_REQUESTED_KEY: consonance-platform-v1-x86_64-${{ steps.platform-source.outputs.key }}
          HANDOFF_RUN_ID: ${{ steps.handoff.outputs.run_id }}
          SOURCE_KEY: ${{ steps.platform-source.outputs.key }}
        run: |
          set -euo pipefail
          if [[ -z "${CACHE_MATCHED_KEY}" && -z "${HANDOFF_RUN_ID}" ]]; then
            cat >nova-consonance-pr-smoke/cache-unavailable.txt <<'EOF'
          No exact platform runtime cache or exact cross-branch handoff was available. Run the scheduled/manual platform qualification before this smoke.
          EOF
            echo '::error::Nova Consonance PR smoke found no exact platform runtime.'
            exit 1
          fi
          python3 consonance/harmony-linux/scripts/runtime-artifacts.py verify --architecture x86_64 \
            --artifacts consonance/harmony-linux/build/x86_64 \
            --output nova-consonance-pr-smoke/platform-provenance.json
          scope=$(python3 -c 'import json; print(json.load(open("nova-consonance-pr-smoke/platform-provenance.json"))["scope"])')
          [[ "${scope}" == exact-input ]] || {
            echo "::error::Nova Consonance PR smoke requires exact-input platform artifacts (got ${scope})."
            exit 1
          }
          if [[ -n "${HANDOFF_RUN_ID}" ]]; then
            provenance=exact-cross-branch-handoff
          else
            provenance=exact-cache
          fi
          cat >nova-consonance-pr-smoke/cache-provenance.txt <<EOF
          requested_key=${CACHE_REQUESTED_KEY}
          source_key=${SOURCE_KEY}
          matched_key=${CACHE_MATCHED_KEY}
          cache_hit=${CACHE_HIT}
          handoff_run_id=${HANDOFF_RUN_ID}
          provenance=${provenance}
          scope=${scope}
          commit=$(git rev-parse HEAD)
          EOF
      - name: Reproduce Nova and its static QuickNES archive
        env:
          NOVA_BUILD: workloads/nes/build/nova
          HARMONY_QUICKNES_BUILD_JOBS: "2"
        run: |
          workloads/nes/scripts/build-nova-rom.sh "${NOVA_BUILD}"
          HARMONY_QUICKNES_STATIC_OUTPUT="${NOVA_BUILD}/libquicknes_libretro.a" \
            scripts/build-quicknes-core.sh "${NOVA_BUILD}/quicknes_libretro.so"
      - name: Build the ROM-free generic NES OCI image
        env:
          HARMONY_QUICKNES_STATIC_LIB: ${{ github.workspace }}/workloads/nes/build/nova/libquicknes_libretro.a
        run: |
          make -C consonance/harmony-linux fetch
          workloads/nes-guest/build-base-image.sh
          test -s consonance/harmony-linux/build/nes.oci.sha256
          test -s consonance/harmony-linux/build/nes.oci/index.json
      - name: Run Nova search through Consonance
        run: |
          set -euo pipefail
          mkdir -p nova-consonance-pr-smoke
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          cargo build --locked --release --manifest-path workloads/nes/Cargo.toml \
            -p nes-workload --features consonance --bin nova-consonance-campaign
          timeout -k 10 240 \
            workloads/nes/target/release/nova-consonance-campaign \
              --kernel consonance/harmony-linux/build/x86_64/bzImage \
              --platform-initramfs consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
              --image consonance/harmony-linux/build/nes.oci \
              --rom workloads/nes/build/nova/nova.nes \
              --core workloads/nes/build/nova/quicknes_libretro.so \
              --output nova-consonance-pr-smoke --seed 20260901 --executions 2 \
              --workers 1 --action-limit 4 --wall-seconds 120 --memory-budget-mib 1024 \
            2>&1 | tee nova-consonance-pr-smoke/console.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("nova-consonance-pr-smoke/campaign-summary.json").read_text())
          if summary.get("executions", 0) <= 0:
              raise SystemExit("Consonance Nova smoke admitted no executions")
          if summary.get("archive_entries", 0) <= 0:
              raise SystemExit("Consonance Nova smoke retained no archive work")
          if summary.get("best_input_actions", 0) <= 0:
              raise SystemExit("Consonance Nova smoke produced no action input")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-consonance-pr-smoke-${{ github.run_id }}
          path: nova-consonance-pr-smoke
          if-no-files-found: error
          retention-days: 14

  nested-runtime-qualification:
    name: Docker/K3s nested runtime diagnostics
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HARMONY_GUEST_DIR: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize qualification report
        run: |
          mkdir -p nested-runtime-report/build-logs
          mkdir -p nested-runtime-report/console
          mkdir -p nested-runtime-report/runs
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$HARMONY_RUST_TOOLCHAIN" --profile minimal
          rustup default "$HARMONY_RUST_TOOLCHAIN"
      - name: Install workload image build tools
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends \
              bc binutils bison build-essential bzip2 cpio curl \
              flex g++ jq kmod libelf-dev libssl-dev musl-tools python3 wget xz-utils
            sudo systemctl enable --now containerd
            sudo ctr version
          } 2>&1 | tee nested-runtime-report/host-setup.log
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
      - name: Compute platform source key
        id: platform-source
        run: echo "key=$(python3 consonance/harmony-linux/scripts/runtime-artifacts.py source-key --architecture x86_64)" >>"$GITHUB_OUTPUT"
      - name: Restore the exact platform runtime
        id: platform-cache
        uses: actions/cache/restore@v4
        with:
          path: consonance/harmony-linux/build/x86_64
          key: consonance-platform-v1-x86_64-${{ steps.platform-source.outputs.key }}
      - name: Locate the exact cross-branch platform handoff
        id: platform-handoff
        if: steps.platform-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KEY: ${{ steps.platform-source.outputs.key }}
        run: |
          set -euo pipefail
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="consonance-platform-v1-x86_64-$SOURCE_KEY" -F per_page=100 \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .workflow_run.id // empty')
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
      - name: Clear the runtime directory before handoff
        if: steps.platform-handoff.outputs.run_id != ''
        run: rm -rf consonance/harmony-linux/build/x86_64
      - uses: actions/download-artifact@v4
        if: steps.platform-handoff.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.platform-handoff.outputs.run_id }}
          name: consonance-platform-v1-x86_64-${{ steps.platform-source.outputs.key }}
          path: consonance/harmony-linux/build/x86_64
      - name: Require exact platform provenance
        id: platform-provenance
        env:
          CACHE_HIT: ${{ steps.platform-cache.outputs.cache-hit }}
          CACHE_MATCHED_KEY: ${{ steps.platform-cache.outputs.cache-matched-key }}
          CACHE_REQUESTED_KEY: consonance-platform-v1-x86_64-${{ steps.platform-source.outputs.key }}
          HANDOFF_RUN_ID: ${{ steps.platform-handoff.outputs.run_id }}
          SOURCE_KEY: ${{ steps.platform-source.outputs.key }}
        run: |
          set -euo pipefail
          mkdir -p nested-runtime-report
          if [[ "$CACHE_HIT" != true && -z "$HANDOFF_RUN_ID" ]]; then
            cat >nested-runtime-report/cache-unavailable.txt <<'EOF'
          No exact platform runtime cache or exact cross-branch handoff was available. Run the platform qualification publisher before this lane.
          EOF
            echo '::error::Nested runtime qualification requires an exact platform runtime handoff.'
            exit 1
          fi
          if [[ -n "$HANDOFF_RUN_ID" ]]; then
            provenance=exact-cross-branch-handoff
          else
            provenance=exact-cache
          fi
          cat >nested-runtime-report/cache-provenance.txt <<EOF
          requested_key=${CACHE_REQUESTED_KEY}
          source_key=${SOURCE_KEY}
          matched_key=${CACHE_MATCHED_KEY}
          cache_hit=${CACHE_HIT}
          handoff_run_id=${HANDOFF_RUN_ID}
          provenance=${provenance}
          commit=$(git rev-parse HEAD)
          EOF
          python3 consonance/harmony-linux/scripts/runtime-artifacts.py verify --architecture x86_64 \
            --artifacts consonance/harmony-linux/build/x86_64 \
            --output nested-runtime-report/platform-provenance.json
          scope=$(python3 -c 'import json; print(json.load(open("nested-runtime-report/platform-provenance.json"))["scope"])')
          if [[ "$scope" != exact-input ]]; then
            echo "::error::Nested runtime qualification requires exact-input platform artifacts (got $scope)."
            exit 1
          fi
          sha256sum \
            consonance/harmony-linux/build/x86_64/bzImage \
            consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
            consonance/harmony-linux/build/x86_64/runtime-manifest.json \
            >nested-runtime-report/platform-sha256.txt
      - name: Restore the exact diagnostic workload image artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          artifact-ids: 10309292148
          run-id: 34729120767
          path: exact-workload-artifact
      - name: Stage and verify the exact diagnostic workload images
        run: |
          set -euo pipefail
          image_dir=$(find exact-workload-artifact -type d \
            -path '*/consonance/harmony-linux/build/oci-images' -print -quit)
          test -n "$image_dir"
          for image in docker k3s; do
            test -d "$image_dir/$image.oci"
            test -s "$image_dir/$image.oci/index.json"
            test -s "$image_dir/$image.oci/oci-layout"
          done
          rm -rf consonance/harmony-linux/build/oci-images
          mkdir -p consonance/harmony-linux/build
          cp -a "$image_dir" consonance/harmony-linux/build/oci-images
          cat >nested-runtime-report/workload-artifact.txt <<'EOF'
          artifact_id=10309292148
          source_run=34729120767
          source_head=ec4e989ee70fe1e7d7130a8181425f8fa13f58b8
          purpose=diagnostic image input; no qualification result is implied
          EOF
          find consonance/harmony-linux/build/oci-images -type f -print0 \
            | sort -z | xargs -0r sha256sum >nested-runtime-report/workload-layouts.sha256
      - name: Verify workload image layouts
        run: |
          set -euo pipefail
          for image in docker k3s; do
            layout="consonance/harmony-linux/build/oci-images/${image}.oci"
            test -d "$layout"
            test -s "$layout/index.json"
            test -s "$layout/oci-layout"
          done
      - name: Build Harmony CLI
        run: |
          set -euo pipefail
          cargo build --locked --release -p harmony-cli 2>&1 \
            | tee nested-runtime-report/cli-build.log
      - name: Grant nested KVM access
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          stat -c '%n mode=%a owner=%U group=%G' /dev/kvm \
            | tee nested-runtime-report/kvm.txt
          grep -m1 'model name' /proc/cpuinfo | tee nested-runtime-report/runner.txt
      - name: Verify CLI host and guest preflight
        run: |
          set -euo pipefail
          target/release/harmony preflight --json \
            | tee nested-runtime-report/preflight.json
      - name: Trace nested startup using unchanged image contents
        run: |
          set -uo pipefail
          report=nested-runtime-report
          status=0
          timeout -k 10 360 target/release/harmony oci run \
            consonance/harmony-linux/build/oci-images/docker.oci \
            --seed 20260901 --ram-mib 2048 --timeout 300 --console \
            --out "$report/runs/docker-trace" -- \
            /bin/sh -x /usr/local/bin/docker-workload.sh \
            2>&1 | tee "$report/console/docker-trace.txt" || status=1
          # shellcheck disable=SC2016
          timeout -k 10 360 target/release/harmony oci run \
            consonance/harmony-linux/build/oci-images/k3s.oci \
            --seed 20260901 --ram-mib 2048 --timeout 300 --console \
            --out "$report/runs/k3s-trace" -- /bin/sh -c '
              /bin/sh -x /usr/local/bin/k3s-workload.sh &
              workload_pid=$!
              while /bin/busybox kill -0 "$workload_pid" 2>/dev/null; do
                /bin/busybox sleep 2
                /bin/busybox echo DIAGNOSTIC_K3S_LOG
                /bin/busybox tail -60 /run/k3s.log 2>/dev/null
                /bin/busybox echo DIAGNOSTIC_PROCESSES
                /bin/busybox ps
              done
              wait "$workload_pid"
            ' 2>&1 | tee "$report/console/k3s-trace.txt" || status=1
          echo "Diagnostic status=$status; this run is not acceptance evidence"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nested-runtime-diagnostics-${{ github.run_id }}
          path: |
            nested-runtime-report
          if-no-files-found: warn
          retention-days: 30
