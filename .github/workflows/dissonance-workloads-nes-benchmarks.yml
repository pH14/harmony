# SPDX-License-Identifier: AGPL-3.0-or-later
name: Benchmarks / Dissonance Workloads / NES

# Full NES capability searches through the Dissonance adapter against native
# QuickNES. Bounded per-pull-request coverage of the same composition lives in
# Checks / Dissonance Workloads / NES. This public panel uses only source-built
# games; licensed runs stay on the private host through
# benchmarks/search/run-private.sh.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      panel:
        description: Public source-built search panel
        type: choice
        options: [public]
        default: public
        required: true

permissions:
  contents: read

concurrency:
  group: nes-search-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  public:
    name: ${{ matrix.name }}
    if: github.event_name == 'schedule' || inputs.panel == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        include:
          - { name: Nova — Level 1, case: nova-level-1 }
          - { name: Nova — Level 9, case: nova-level-9 }
          - { name: Nova — Level 17, case: nova-level-17 }
          - { name: Nova — Level 25, case: nova-level-25 }
          - { name: Nova — Level 33, case: nova-level-33 }
          - { name: Nova — Full Game, case: nova-full }
          - { name: STB — Easy, case: stb-easy }
          - { name: STB — Fair, case: stb-fair }
          - { name: STB — Hard, case: stb-hard, require_victory: true }
    env:
      ASSET_ROOT: /tmp/nes-search-assets
      BUILD_ROOT: /tmp/nes-search-build
      RUN_ROOT: /tmp/nes-search-runs
      PUBLIC_ROOT: /tmp/nes-search-public
      NES_CASE: ${{ matrix.case }}
      HARMONY_STB_BUILD_JOBS: "2"
      HARMONY_QUICKNES_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install source build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cc65 curl ffmpeg git python3 python3-pil unzip
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workloads/nes -> target
      - name: Reproduce source-built games and pinned core
        run: |
          set -euo pipefail
          case "$NES_CASE" in
            nova-*) workloads/nes/scripts/build-nova-rom.sh "${ASSET_ROOT}/nova" ;;
            stb-*) workloads/nes/scripts/build-stb-rom.sh "${ASSET_ROOT}/stb" ;;
            *) echo "Unregistered public NES case: $NES_CASE" >&2; exit 1 ;;
          esac
          scripts/build-quicknes-core.sh "${ASSET_ROOT}/quicknes_libretro.so"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/nes-search-assets')
          files = {
              'core': root / 'quicknes_libretro.so',
          }
          for game in ('nova', 'stb'):
              rom = root / game / (game + '.nes')
              if rom.is_file():
                  files[game] = rom
          inventory = {
              name: {'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
              for name, path in files.items()
          }
          (root / 'inventory.json').write_text(json.dumps(inventory, sort_keys=True))
          PY
      - name: Build an identified evaluation executable
        run: python3 benchmarks/search/eval.py build --out "${BUILD_ROOT}" --jobs 2
      - name: Run the registered source-built panel
        run: |
          set +e
          python3 benchmarks/search/eval.py run benchmarks/search/nightly.json --case '${{ matrix.case }}' \
            --assets "${ASSET_ROOT}/inventory.json" \
            --binary "${BUILD_ROOT}/nes-eval" \
            --build-info "${BUILD_ROOT}/build-info.json" \
            --out "${RUN_ROOT}" --jobs 4 --cpus 4 \
            --memory-capacity-mib 8192 --finish-seconds 120
          status=$?
          echo "run_status=${status}" >>"${GITHUB_ENV}"
          exit "${status}"
      - name: Render each scenario's own recorded input with game audio
        if: always()
        uses: ./.github/actions/nes-film
        with:
          matrix: ${{ env.RUN_ROOT }}
          binary: ${{ env.BUILD_ROOT }}/nes-film
          max-frames: "72000"
          min-seconds: "5"
      - name: Export compact roster and report
        if: always()
        run: |
          set -euo pipefail
          if [[ -f "${RUN_ROOT}/results.json" ]]; then
            python3 benchmarks/search/eval.py export "${RUN_ROOT}" --out "${PUBLIC_ROOT}"
          else
            echo 'The common runner produced no matrix index.' >&2
            exit 1
          fi
          case "$NES_CASE" in
            nova-*)
              cp workloads/nes/NOVA-ARTIFACT-LICENSE.md "${PUBLIC_ROOT}/ARTIFACT-LICENSE.md"
              cp workloads/nes/nova-versions.env "${PUBLIC_ROOT}/"
              ;;
            stb-*)
              cp workloads/nes/STB-ARTIFACT-LICENSE.md "${PUBLIC_ROOT}/ARTIFACT-LICENSE.md"
              cp "${ASSET_ROOT}/stb/UPSTREAM-LICENSE.txt" "${ASSET_ROOT}/stb/UPSTREAM-CREDITS.asm" \
                "${ASSET_ROOT}/stb/stb-versions.env" "${PUBLIC_ROOT}/"
              ;;
          esac
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/nes-search-public')
          checksums = json.loads((root / 'checksums.json').read_text())
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name != 'checksums.json':
                  checksums[str(path.relative_to(root))] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / 'checksums.json').write_text(json.dumps(checksums, sort_keys=True, separators=(',', ':')))
          PY
      - name: Require the declared capability outcome
        if: matrix.require_victory
        env:
          CASE: ${{ matrix.case }}
        run: |
          python3 - "${PUBLIC_ROOT}/roster.json" <<'PY'
          import json
          import os
          import sys

          case = os.environ["CASE"]
          rows = [row for row in json.load(open(sys.argv[1])) if row["case"] == case]
          if not rows:
              raise SystemExit(f"{case}: the panel produced no rows")
          solved = [row for row in rows if row.get("solved")]
          if not solved:
              outcomes = ", ".join(sorted({row["outcome"] for row in rows}))
              raise SystemExit(
                  f"{case}: no registered seed reached a victory; outcomes were {outcomes}"
              )
          print(f"{case}: {len(solved)} of {len(rows)} seeds reached a victory")
          PY
      - name: Publish run summary
        if: always()
        run: |
          if [[ -f "${PUBLIC_ROOT}/roster.json" ]]; then
            python3 - "${PUBLIC_ROOT}/roster.json" <<'PY' >>"${GITHUB_STEP_SUMMARY}"
          import json
          import sys
          from collections import Counter

          rows = json.load(open(sys.argv[1]))
          counts = Counter(row['outcome'] for row in rows)
          print('## Source-built NES capability panel')
          print()
          print(f"{len(rows)} registered seed/case rows; outcomes: {dict(sorted(counts.items()))}")
          print('The full roster, per-case budgets, progress, replay confirmation, resources and failures are in the artifact report.')
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nes-public-search-${{ matrix.case }}-${{ github.run_id }}
          path: /tmp/nes-search-public
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Results
    needs: [public]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: nes-public-search-*-${{ github.run_id }}
          path: nes-benchmark-report/cases
      - name: Merge case rosters and account for missing evidence
        run: python3 scripts/nes-nightly-report.py --cases nes-benchmark-report/cases --out nes-benchmark-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nes-public-roster-${{ github.run_id }}
          path: nes-benchmark-report
          if-no-files-found: error
          retention-days: 30
      - uses: actions/github-script@v7
        if: always()
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/benchmark-report.cjs`)({github, context, core});
