# SPDX-License-Identifier: AGPL-3.0-or-later
name: Acceptance / OCI

# End-to-end `harmony oci run` on a GitHub-hosted x86-64 runner: standard
# Linux runners expose /dev/kvm through nested virtualization, a proven
# support-matrix cell (docs/DETERMINISM.md §4). Asserts the product claim
# directly: same seed, same digest; different seed, different digest.
#
# The guest kernel + initramfs build takes ~30 minutes cold, so it is cached
# across runs keyed by its build inputs; a cache hit makes the whole job a
# CLI build plus four guest runs.
on:
  pull_request:
    paths:
      - "cli/**"
      - "consonance/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/oci-smoke.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "consonance/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/oci-smoke.yml"
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

concurrency:
  group: oci-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0

jobs:
  smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: Grant /dev/kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compute guest cache key
        id: guest-key
        run: echo "key=oci-smoke-guest-${{ hashFiles('consonance/harmony-linux/**') }}" >>"${GITHUB_OUTPUT}"
      - name: Restore guest artifacts
        id: guest
        uses: actions/cache@v4
        with:
          path: |
            consonance/harmony-linux/build/bzImage
            consonance/harmony-linux/build/initramfs-postgres.cpio.gz
            consonance/harmony-linux/build/oci-smoke-manifest.sha256
          key: ${{ steps.guest-key.outputs.key }}
          restore-keys: |
            oci-smoke-guest-manifest-
            oci-smoke-guest-
      - name: Build guest artifacts
        if: steps.guest.outputs.cache-hit != 'true'
        # The counter-opcode scan baselines are per-toolchain; select the
        # runner-toolchain (gcc 13) lists instead of the box defaults.
        env:
          HARMONY_RDTSC_ALLOWLIST: ${{ github.workspace }}/consonance/harmony-linux/linux/rdtsc-allowlist-gha.txt
          HARMONY_RDRAND_ALLOWLIST: ${{ github.workspace }}/consonance/harmony-linux/linux/rdrand-allowlist-gha.txt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libelf-dev libssl-dev bc cpio kmod bzip2 wget
          make -C consonance/harmony-linux fetch
          make -C consonance/harmony-linux kernel
      # The postgres image copies the runtime shared-library closure from the
      # build host, and the pinned build environment is Debian trixie (the
      # trixie debs need its libicu). Build it in a trixie container as
      # consonance/harmony-linux/README.md describes the guest build prerequisites for non-box hosts.
      - name: Build postgres image (trixie container)
        if: steps.guest.outputs.cache-hit != 'true'
        run: |
          sudo docker run --rm -v "$PWD:/work" -w /work debian:trixie bash -euc '
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential bzip2 gzip cpio kmod e2fsprogs util-linux locales
            # The image build extracts the pinned debs and copies their
            # shared-library closure from the host /lib; installing the same
            # debs pulls that closure (libicu and friends) into the container.
            apt-get install -y --no-install-recommends \
              ./consonance/harmony-linux/dl/*.deb
            echo "en_US.UTF-8 UTF-8" >/etc/locale.gen && locale-gen
            make -C consonance/harmony-linux postgres-image'
      - name: Stage guest artifacts
        run: |
          set -euo pipefail
          (cd consonance/harmony-linux/build && sha256sum bzImage initramfs-postgres.cpio.gz >oci-smoke-manifest.sha256)
          mkdir -p consonance/harmony-linux/build/x86_64
          cp consonance/harmony-linux/build/bzImage \
             consonance/harmony-linux/build/initramfs-postgres.cpio.gz \
             consonance/harmony-linux/build/x86_64/
      - name: Promote a manifest-bearing guest cache for fallback restores
        if: steps.guest.outputs.cache-hit == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            consonance/harmony-linux/build/bzImage
            consonance/harmony-linux/build/initramfs-postgres.cpio.gz
            consonance/harmony-linux/build/oci-smoke-manifest.sha256
          key: oci-smoke-guest-manifest-${{ steps.guest-key.outputs.key }}

      - name: Build CLI
        run: cargo build --release -p harmony-cli
      - name: Preflight
        run: ./target/release/harmony preflight
      - name: Determinism smoke
        run: |
          # The workload reads guest randomness so the digest depends on the
          # seed: the same seed must reproduce it, a different seed must not.
          # timeout(1) is an independent backstop for the CLI watchdog.
          run() {
            timeout 660 ./target/release/harmony oci run alpine:3 --seed "$1" \
              --timeout 600 --out "run-$2" -- /bin/sh -c \
              'echo oci-smoke; head -c 16 /dev/urandom | od -An -tx1' \
              | tee "run-$2/console.txt"
          }
          mkdir -p run-a run-b run-c run-d
          run 0 a
          run 0 b
          run 7 c
          run 7 d
          digest() { awk '/^digest/{print $2}' "run-$1/console.txt"; }
          # A missing digest must fail here rather than compare equal to
          # another missing one.
          for r in a b c d; do
            d=$(digest "$r")
            [[ "$d" =~ ^[0-9a-f]{64}$ ]] || {
              echo "run-$r: no digest in the console output (got '$d')"
              exit 1
            }
          done
          # The workload ran, and it emitted the guest randomness the
          # seed-divergence check reads.
          grep -q oci-smoke run-a/console.txt
          grep -Eq '^ [0-9a-f]{2} ' run-a/console.txt
          [ "$(digest a)" = "$(digest b)" ]
          [ "$(digest c)" = "$(digest d)" ]
          [ "$(digest a)" != "$(digest c)" ]
          cmp run-a/serial.log run-b/serial.log
          cmp run-c/serial.log run-d/serial.log
          if cmp -s run-a/serial.log run-c/serial.log; then
            echo "seed 0 and seed 7 produced identical serial output"
            exit 1
          fi
          echo "seed 0 reproduced $(digest a); seed 7 reproduced $(digest c); seeds diverged"
      - name: Blocked-vCPU timeout regression
        run: |
          mkdir -p run-timeout
          set +e
          timeout 45 ./target/release/harmony oci run alpine:3 --seed 0 \
            --timeout 15 --out run-timeout -- /bin/sh -c 'while :; do :; done' \
            >run-timeout/console.txt 2>&1
          status=$?
          set -e
          [ "$status" -ne 0 ] && [ "$status" -ne 124 ]
          grep -q 'wall budget of 15s exhausted' run-timeout/console.txt
          grep -q 'HARMONY_OCI: start' run-timeout/serial.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: oci-smoke-runs
          path: run-*

  pr-smoke:
    name: harmony oci run smoke
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize smoke artifact directory
        run: mkdir -p oci-pr-smoke
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: Grant /dev/kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Restore the locked OCI guest artifacts
        id: guest-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            consonance/harmony-linux/build/bzImage
            consonance/harmony-linux/build/initramfs-postgres.cpio.gz
            consonance/harmony-linux/build/oci-smoke-manifest.sha256
          key: oci-smoke-guest-${{ hashFiles('consonance/harmony-linux/**') }}
          restore-keys: |
            oci-smoke-guest-manifest-
            oci-smoke-guest-
      - name: Restore a legacy guest cache
        id: legacy-guest-cache
        if: steps.guest-cache.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            consonance/harmony-linux/build/bzImage
            consonance/harmony-linux/build/initramfs-postgres.cpio.gz
          key: oci-smoke-guest-${{ hashFiles('consonance/harmony-linux/linux/**', 'consonance/harmony-linux/Makefile', 'consonance/harmony-linux/scripts/**') }}
          restore-keys: |
            oci-smoke-guest-
      - name: Verify and record OCI guest cache provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          PRIMARY_CACHE_HIT: ${{ steps.guest-cache.outputs.cache-hit }}
          PRIMARY_MATCHED_KEY: ${{ steps.guest-cache.outputs.cache-matched-key }}
          LEGACY_CACHE_HIT: ${{ steps.legacy-guest-cache.outputs.cache-hit }}
          LEGACY_MATCHED_KEY: ${{ steps.legacy-guest-cache.outputs.cache-matched-key }}
          CACHE_REQUESTED_KEY: oci-smoke-guest-${{ hashFiles('consonance/harmony-linux/**') }}
        run: |
          set -euo pipefail
          CACHE_HIT=${PRIMARY_CACHE_HIT}
          CACHE_MATCHED_KEY=${PRIMARY_MATCHED_KEY}
          if [[ -z "${CACHE_MATCHED_KEY}" ]]; then
            CACHE_HIT=${LEGACY_CACHE_HIT}
            CACHE_MATCHED_KEY=${LEGACY_MATCHED_KEY}
          fi
          if [[ -z "${CACHE_MATCHED_KEY}" ]]; then
            cat >oci-pr-smoke/cache-unavailable.txt <<'EOF'
          No exact or last-known-good OCI guest cache was available. The scheduled/manual deep builder must populate the durable guest cache before this smoke can execute.
          EOF
            echo '::error::OCI PR smoke found no durable guest cache fallback.'
            exit 1
          fi
          mkdir -p oci-pr-smoke
          manifest_verified=false
          legacy_cache=false
          test -s consonance/harmony-linux/build/bzImage
          test -s consonance/harmony-linux/build/initramfs-postgres.cpio.gz
          if [[ -s consonance/harmony-linux/build/oci-smoke-manifest.sha256 ]]; then
            (cd consonance/harmony-linux/build && sha256sum -c oci-smoke-manifest.sha256)
            manifest_verified=true
          else
            legacy_cache=true
            if [[ "${CACHE_HIT}" == true ]]; then
              echo '::warning::Using an exact-key legacy OCI guest cache without a manifest; required-file presence is the available validation.'
            else
              echo '::warning::Using a legacy OCI guest cache without a manifest; required-file presence is the available validation.'
            fi
          fi
          changed=false
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            git diff --name-only "${BASE_SHA}"...HEAD >oci-pr-smoke/changed-files.txt
          elif [[ "${EVENT_NAME}" == push && "${BEFORE_SHA}" != 0000000000000000000000000000000000000000 ]]; then
            git diff --name-only "${BEFORE_SHA}" HEAD >oci-pr-smoke/changed-files.txt
          else
            : >oci-pr-smoke/changed-files.txt
          fi
          while IFS= read -r path; do
            case "${path}" in
              consonance/harmony-linux/*)
                changed=true
                ;;
            esac
          done <oci-pr-smoke/changed-files.txt
          provenance=exact-input
          validation_scope=guest-inputs-validated
          if [[ "${legacy_cache}" == true ]]; then
            provenance=legacy-cache-file-presence-only
            validation_scope=legacy-cache-file-presence-only
          fi
          if [[ "${CACHE_HIT}" != true ]]; then
            if [[ "${legacy_cache}" == true ]]; then
              provenance=legacy-last-known-good-cache-fallback
            else
              provenance=last-known-good-cache-fallback
            fi
            validation_scope=guest-inputs-validated-from-last-known-good
            if [[ "${changed}" == true ]]; then
              validation_scope=guest-inputs-not-validated-for-changed-source
            elif [[ "${legacy_cache}" == true ]]; then
              validation_scope=legacy-last-known-good-file-presence-only
            fi
            echo '::warning::Using the last-known-good guest cache; guest source changes are covered by the scheduled/manual deep builder.'
          fi
          cat >oci-pr-smoke/cache-provenance.txt <<EOF
          requested_key=${CACHE_REQUESTED_KEY}
          matched_key=${CACHE_MATCHED_KEY}
          cache_hit=${CACHE_HIT}
          provenance=${provenance}
          manifest_verified=${manifest_verified}
          legacy_cache=${legacy_cache}
          fixture_source_changed=${changed}
          validation_scope=${validation_scope}
          commit=$(git rev-parse HEAD)
          EOF
      - name: Stage and verify the locked guest artifacts
        run: |
          set -euo pipefail
          mkdir -p consonance/harmony-linux/build/x86_64
          cp consonance/harmony-linux/build/bzImage \
            consonance/harmony-linux/build/initramfs-postgres.cpio.gz \
            consonance/harmony-linux/build/x86_64/
          test -s consonance/harmony-linux/build/x86_64/bzImage
          test -s consonance/harmony-linux/build/x86_64/initramfs-postgres.cpio.gz
      - name: Run one real product CLI OCI workload
        run: |
          set -euo pipefail
          mkdir -p oci-pr-smoke
          cargo build --locked --release -p harmony-cli
          ./target/release/harmony preflight | tee oci-pr-smoke/preflight.txt
          timeout -k 10 45 ./target/release/harmony oci run alpine:3 \
            --seed 0 --timeout 15 --out oci-pr-smoke -- /bin/sh -c \
            'echo oci-pr-smoke; head -c 8 /dev/urandom | od -An -tx1' \
            2>&1 | tee oci-pr-smoke/console.txt
          grep -q oci-pr-smoke oci-pr-smoke/console.txt
          digest=$(awk '/^digest/{print $2}' oci-pr-smoke/console.txt)
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          test -s oci-pr-smoke/serial.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oci-pr-smoke-${{ github.run_id }}
          path: oci-pr-smoke
          if-no-files-found: error
          retention-days: 14
