# SPDX-License-Identifier: AGPL-3.0-or-later
name: Acceptance / Consonance platform

on:
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0
  HARMONY_GUEST_TOOLCHAIN: nightly-2026-06-16
  HARMONY_PLATFORM_KERNEL: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64/bzImage
  HARMONY_PLATFORM_INITRAMFS: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz
  HARMONY_PLATFORM_FIXTURE: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64/fixture

jobs:
  build-and-qualify:
    name: Exact runtime build and extended replay
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "$HARMONY_RUST_TOOLCHAIN" --profile minimal
          rustup default "$HARMONY_RUST_TOOLCHAIN"
          rustup toolchain install "$HARMONY_GUEST_TOOLCHAIN" --profile minimal --component rust-src --target x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Compute platform source key
        id: source
        run: echo "key=$(python3 consonance/harmony-linux/scripts/runtime-artifacts.py source-key --architecture x86_64)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: runtime
        with:
          path: consonance/harmony-linux/build/x86_64
          key: consonance-platform-v1-x86_64-${{ steps.source.outputs.key }}
      - name: Build exact platform artifacts
        if: steps.runtime.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cpio python3
          consonance/harmony-linux/scripts/build-platform-runtime.sh --runtime-payloads "$PWD/runtime-payloads"
          export HARMONY_NIX_RUNTIME_INIT="$PWD/runtime-payloads/init.sh"
          export HARMONY_NIX_RUNTIME_SUPERVISOR="$PWD/runtime-payloads/harmony-supervisor"
          export HARMONY_NIX_RUNTIME_MANIFEST="$PWD/runtime-payloads/runtime-payloads.json"
          nix run .#guest-images -- --oci-runtime --output "$PWD/nix-guest-output"
          consonance/harmony-linux/scripts/build-platform-runtime.sh --from-nix "$PWD/nix-guest-output"
      - name: Verify exact source and artifact manifest
        run: |
          python3 consonance/harmony-linux/scripts/runtime-artifacts.py verify --architecture x86_64 \
            --artifacts consonance/harmony-linux/build/x86_64 --output platform-smoke/provenance.json
          python3 -c 'import json; assert json.load(open("platform-smoke/provenance.json"))["scope"] == "exact-input"'
      - name: Enable hardware backend
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Extended platform replay
        run: |
          set -o pipefail
          for repetition in 1 2 3; do
            timeout -k 10 720 cargo test --locked --release -p oci-support --test platform --test process_platform -- --ignored --nocapture \
              2>&1 | tee "platform-smoke/replay-$repetition.log"
          done
      - name: Publish qualified exact artifacts
        uses: actions/upload-artifact@v4
        with:
          name: consonance-platform-v1-x86_64-${{ steps.source.outputs.key }}
          path: consonance/harmony-linux/build/x86_64
          if-no-files-found: error
          retention-days: 30
      - uses: actions/cache/save@v4
        if: steps.runtime.outputs.cache-hit != 'true'
        with:
          path: consonance/harmony-linux/build/x86_64
          key: consonance-platform-v1-x86_64-${{ steps.source.outputs.key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-qualification-${{ github.run_id }}
          path: platform-smoke
          if-no-files-found: warn
          retention-days: 14
