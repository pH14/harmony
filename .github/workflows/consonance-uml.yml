# SPDX-License-Identifier: AGPL-3.0-or-later
name: Diagnostics / Exact UML785 AMD Core

on:
  workflow_dispatch:
    inputs:
      checkpoint_attempts:
        description: Maximum checkpoint suites; stop at the first failure
        type: choice
        options: ['1', '2', '3']
        default: '2'

permissions:
  contents: read
  actions: read

jobs:
  amd-core:
    name: Exact retained UML artifact on AMD
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39259407907
          name: uml-artifacts-7e18c3820d644d44aa3e55e4655391895cfcd784-x86_64
          path: ${{ runner.temp }}/uml785-exact
      - name: Check collector controls
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/diagnostics -p 'test_uml785_*.py'
      - name: Install executable-filtered bounded core collector
        run: |
          set -euo pipefail
          core_root="/var/tmp/uml785-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CORE_ROOT=$core_root" >> "$GITHUB_ENV"
          export UML785_UID="$(id -u)" UML785_CORE_ROOT="$core_root"
          python3 - "$RUNNER_TEMP/uml785-exact" "$RUNNER_TEMP/core-config.json" <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys
          spec = importlib.util.spec_from_file_location('runner', 'scripts/diagnostics/run-uml785-core.py')
          runner = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(runner)
          bundle = Path(sys.argv[1])
          runner.hashes(bundle)
          config = {
              'uid': int(os.environ['UML785_UID']),
              'output': os.environ['UML785_CORE_ROOT'] + '/cores',
              'executables': {runner.EXPECTED[name]: name for name in ('linux', 'harmony-uml-qualify')},
              'count_limit': 2,
              'per_core_limit': 2 * 1024**3,
              'total_limit': 4 * 1024**3,
          }
          Path(sys.argv[2]).write_text(json.dumps(config))
          PY
          sudo install -d -m 0755 "$core_root" "$core_root/cores"
          sudo install -m 0755 scripts/diagnostics/uml785-core-collector.py "$core_root/collect"
          sudo install -m 0644 "$RUNNER_TEMP/core-config.json" "$core_root/config.json"
          sudo python3 - "$core_root" <<'PY'
          import json
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          settings = {name: Path('/proc/sys/kernel', name).read_text()
                      for name in ('core_pattern', 'core_pipe_limit')}
          (root / 'original-settings.json').write_text(json.dumps(settings))
          pattern = f'|{root}/collect %P %u %t'
          assert len(pattern) < 127
          Path('/proc/sys/kernel/core_pipe_limit').write_text('4\n')
          Path('/proc/sys/kernel/core_pattern').write_text(pattern + '\n')
          PY
          sudo chown root:root "$RUNNER_TEMP/uml785-exact" "$RUNNER_TEMP/uml785-exact/"*
          sudo chmod 0755 "$RUNNER_TEMP/uml785-exact" "$RUNNER_TEMP/uml785-exact/linux" "$RUNNER_TEMP/uml785-exact/harmony-uml-qualify"
          sudo chmod 0644 "$RUNNER_TEMP/uml785-exact/config" "$RUNNER_TEMP/uml785-exact/profile.json" "$RUNNER_TEMP/uml785-exact/initramfs.cpio.gz"
      - name: Run ordinary-UID checkpoint diagnostics without tracing
        env:
          MAX_CHECKPOINT_ATTEMPTS: ${{ inputs.checkpoint_attempts }}
        run: |
          set -euo pipefail
          python3 scripts/diagnostics/run-uml785-core.py "$RUNNER_TEMP/uml785-exact" \
            "$RUNNER_TEMP/uml785-evidence" "$MAX_CHECKPOINT_ATTEMPTS"
      - name: Restore host core settings
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${CORE_ROOT:-}" ] && sudo test -f "$CORE_ROOT/original-settings.json"; then
            sudo python3 - "$CORE_ROOT/original-settings.json" <<'PY'
          import json
          from pathlib import Path
          import sys
          for name, value in json.loads(Path(sys.argv[1]).read_text()).items():
              Path('/proc/sys/kernel', name).write_text(value)
          PY
            mkdir -p "$RUNNER_TEMP/uml785-evidence"
            sudo cat "$CORE_ROOT/original-settings.json" > "$RUNNER_TEMP/uml785-evidence/original-core-settings.json"
            sysctl kernel.core_pattern kernel.core_pipe_limit > "$RUNNER_TEMP/uml785-evidence/restored-core-settings.txt"
          fi
      - name: Read matching core notes with automatic script loading disabled
        if: always()
        run: |
          set -euo pipefail
          if [ -z "${CORE_ROOT:-}" ] || [ ! -d "$CORE_ROOT/cores" ]; then exit 0; fi
          if ! compgen -G "$CORE_ROOT/cores/*.core" >/dev/null; then exit 0; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
          export DEBUGINFOD_URLS=''
          python3 - "$CORE_ROOT/cores" "$RUNNER_TEMP/uml785-exact" "$RUNNER_TEMP/uml785-evidence/core-analysis" <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          cores, bundle, analysis = map(Path, sys.argv[1:])
          analysis.mkdir(parents=True, exist_ok=True)
          for metadata_path in cores.glob('*.json'):
              metadata = json.loads(metadata_path.read_text())
              core = metadata_path.with_suffix('.core')
              executable = bundle / metadata['role']
              with executable.open('rb') as source:
                  assert hashlib.file_digest(source, 'sha256').hexdigest() == metadata['executable_sha256']
              with core.open('rb') as source:
                  assert hashlib.file_digest(source, 'sha256').hexdigest() == metadata['sha256']
              with (analysis / metadata_path.with_suffix('.gdb.txt').name).open('wb') as output:
                  output.write(f"core truncated={metadata['truncated']}; retained bytes={metadata['bytes']}\n".encode())
                  output.flush()
                  result = subprocess.run([
                      'timeout', '--kill-after=5', '45', 'gdb', '-nx', '-nh', '--batch',
                      '-iex', 'set auto-load off', '-iex', 'set debuginfod enabled off',
                      str(executable), str(core), '-ex', 'info registers',
                      '-ex', 'thread apply all bt 24', '-ex', 'info proc mappings',
                  ], stdout=output, stderr=subprocess.STDOUT)
                  output.write(f'\ngdb exit={result.returncode}\n'.encode())
          PY
      - name: Preserve only exact owned-fixture diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uml785-core-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/uml785-evidence/host-*.txt
            ${{ runner.temp }}/uml785-evidence/outcome.json
            ${{ runner.temp }}/uml785-evidence/original-core-settings.json
            ${{ runner.temp }}/uml785-evidence/restored-core-settings.txt
            ${{ runner.temp }}/uml785-evidence/**/report.json
            ${{ runner.temp }}/uml785-evidence/**/execution.log
            ${{ runner.temp }}/uml785-evidence/**/command.json
            ${{ env.CORE_ROOT }}/cores/*.core
            ${{ env.CORE_ROOT }}/cores/*.json
            ${{ runner.temp }}/uml785-evidence/core-analysis/*.gdb.txt
          compression-level: 1
          if-no-files-found: warn
          retention-days: 7
