name: Checks

on:
  pull_request:
    paths:
      - consonance/vmm-core/**
      - consonance/hypercall-doorbell/**
      - consonance/client/**
      - consonance/vm-state/**
      - consonance/vmm-backend/**
      - consonance/snapshot-store/**
      - workloads/nes-machine/**
      - workloads/nes-guest/**
      - consonance/harmony-linux/**
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - rust-toolchain
      - rust-toolchain.toml
      - flake.nix
      - flake.lock
      - .cargo/**
      - clippy.toml
      - deny.toml
      - .github/workflows/nightly.yml
      - .github/actions/ci-scope/**
      - scripts/ci-job-scope.py
      - scripts/test_ci_job_scope.py
      - scripts/miri_scope.py
      - scripts/test_miri_scope.py
jobs:
  miri-pr:
    name: Memory safety — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        name: [vmm-core, hypercall-doorbell, consonance-client, vm-state, vmm-backend, snapshot-store, machine, nes-guest, harmony-supervisor]
    env:
      PINNED_NIGHTLY: nightly-2026-06-16
      HARMONY_MIRI_PR_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Determine whether this test is applicable
        id: scope
        uses: ./.github/actions/ci-scope
        with:
          kind: miri
          target: ${{ matrix.name }}
      - name: Install pinned nightly + Miri
        if: steps.scope.outputs.enabled == 'true'
        run: |
          rustup toolchain install "${PINNED_NIGHTLY}" --profile minimal --component miri
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.enabled == 'true'
      - name: Run the affected crate's Miri tests
        if: steps.scope.outputs.enabled == 'true'
        env:
          MIRIFLAGS: ${{ steps.scope.outputs.miriflags }}
          MIRI_COMMAND: ${{ steps.scope.outputs.command }}
        run: |
          set -euo pipefail
          read -r -a command <<<"${MIRI_COMMAND}"
          cargo "+${PINNED_NIGHTLY}" miri test "${command[@]}"
