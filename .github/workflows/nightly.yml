name: Checks / Memory safety

on:
  pull_request:
    paths:
      - consonance/vmm-core/**
      - consonance/hypercall-doorbell/**
      - consonance/client/**
      - consonance/vm-state/**
      - consonance/vmm-backend/**
      - consonance/snapshot-store/**
      - workloads/nes-machine/**
      - workloads/nes-guest/**
      - consonance/harmony-linux/**
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - rust-toolchain
      - rust-toolchain.toml
      - flake.nix
      - flake.lock
      - .cargo/**
      - clippy.toml
      - deny.toml
      - .github/workflows/nightly.yml
jobs:
  miri-scope:
    name: select affected Miri targets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-targets: ${{ steps.select.outputs.has-targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Miri targets from changed inputs
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "${BASE_SHA}"...HEAD >changed-files.txt
          matrix=$(python3 scripts/miri_scope.py <changed-files.txt)
          echo "matrix=${matrix}" >>"${GITHUB_OUTPUT}"
          if [[ "${matrix}" == '{"include":[]}' ]]; then
            echo 'has-targets=false' >>"${GITHUB_OUTPUT}"
          else
            echo 'has-targets=true' >>"${GITHUB_OUTPUT}"
          fi
          echo "Miri matrix: ${matrix}"

  miri-pr:
    name: miri PR — ${{ matrix.name }}
    needs: miri-scope
    if: needs.miri-scope.outputs.has-targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.miri-scope.outputs.matrix) }}
    env:
      PINNED_NIGHTLY: nightly-2026-06-16
      HARMONY_MIRI_PR_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly + Miri
        run: |
          rustup toolchain install "${PINNED_NIGHTLY}" --profile minimal --component miri
      - uses: Swatinem/rust-cache@v2
      - name: Run the affected crate's Miri tests
        env:
          MIRIFLAGS: ${{ matrix.miriflags }}
          MIRI_COMMAND: ${{ matrix.command }}
        run: |
          set -euo pipefail
          read -r -a command <<<"${MIRI_COMMAND}"
          cargo "+${PINNED_NIGHTLY}" miri test "${command[@]}"
