# SPDX-License-Identifier: AGPL-3.0-or-later
# NES games searched through the Dissonance adapter against native QuickNES.
# Full capability searches live in the matching Benchmarks workflow.
name: Checks / Dissonance Workloads / NES

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: dissonance-nes-checks-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0

jobs:
  stb:
    name: STB
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STB_BUILD: workloads/nes/build/stb
      STB_ARTIFACT: workloads/nes/build/stb-check-artifact
      STB_EXECUTIONS: "4"
      STB_REQUIRE_VICTORY: "false"
      STB_SEED: "1"
      STB_AI: easy
      STB_AI_LEVEL: "1"
      STB_WORKERS: "1"
      STB_WALL_SECONDS: "180"
      HARMONY_STB_BUILD_JOBS: "2"
      HARMONY_QUICKNES_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Determine whether this check is applicable
        id: scope
        uses: ./.github/actions/ci-scope
        with:
          kind: dissonance_stb
      - name: Initialize the evidence directory
        if: steps.scope.outputs.enabled == 'true'
        run: mkdir -p "${STB_ARTIFACT}"
      - uses: ./.github/actions/stb-evaluation
        if: steps.scope.outputs.enabled == 'true'
