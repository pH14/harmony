# SPDX-License-Identifier: AGPL-3.0-or-later
name: Smoke / Products
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: product-smoke-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  HARMONY_RUST_TOOLCHAIN: 1.97.0
  HARMONY_PLATFORM_KERNEL: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64/bzImage
  HARMONY_PLATFORM_INITRAMFS: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz
  HARMONY_PLATFORM_FIXTURE: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64/fixture
  CASE_DIR: workloads/bugs/historical/postgres-cic-corruption
jobs:
  scope:
    name: Select affected product smokes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.select.outputs.native }}
      stb: ${{ steps.select.outputs.stb }}
      faults: ${{ steps.select.outputs.faults }}
      platform: ${{ steps.select.outputs.platform }}
      kvm: ${{ steps.select.outputs.kvm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select consumers from changed inputs
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            git ls-files > changed-files.txt
          else
            git diff --name-only "$BASE_SHA"...HEAD > changed-files.txt
          fi
          python3 scripts/ci_scope.py < changed-files.txt >> "$GITHUB_OUTPUT"

  native:
    name: Native Dissonance search smoke
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize smoke artifact directory
        run: mkdir -p nova-native-pr-smoke && touch nova-native-pr-smoke.console.txt
      - name: Install Nova build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils cc65 curl g++ git
      - uses: Swatinem/rust-cache@v2
      - name: Reproduce the pinned Nova ROM and QuickNES core
        env:
          NOVA_BUILD: workloads/nes/build/nova
          HARMONY_QUICKNES_BUILD_JOBS: "2"
        run: |
          workloads/nes/scripts/build-nova-rom.sh "${NOVA_BUILD}"
          scripts/build-quicknes-core.sh "${NOVA_BUILD}/quicknes_libretro.so"
      - name: Run a bounded native Nova search
        run: |
          set -euo pipefail
          mkdir -p nova-native-pr-smoke
          cargo build --locked --release -p harmony-cli
          timeout -k 10 120 target/release/harmony search --package nes --backend native \
            --core workloads/nes/build/nova/quicknes_libretro.so \
            --seed 20260901 --workers 1 --executions 4 --actions 8 \
            --out nova-native-pr-smoke workloads/nes/build/nova/nova.nes \
            2>&1 | tee nova-native-pr-smoke.console.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("nova-native-pr-smoke/report.json").read_text())
          if report.get("executions_completed", 0) <= 0:
              raise SystemExit("native Nova smoke admitted no executions")
          if len(report.get("archive", {}).get("entries", [])) <= 0:
              raise SystemExit("native Nova smoke retained no archive work")
          stream = Path("nova-native-pr-smoke/stream.jsonl").read_text().splitlines()
          if not any(json.loads(line).get("event") == "job" for line in stream[1:]):
              raise SystemExit("native Nova smoke recorded no job event")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-native-pr-smoke-${{ github.run_id }}
          path: |
            nova-native-pr-smoke
            nova-native-pr-smoke.console.txt
          if-no-files-found: error
          retention-days: 14

  stb:
    name: STB source build, search and replay smoke
    needs: scope
    if: needs.scope.outputs.stb == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STB_BUILD: workloads/nes/build/stb
      STB_ARTIFACT: workloads/nes/build/stb-pr-artifact
      STB_EXECUTIONS: "4"
      STB_REQUIRE_VICTORY: "false"
      STB_SEED: "1"
      STB_AI: easy
      STB_AI_LEVEL: "1"
      STB_WORKERS: "1"
      STB_WALL_SECONDS: "180"
      HARMONY_STB_BUILD_JOBS: "2"
      HARMONY_QUICKNES_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Initialize smoke artifact directory
        run: mkdir -p "${STB_ARTIFACT}"
      - uses: ./.github/actions/stb-evaluation

  faults:
    name: PostgreSQL faults search inside Consonance smoke
    needs: scope
    if: needs.scope.outputs.faults == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize smoke artifact directory
        run: mkdir -p pg-pr-smoke
      - uses: Swatinem/rust-cache@v2
      - name: Compute platform source key
        id: platform-source
        run: echo "key=$(python3 consonance/harmony-linux/scripts/runtime-artifacts.py source-key --architecture x86_64)" >>"$GITHUB_OUTPUT"
      - name: Restore the qualified platform runtime
        id: platform-cache
        uses: actions/cache/restore@v4
        with:
          path: consonance/harmony-linux/build/x86_64
          key: consonance-platform-v1-x86_64-${{ steps.platform-source.outputs.key }}
          restore-keys: consonance-platform-v1-x86_64-
      - name: Locate exact platform handoff
        id: handoff
        if: steps.platform-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KEY: ${{ steps.platform-source.outputs.key }}
        run: |
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="consonance-platform-v1-x86_64-$SOURCE_KEY" -F per_page=100 \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .workflow_run.id // empty')
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
      - name: Clear superseded cached runtime
        if: steps.handoff.outputs.run_id != ''
        run: rm -rf consonance/harmony-linux/build/x86_64
      - uses: actions/download-artifact@v4
        if: steps.handoff.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.handoff.outputs.run_id }}
          name: consonance-platform-v1-x86_64-${{ steps.platform-source.outputs.key }}
          path: consonance/harmony-linux/build/x86_64
      - name: Restore the locked PostgreSQL workload image
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: oci-images
          # The historical images job uses this same source key for its
          # cache and artifact handoff after verifying image checksums.
          key: pgcic-oci-v1-${{ hashFiles('workloads/bugs/historical/postgres-cic-corruption/image/**', 'workloads/bugs/historical/postgres-cic-corruption/case.json') }}
      - name: Locate exact workload image handoff
        id: image-handoff
        if: steps.image-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_KEY: ${{ hashFiles('workloads/bugs/historical/postgres-cic-corruption/image/**', 'workloads/bugs/historical/postgres-cic-corruption/case.json') }}
        run: |
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="pgcic-oci-v1-$IMAGE_KEY" -F per_page=100 \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .workflow_run.id // empty')
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
      - name: Require exact workload image inputs
        if: steps.image-cache.outputs.cache-hit != 'true' && steps.image-handoff.outputs.run_id == ''
        run: |
          echo '::error::Exact PostgreSQL workload images are missing. Run the historical workflow on this branch, then rerun this smoke after image publication.'
          exit 1
      - name: Clear superseded cached workload images
        if: steps.image-handoff.outputs.run_id != ''
        run: rm -rf oci-images
      - uses: actions/download-artifact@v4
        if: steps.image-handoff.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.image-handoff.outputs.run_id }}
          name: pgcic-oci-v1-${{ hashFiles('workloads/bugs/historical/postgres-cic-corruption/image/**', 'workloads/bugs/historical/postgres-cic-corruption/case.json') }}
          path: oci-images
      - name: Verify platform and application artifacts
        run: |
          python3 consonance/harmony-linux/scripts/runtime-artifacts.py verify --architecture x86_64 \
            --artifacts consonance/harmony-linux/build/x86_64 --output pg-pr-smoke/platform-provenance.json
          test -s oci-images/pgcic-14.3.oci
          test -s oci-images/MANIFEST.sha256
          (cd oci-images && sha256sum -c MANIFEST.sha256)
      - name: Build the CLI
        run: cargo build --locked --release -p harmony-cli
      - name: Run a bounded PostgreSQL faults search through Consonance
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          timeout -k 10 180 \
            target/release/harmony search --package faults \
              oci-images/pgcic-14.3.oci --backend consonance \
              --kernel consonance/harmony-linux/build/x86_64/bzImage \
              --base-initramfs consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
              --seed 1 --workers 1 --executions 4 --actions 4 \
              --ram-mib 1024 \
              --knobs 'faultlab.churn_rows=20 faultlab.churn_slices=2 faultlab.churn_rounds=20' \
              --wall-minutes 1 --out pg-pr-smoke/search \
            2>&1 | tee pg-pr-smoke.console.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("pg-pr-smoke/search/report.json").read_text())
          summary = json.loads(Path("pg-pr-smoke/search/campaign-summary.json").read_text())
          if report.get("executions", 0) <= 0:
              raise SystemExit("PostgreSQL smoke admitted no executions")
          if report.get("execution_ticks", 0) <= 0:
              raise SystemExit("PostgreSQL smoke clocked no guest ticks")
          if summary.get("archive_entries", 0) <= 0:
              raise SystemExit("PostgreSQL smoke retained no archive work")
          stream = Path("pg-pr-smoke/search/stream.jsonl").read_text().splitlines()
          if not any(json.loads(line).get("event") == "job" for line in stream[1:]):
              raise SystemExit("PostgreSQL smoke recorded no admitted job")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-faults-pr-smoke-${{ github.run_id }}
          path: |
            pg-pr-smoke
            pg-pr-smoke.console.txt
          if-no-files-found: error
          retention-days: 14

  platform:
    name: Platform execution and restore
    needs: scope
    if: needs.scope.outputs.platform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      scope: ${{ steps.provenance.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned host toolchain
        run: |
          rustup toolchain install "$HARMONY_RUST_TOOLCHAIN" --profile minimal
          rustup default "$HARMONY_RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: Compute platform source key
        id: source
        run: echo "key=$(python3 consonance/harmony-linux/scripts/runtime-artifacts.py source-key --architecture x86_64)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: exact
        with:
          path: consonance/harmony-linux/build/x86_64
          key: consonance-platform-v1-x86_64-${{ steps.source.outputs.key }}
      - name: Locate exact qualification handoff
        id: handoff
        if: steps.exact.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KEY: ${{ steps.source.outputs.key }}
        run: |
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="consonance-platform-v1-x86_64-$SOURCE_KEY" -F per_page=100 \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .workflow_run.id // empty')
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.handoff.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.handoff.outputs.run_id }}
          name: consonance-platform-v1-x86_64-${{ steps.source.outputs.key }}
          path: consonance/harmony-linux/build/x86_64
      - uses: actions/cache/restore@v4
        if: steps.exact.outputs.cache-hit != 'true' && steps.handoff.outputs.run_id == ''
        with:
          path: consonance/harmony-linux/build/x86_64
          key: consonance-platform-v1-x86_64-${{ steps.source.outputs.key }}
          restore-keys: consonance-platform-v1-x86_64-
      - name: Verify and record qualification scope
        id: provenance
        run: |
          python3 consonance/harmony-linux/scripts/runtime-artifacts.py verify --architecture x86_64 \
            --artifacts consonance/harmony-linux/build/x86_64 --output platform-smoke/provenance.json
          scope=$(python3 -c 'import json; print(json.load(open("platform-smoke/provenance.json"))["scope"])')
          echo "scope=$scope" >>"$GITHUB_OUTPUT"
          echo "Platform artifact scope: $scope" >>"$GITHUB_STEP_SUMMARY"
      - name: Enable hardware backend
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Platform execution and restore smoke
        run: |
          set -o pipefail
          timeout -k 10 720 cargo test --locked --release -p oci-support --test platform --test process_platform -- --ignored --nocapture \
            2>&1 | tee platform-smoke/replay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-pr-smoke-${{ github.run_id }}
          path: platform-smoke
          if-no-files-found: error
          retention-days: 14

  kvm:
    name: Consonance real KVM execution, restore, and replay smoke
    needs: scope
    if: needs.scope.outputs.kvm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize smoke artifact directory
        run: mkdir -p pr-kvm-smoke
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: Grant /dev/kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real hardware, snapshot/restore, and deterministic replay
        run: |
          set -euo pipefail
          mkdir -p pr-kvm-smoke
          cargo test -p vmm-backend --test kvm_smoke \
            bringup_smoke_out_then_hlt -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee pr-kvm-smoke/execution.txt
          cargo test -p vmm-backend --test kvm_smoke \
            save_restore_round_trips_on_real_kvm -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee pr-kvm-smoke/restore.txt
          cargo test -p vmm-core --test x86_kvm_virtual_time \
            x1_ten_same_seed_runs_produce_one_normalized_log \
            -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee pr-kvm-smoke/replay.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consonance-x86-pr-smoke-${{ github.run_id }}
          path: pr-kvm-smoke
          if-no-files-found: error
          retention-days: 14

  guest-qualification:
    name: Exact guest platform qualification
    needs: [scope, platform]
    if: always() && needs.scope.outputs.platform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require successful exact-input hardware evidence
        env:
          SMOKE_RESULT: ${{ needs.platform.result }}
          QUALIFICATION_SCOPE: ${{ needs.platform.outputs.scope }}
        run: |
          if [[ "$SMOKE_RESULT" != success || "$QUALIFICATION_SCOPE" != exact-input ]]; then
            echo '::error::Exact guest qualification is missing. Run this workflow manually on the proposed branch, then rerun the PR smoke to consume its qualified artifact handoff. Host-only smoke does not qualify changed guest sources.'
            exit 1
          fi
