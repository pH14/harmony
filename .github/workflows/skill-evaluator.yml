name: Skill evaluator qualification

on:
  pull_request:
    paths:
      - benchmarks/skills/**
      - skills/**
      - .github/workflows/skill-evaluator.yml
  workflow_dispatch:
    inputs:
      guest_artifact_run_id:
        description: Trusted guest-image artifact run to qualify on real KVM (empty skips guest execution)
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record qualification source and host
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p reports/skill-evaluator
          git rev-parse HEAD > reports/skill-evaluator/tested-checkout-head.txt
          if [[ -n "$PR_HEAD_SHA" ]]; then
            printf '%s\n' "$PR_HEAD_SHA" > reports/skill-evaluator/pr-head.txt
          fi
          uname -a > reports/skill-evaluator/host.txt
      - name: Portable material and process checks
        run: |
          set -euo pipefail
          python3 -B -m unittest -v benchmarks/skills/test_materials.py benchmarks/skills/test_sandbox.py 2>&1 | tee reports/skill-evaluator/portable-tests.log
      - name: Build and freeze the qualification tool image
        run: |
          set -euo pipefail
          docker version > reports/skill-evaluator/docker-version.txt
          docker build --file benchmarks/skills/Dockerfile.qualify --tag harmony-skill-qualification:local benchmarks/skills
          docker image inspect --format '{{.Id}}' harmony-skill-qualification:local > reports/skill-evaluator/image-id.txt
          docker image inspect harmony-skill-qualification:local > reports/skill-evaluator/image-inspect.json
          docker run --rm --network none --entrypoint dpkg-query harmony-skill-qualification:local -W > reports/skill-evaluator/image-packages.txt
          docker image save harmony-skill-qualification:local -o reports/skill-evaluator/tool-image.tar
          sha256sum reports/skill-evaluator/tool-image.tar > reports/skill-evaluator/tool-image-sha256.txt
      - name: Actual Linux sandbox canaries without model calls
        run: |
          set -euo pipefail
          qualification_image=$(cat reports/skill-evaluator/image-id.txt)
          python3 -B -m benchmarks.skills.qualify_sandbox --image "$qualification_image" > reports/skill-evaluator/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-evaluator-${{ github.run_id }}
          path: reports/skill-evaluator
          if-no-files-found: error
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record build qualification source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p reports/skill-build
          git rev-parse HEAD > reports/skill-build/tested-checkout-head.txt
          if [[ -n "$PR_HEAD_SHA" ]]; then
            printf '%s\n' "$PR_HEAD_SHA" > reports/skill-build/pr-head.txt
          fi
          uname -a > reports/skill-build/host.txt
      - name: Portable artifact boundary checks
        run: |
          set -euo pipefail
          python3 -B -m unittest -v benchmarks/skills/test_build.py benchmarks/skills/test_guest_image.py benchmarks/skills/test_guest_evidence.py benchmarks/skills/test_guest_files.py benchmarks/skills/test_guest_limits.py benchmarks/skills/test_qualify_guest.py benchmarks/skills/test_artifact_run.py benchmarks/skills/test_behavior.py benchmarks/skills/test_checker_guest.py benchmarks/skills/test_qualify_semantics.py 2>&1 | tee reports/skill-build/portable-tests.log
      - name: Build and retain trusted compiler image
        run: |
          set -euo pipefail
          docker version > reports/skill-build/docker-version.txt
          docker build --file benchmarks/skills/Dockerfile.build-qualify --tag harmony-skill-build:local benchmarks/skills
          docker image inspect --format '{{.Id}}' harmony-skill-build:local > reports/skill-build/image-id.txt
          docker image inspect harmony-skill-build:local > reports/skill-build/image-inspect.json
          docker run --rm --network none --entrypoint dpkg-query harmony-skill-build:local -W > reports/skill-build/image-packages.txt
          docker image save harmony-skill-build:local -o reports/skill-build/tool-image.tar
          sha256sum reports/skill-build/tool-image.tar > reports/skill-build/tool-image-sha256.txt
      - name: Actual isolated compilation without model calls
        run: |
          set -euo pipefail
          qualification_image=$(cat reports/skill-build/image-id.txt)
          python3 -B -m benchmarks.skills.qualify_build --image "$qualification_image" > reports/skill-build/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-build-${{ github.run_id }}
          path: reports/skill-build
          if-no-files-found: error
          retention-days: 7

  guest:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.guest_artifact_run_id != '' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record guest qualification source and host
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p reports/skill-guest
          git rev-parse HEAD > reports/skill-guest/tested-checkout-head.txt
          if [[ -n "$PR_HEAD_SHA" ]]; then
            printf '%s\n' "$PR_HEAD_SHA" > reports/skill-guest/pr-head.txt
          fi
          uname -a > reports/skill-guest/host.txt
          lscpu >> reports/skill-guest/host.txt
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Portable image and telemetry checks
        run: |
          set -euo pipefail
          python3 -B -m unittest -v benchmarks/skills/test_guest_image.py benchmarks/skills/test_guest_evidence.py benchmarks/skills/test_guest_files.py benchmarks/skills/test_guest_limits.py benchmarks/skills/test_qualify_guest.py 2>&1 | tee reports/skill-guest/portable-tests.log
      - uses: actions/download-artifact@v4
        with:
          name: skill-build-${{ github.run_id }}
          path: compiler-image
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.guest_artifact_run_id }}
          name: guest-images-${{ inputs.guest_artifact_run_id }}
          path: guest
      - name: Verify and load retained compiler image
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('compiler-image/tool-image.tar')
          digest = hashlib.sha256()
          with path.open('rb') as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                  digest.update(chunk)
          if digest.hexdigest() != path.with_name('tool-image-sha256.txt').read_text().split()[0]:
              raise SystemExit('compiler image digest mismatch')
          PY
          docker image load -i compiler-image/tool-image.tar
          cp compiler-image/image-id.txt reports/skill-guest/compiler-image-id.txt
          cp compiler-image/tool-image-sha256.txt reports/skill-guest/compiler-image-tar-sha256.txt
          sha256sum guest/bzImage-faultlab guest/initramfs.cpio.gz > reports/skill-guest/guest-input-sha256.txt
      - name: Install static guest toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            workloads/fault-agent -> target
            workloads/faults -> target
      - name: Build shipping CLI and guest agent
        run: |
          set -euo pipefail
          cargo build --locked --release -p harmony-cli
          cargo build --locked --release --manifest-path workloads/fault-agent/Cargo.toml --target x86_64-unknown-linux-musl
          cargo build --locked --release --manifest-path workloads/faults/Cargo.toml --example prepared_image_digest
          sha256sum workloads/faults/target/release/examples/prepared_image_digest target/release/harmony workloads/fault-agent/target/x86_64-unknown-linux-musl/release/fault-agent > reports/skill-guest/tool-sha256.txt
      - name: Qualify actual filesystem byte and inode bounds
        run: |
          set -euo pipefail
          mkdir reports/skill-guest/storage-canary
          sudo mount -t tmpfs -o size=8M,nr_inodes=128,nodev,nosuid,noexec,mode=700,uid="$(id -u)",gid="$(id -g)" tmpfs reports/skill-guest/storage-canary
          trap 'sudo umount reports/skill-guest/storage-canary' EXIT
          python3 -B -m benchmarks.skills.qualify_guest_storage reports/skill-guest/storage-canary > reports/skill-guest/storage-result.json
      - name: Mount bounded guest output storage
        run: |
          set -euo pipefail
          mkdir reports/skill-guest/bounded
          sudo mount -t tmpfs -o size=512M,nr_inodes=16384,nodev,nosuid,noexec,mode=700,uid="$(id -u)",gid="$(id -g)" tmpfs reports/skill-guest/bounded
      - name: Actual build-to-guest SDK delivery without model calls
        run: |
          set -euo pipefail
          qualification_image=$(cat compiler-image/image-id.txt)
          mkdir reports/skill-guest/bounded/host-tmp
          TMPDIR="$PWD/reports/skill-guest/bounded/host-tmp" python3 -B -m benchmarks.skills.qualify_guest --image "$qualification_image" \
            --harmony target/release/harmony --kernel guest/bzImage-faultlab \
            --base guest/initramfs.cpio.gz \
            --agent workloads/fault-agent/target/x86_64-unknown-linux-musl/release/fault-agent \
            --preparer workloads/faults/target/release/examples/prepared_image_digest \
            --output reports/skill-guest/bounded/cases > reports/skill-guest/result.json
      - name: Private behavior and guest checker qualification without model calls
        run: |
          set -euo pipefail
          qualification_image=$(cat compiler-image/image-id.txt)
          TMPDIR="$PWD/reports/skill-guest/bounded/host-tmp" python3 -B -m benchmarks.skills.qualify_semantics --image "$qualification_image" \
            --harmony target/release/harmony --kernel guest/bzImage-faultlab \
            --base guest/initramfs.cpio.gz \
            --agent workloads/fault-agent/target/x86_64-unknown-linux-musl/release/fault-agent \
            --preparer workloads/faults/target/release/examples/prepared_image_digest \
            --output reports/skill-guest/bounded/semantics > reports/skill-guest/semantic-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skill-guest-${{ github.run_id }}
          path: reports/skill-guest
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Unmount guest output storage
        if: always()
        run: |
          if mountpoint -q reports/skill-guest/bounded; then
            sudo umount reports/skill-guest/bounded
          fi
