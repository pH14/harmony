name: Diagnostic / nested host preflight
on:
  workflow_dispatch:
    inputs:
      custom_kernel:
        description: Boot the isolated diagnostic synchronized-shadow kernel
        type: boolean
        default: false
      snapshot_tests:
        description: Run full-VMM snapshot and leaf-PTE mutation tests inside the custom kernel
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Record host capabilities without changing its kernel
        run: |
          set -euo pipefail
          mkdir reports
          git rev-parse HEAD > reports/checkout.txt
          printf '%s\n' 'Nested guest boot and inner KVM execution have not been attempted.' > reports/scope.txt
          uname -a > reports/kernel.txt
          lscpu > reports/cpu.txt
          for vendor in intel amd; do
            parameter="/sys/module/kvm_${vendor}/parameters/nested"
            if test -r "$parameter"; then
              cat "$parameter" > "reports/kvm-${vendor}-nested.txt"
            fi
          done
          { ls -l /boot/vmlinuz-*; ls -l "/lib/modules/$(uname -r)/kernel/arch/x86/kvm/"; } > reports/kernel-files.txt 2>&1 || true
          cc -std=c11 -D_GNU_SOURCE -Wall -Wextra -Werror -O2 .github/scripts/nested-host-preflight.c -o /tmp/nested-host-preflight
          sudo timeout 10s /tmp/nested-host-preflight | tee reports/kvm.txt
      - name: Install isolated boot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends busybox-static qemu-system-x86 zstd build-essential flex bison libelf-dev libssl-dev bc
      - name: Prepare snapshot test toolchain
        if: inputs.snapshot_tests
        env:
          CUSTOM_KERNEL: ${{ inputs.custom_kernel }}
        run: |
          test "$CUSTOM_KERNEL" = true
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Build the isolated diagnostic kernel
        if: inputs.custom_kernel
        run: bash .github/scripts/nested-kvm-build-kernel.sh
      - name: Execute HLT through KVM inside a disposable kernel VM
        env:
          CUSTOM_KERNEL: ${{ inputs.custom_kernel }}
          NESTED_SNAPSHOT_TESTS: ${{ inputs.snapshot_tests }}
        run: |
          if test "$CUSTOM_KERNEL" = true; then
            if test "$NESTED_SNAPSHOT_TESTS" = true; then
              printf '%s\n' 'Isolated custom-kernel PAE, leaf-PTE, MMIO, and XSAVE tests; general snapshot correctness unproven.' > reports/scope.txt
            else
              printf '%s\n' 'Isolated custom-kernel inner KVM HLT probe; no snapshot qualification.' > reports/scope.txt
            fi
            bash .github/scripts/nested-kvm-boot.sh reports/nested-custom-bzImage
          else
            printf '%s\n' 'Isolated stock-kernel inner KVM HLT probe; no snapshot qualification.' > reports/scope.txt
            bash .github/scripts/nested-kvm-boot.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nested-host-preflight-${{ github.run_id }}-${{ matrix.replica }}
          path: reports
          if-no-files-found: error
          retention-days: 30
