# SPDX-License-Identifier: AGPL-3.0-or-later
name: Diagnostic / x86 XSAVE hardware qualification

# This workflow is deliberately manual and targeted. It samples the exact
# initialized XSAVE continuation test on real hosted KVM; it does not claim
# vendor-universal snapshot correctness from the matrix.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 4
  HARMONY_RUST_TOOLCHAIN: 1.97.0

jobs:
  xsave-qualification:
    name: XSAVE qualification ${{ matrix.os }} replica ${{ matrix.replica }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        replica: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - name: Record host and source identity
        run: |
          set -euo pipefail
          mkdir -p snapshot-report snapshot-report/xsave
          git rev-parse HEAD > snapshot-report/source-revision.txt
          cat /proc/cpuinfo > snapshot-report/cpuinfo.txt
          {
            uname -a
            lscpu
            grep -m1 'model name' /proc/cpuinfo
            grep -m1 'vendor_id' /proc/cpuinfo
          } > snapshot-report/host.txt
          {
            printf 'replica=%s\n' '${{ matrix.replica }}'
            printf 'os=%s\n' '${{ matrix.os }}'
            printf '%s\n' 'vendor_coverage=observed-on-this-run-only; no vendor coverage guarantee'
          } > snapshot-report/vendor-coverage.txt

          paging=unavailable
          if test -r /sys/module/kvm_amd/parameters/npt; then
            paging="kvm_amd.npt=$(tr -d '[:space:]' < /sys/module/kvm_amd/parameters/npt)"
          elif test -r /sys/module/kvm_intel/parameters/ept; then
            paging="kvm_intel.ept=$(tr -d '[:space:]' < /sys/module/kvm_intel/parameters/ept)"
          fi
          printf 'paging_mode=%s\n' "$paging" > snapshot-report/paging-mode.txt

      - name: Install Rust 1.97
        run: |
          set -euo pipefail
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"

      - uses: Swatinem/rust-cache@v2

      - name: Grant /dev/kvm access
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          {
            printf 'uid_gid='; id
            printf 'kvm_group='; getent group kvm || true
            ls -l /dev/kvm || true
            stat -c 'mode=%a uid=%u gid=%g type=%F' /dev/kvm || true
          } | tee snapshot-report/kvm-device.txt
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm

      - name: Build only the release XSAVE test target
        run: |
          set -euo pipefail
          printf '%s\n' 'cargo test --locked --release -p vmm-core --test x86_cpu_snapshots --no-run' \
            | tee snapshot-report/xsave-build.command
          cargo test --locked --release -p vmm-core --test x86_cpu_snapshots --no-run \
            2>&1 | tee snapshot-report/xsave-build.log

      - name: Run required initialized XSAVE continuation
        env:
          XSAVE_CONTINUATION_REPORT_DIR: ${{ github.workspace }}/snapshot-report/xsave
        run: |
          set -euo pipefail
          : > snapshot-report/xsave.log
          printf '%s\n' 'XSAVE_STATUS=required-gate' > snapshot-report/xsave-status.txt
          printf '%s\n' 'VENDOR_COVERAGE=observed-only; no vendor coverage guarantee' \
            >> snapshot-report/xsave-status.txt
          printf '%s\n' 'cargo test --locked --release -p vmm-core --test x86_cpu_snapshots live_kvm::xsave_guest_bytes_survive_cold_continuation -- --ignored --exact --test-threads=1 --nocapture' \
            | tee snapshot-report/xsave.command

          set +e
          cargo test --locked --release -p vmm-core --test x86_cpu_snapshots \
            live_kvm::xsave_guest_bytes_survive_cold_continuation \
            -- --ignored --exact --test-threads=1 --nocapture 2>&1 \
            | tee snapshot-report/xsave.log
          pipeline_status=("${PIPESTATUS[@]}")
          cargo_rc=${pipeline_status[0]}
          tee_rc=${pipeline_status[1]}
          set -e
          printf 'XSAVE_TEST_EXIT=%s\nXSAVE_TEE_EXIT=%s\n' "$cargo_rc" "$tee_rc" \
            | tee -a snapshot-report/xsave-status.txt
          test "$tee_rc" -eq 0
          test "$cargo_rc" -eq 0

          # These checks require one real test execution and reject a filtered
          # or silently ignored test even if cargo exits successfully.
          grep -Fq 'running 1 test' snapshot-report/xsave.log
          grep -Fq 'live_kvm::xsave_guest_bytes_survive_cold_continuation' \
            snapshot-report/xsave.log
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' \
            snapshot-report/xsave.log
          required_phases=(
            original-endpoint
            save-and-continue-stop
            save-and-continue-stop-repeat
            save-and-continue-endpoint
            cold-unobserved-endpoint
            cold-observed-stop
            cold-observed-stop-repeat
            cold-observed-endpoint
          )
          for phase in "${required_phases[@]}"; do
            phase_dir="snapshot-report/xsave/${phase}"
            test -d "$phase_dir"
            for artifact in memory.bin vm-state.bin state-blob.bin guest-bytes.bin summary.txt; do
              test -f "$phase_dir/$artifact"
            done
            test "$(stat -c '%s' "$phase_dir/guest-bytes.bin")" -eq 4096
          done
          printf '%s\n' 'XSAVE_EXECUTION=pass' \
            | tee -a snapshot-report/xsave-status.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xsave-qualification-${{ github.run_id }}-${{ matrix.os }}-${{ matrix.replica }}
          path: snapshot-report
          if-no-files-found: error
          retention-days: 30
