# SPDX-License-Identifier: AGPL-3.0-or-later
name: Acceptance / Consonance x86

# Hosted-runner x86 acceptance; each replica preserves its own evidence.
on:
  pull_request:
    paths:
      - consonance/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - flake.nix
      - flake.lock
      - .github/workflows/x86-virtual-time.yml
  push:
    branches: [main]
    paths:
      - consonance/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - flake.nix
      - flake.lock
      - .github/workflows/x86-virtual-time.yml
  schedule:
    - cron: "13 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: x86-virtual-time-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The explicit `bash` shell runs with pipefail, so `cmd | tee` steps fail when
# the command fails; the implicit default shell would report tee's exit status.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0

jobs:
  # X0: CPU identity, /dev/kvm, the KVM capability table, and one minimal
  # real-mode guest through the public KvmBackend.
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: Build probe
        run: cargo build -p vmm-backend --bin x86_kvm_probe
      # Negative control: with /dev/kvm unreadable the probe must fail closed
      # with the kvm_open reason, never report PASS.
      - name: Probe fails closed without /dev/kvm access
        run: |
          sudo chmod 600 /dev/kvm
          rc=0
          ./target/debug/x86_kvm_probe > probe-negative.txt || rc=$?
          cat probe-negative.txt
          [ "$rc" -eq 1 ]
          grep -q "FAIL_REASON=kvm_open" probe-negative.txt
      - name: Grant /dev/kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run probe
        run: ./target/debug/x86_kvm_probe | tee probe-report.txt
      - name: kvm_smoke (live stock-KVM tests; informational at X0)
        if: always()
        continue-on-error: true
        run: cargo test -p vmm-backend --test kvm_smoke -- --ignored --test-threads=1 2>&1 | tee kvm-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-probe-replica-${{ matrix.replica }}
          path: |
            probe-report.txt
            probe-negative.txt
            kvm-smoke.txt
          if-no-files-found: error

  # X1: ten same-seed runs of the virtual_time run loop over the stock
  # KvmBackend and a real-mode guest must produce one normalized log, with the
  # comparator and placement-checker negatives standing against the same
  # workload's log. Two replicas so most pushes also sample two hardware draws.
  x1-minimal-guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: Grant /dev/kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: X1 live oracles
        run: |
          grep -m1 "model name" /proc/cpuinfo | tee x1-report.txt
          cargo test -p vmm-core --test x86_kvm_virtual_time -- --ignored --test-threads=1 --nocapture 2>&1 | tee -a x1-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-x1-replica-${{ matrix.replica }}
          path: x1-report.txt
          if-no-files-found: error

  # X2 input: build the committed guest image from the locked Nix graph in a
  # clean runner store. The output is passed only through this workflow's
  # immutable artifact, never a cross-run cache, so N5 can distinguish an
  # actual rebuild from a restored image.
  guest-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Install serialization-test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Build guest image from lock
        run: |
          mkdir -p nix-guest-output consonance/harmony-linux/build
          nix run .#guest-images -- \
            --output "$PWD/nix-guest-output" \
            --serialization-gate \
            --n6
          cp nix-guest-output/x86_64/bzImage consonance/harmony-linux/build/bzImage
          cp nix-guest-output/x86_64/initramfs.cpio.gz consonance/harmony-linux/build/initramfs.cpio.gz
          (cd nix-guest-output && sha256sum -c MANIFEST.sha256)
      - name: Record image identity
        run: |
          cp nix-guest-output/MANIFEST.sha256 nix-guest-output/guest-image-report.txt
          cat nix-guest-output/guest-image-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-guest-image
          path: nix-guest-output
          if-no-files-found: error

  # N6: the table-generated instruction sweep. The traps-off kernel must be
  # rejected first; only then may both production profiles' two same-seed
  # traps-on boots receive credit.
  n6-instruction-sweep:
    needs: guest-image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: Grant /dev/kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download locked N6 guest images
        uses: actions/download-artifact@v4
        with:
          name: x86-guest-image
          path: nix-guest-output
      - name: Stage N6 guest images
        run: |
          mkdir -p consonance/harmony-linux/build
          for name in bzImage bzImage-faultlab bzImage-n6-traps-off initramfs-n6.cpio.gz initramfs-n6-traps-off.cpio.gz; do
            cp "nix-guest-output/x86_64/$name" consonance/harmony-linux/build/
          done
          (cd nix-guest-output && sha256sum -c guest-image-report.txt)
      - name: Run static N6 positives and negative controls
        run: |
          python3 consonance/harmony-linux/scripts/n6-instruction-sweep.py self-test
          python3 consonance/harmony-linux/scripts/n6-llsc-boundary.py
      - name: Run traps-off negative, then both production JIT sweeps
        run: |
          mkdir -p n6-report
          N6_REPORT_DIR="$PWD/n6-report" timeout -k 10 1800 \
            cargo test --release -p vmm-core --test n6_x86_instruction_sweep \
              -- --ignored --test-threads=1 --nocapture 2>&1 | tee n6-report/test.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-n6-instruction-sweep
          path: n6-report
          if-no-files-found: error

  # #276: ordinary Go must run with no runtime tuning, and its complete
  # execution trace must repeat on both production kernel profiles while the
  # corresponding traps-off boot demonstrably diverges.
  go-runtime:
    needs: guest-image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: Grant /dev/kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: x86-guest-image
          path: nix-guest-output
      - name: Stage Go guest images
        run: |
          mkdir -p consonance/harmony-linux/build
          for name in bzImage bzImage-faultlab bzImage-n6-traps-off initramfs-go-runtime.cpio.gz; do
            cp "nix-guest-output/x86_64/$name" consonance/harmony-linux/build/
          done
          (cd nix-guest-output && sha256sum -c guest-image-report.txt)
      - name: Run uninstrumented Go and compare same-seed execution traces
        run: |
          grep -m1 "model name" /proc/cpuinfo | tee go-runtime-report.txt
          timeout -k 10 2100 cargo test --release -p vmm-core --test go_runtime_x86 \
            -- --ignored --test-threads=1 --nocapture 2>&1 | tee -a go-runtime-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-go-runtime-${{ matrix.replica }}
          path: go-runtime-report.txt
          if-no-files-found: error

  # X2: Linux boots to /init under assigned-at-exit V-time on the stock
  # backend. Both tiers gate: the smoke tier (one boot) and the determinism
  # tier (10 same-seed boots, one normalized log). The localizer stays
  # informational — it is a diagnostic for when the determinism tier fails.
  # Release build: the trace checkpoints hash the full 256 MiB guest RAM, which
  # an unoptimized sha2 makes wall-clock-prohibitive. Two replicas so most
  # pushes sample two hardware draws.
  x2-linux-virtual_time:
    needs: guest-image
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Four replicas: the runner pool draws several CPU models (EPYC 7763,
        # EPYC 9V74, Xeon Platinum 8573C observed) and the vendor mix per push
        # matters while an Intel-only divergence is open.
        replica: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Download locked guest image
        uses: actions/download-artifact@v4
        with:
          name: x86-guest-image
          path: nix-guest-output
      - name: Stage locked guest image
        run: |
          mkdir -p consonance/harmony-linux/build
          cp nix-guest-output/x86_64/bzImage consonance/harmony-linux/build/bzImage
          cp nix-guest-output/x86_64/initramfs.cpio.gz consonance/harmony-linux/build/initramfs.cpio.gz
          (cd nix-guest-output && sha256sum -c guest-image-report.txt)
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: Grant /dev/kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Each tier runs under coreutils `timeout`: the test's own wall watchdog
      # cannot fire while a guest spins exit-free inside a blocking KVM_RUN
      # ioctl, so an external bound keeps a hung boot from consuming the whole
      # job budget — and the tee'd serial up to the hang still uploads.
      - name: X2 smoke (one virtual_time stock boot)
        run: |
          grep -m1 "model name" /proc/cpuinfo | tee x2-report.txt
          X2_LOG_DUMP=$PWD/x2-normalized-log.txt X2_CALIBRATION_LOG=$PWD/x2-boot.calib \
            timeout -k 10 900 cargo test --release -p vmm-core --test x86_kvm_linux_virtual_time \
            x2_virtual_time_stock_boot_smoke -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee -a x2-report.txt
      - name: X2 determinism (10 same-seed boots, one normalized log)
        run: |
          X2_BOOTS=10 timeout -k 10 1500 cargo test --release -p vmm-core --test x86_kvm_linux_virtual_time \
            x2_same_seed_boots_one_normalized_log -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee -a x2-report.txt
      # The localizers are diagnostics: they must run when the determinism
      # tier fails, which is exactly when their output matters.
      - name: X2 first-checkpoint localizer (bounded boots until a divergent pair; informational)
        if: always()
        continue-on-error: true
        run: |
          timeout -k 10 1200 cargo test --release -p vmm-core --test x86_kvm_linux_virtual_time \
            x2_component_diff_first_checkpoint -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee -a x2-report.txt
      - name: X2 divergence localizer (per-component diff; informational)
        if: always()
        continue-on-error: true
        run: |
          timeout -k 10 1200 cargo test --release -p vmm-core --test x86_kvm_linux_virtual_time \
            x2_component_diff_two_boots -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee -a x2-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-x2-replica-${{ matrix.replica }}
          path: |
            x2-report.txt
            x2-normalized-log.txt
            x2-boot.calib
          if-no-files-found: error

  # Widen the vendor sample: the pool serves Intel rarely, and every closed
  # cross-vendor divergence needed an Intel draw to observe. Each replica
  # prints its CPU model and runs only the bounded first-checkpoint localizer
  # (sub-second boots), so a wide matrix is cheap. Report-only: an AMD draw
  # finding no divergent pair is the expected common case.
  x2-intel-hunt:
    needs: guest-image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Download locked guest image
        uses: actions/download-artifact@v4
        with:
          name: x86-guest-image
          path: nix-guest-output
      - name: Stage locked guest image
        run: |
          mkdir -p consonance/harmony-linux/build
          cp nix-guest-output/x86_64/bzImage consonance/harmony-linux/build/bzImage
          cp nix-guest-output/x86_64/initramfs.cpio.gz consonance/harmony-linux/build/initramfs.cpio.gz
          (cd nix-guest-output && sha256sum -c guest-image-report.txt)
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: Grant /dev/kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: First-checkpoint localizer (60 bounded draws)
        run: |
          grep -m1 "model name" /proc/cpuinfo | tee x2-hunt-report.txt
          X2_CKPT_ATTEMPTS=60 timeout -k 10 1200 cargo test --release -p vmm-core --test x86_kvm_linux_virtual_time \
            x2_component_diff_first_checkpoint -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee -a x2-hunt-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-x2-hunt-replica-${{ matrix.replica }}
          path: x2-hunt-report.txt
          if-no-files-found: error

  # Linux compile/lint/test truth for the crates the x86 work touches; the
  # macOS development host cannot check cfg(linux) code.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check -p vmm-backend -p vmm-core
      - name: clippy
        run: cargo clippy -p vmm-backend -p vmm-core --all-features --all-targets -- -D warnings
      - name: tests (portable)
        run: cargo test -p vmm-backend --all-features

  # Bounded snapshot/completion qualification on the runner's built product
  # tree. These are exact, ignored KVM regressions from #295/#299/#301/#302;
  # every command must run one test and prove that in its own log. The PAE
  # result is vendor/paging-aware because #314 is a known AMD default-NPT
  # failure. Its strict oracle and raw log remain retained as evidence; a
  # known AMD/NPT failure is never reported as universal qualification.
  snapshot-hardware:
    name: snapshot-hardware replica ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: Grant /dev/kvm access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          ls -l /dev/kvm
      - name: Record host vendor and paging mode
        id: host
        run: |
          set -euo pipefail
          mkdir -p snapshot-report
          printf '%s\n' 'replica=${{ matrix.replica }}' > snapshot-report/replica.txt
          git rev-parse HEAD > snapshot-report/source-revision.txt
          {
            uname -a
            lscpu
            grep -m1 'model name' /proc/cpuinfo
            grep -m1 'vendor_id' /proc/cpuinfo
          } > snapshot-report/host.txt
          vendor=$(awk -F: '/^vendor_id[[:space:]]*:/{gsub(/[[:space:]]/, "", $2); print $2; exit}' /proc/cpuinfo)
          npt=unavailable
          if test -r /sys/module/kvm_amd/parameters/npt; then
            npt=$(tr -d '[:space:]' < /sys/module/kvm_amd/parameters/npt)
          fi
          printf 'CPU_VENDOR=%s\nKVM_AMD_NPT=%s\n' "$vendor" "$npt" | tee snapshot-report/paging-mode.txt
          cat /proc/cpuinfo > snapshot-report/cpuinfo.txt
          amd_npt=false
          if [[ "$vendor" == AuthenticAMD ]]; then
            case "$npt" in
              Y|1) amd_npt=true ;;
              N|0) ;;
              *) echo "Unknown AMD NPT mode: $npt" >&2; exit 1 ;;
            esac
          elif [[ "$vendor" != GenuineIntel ]]; then
            echo "Unknown x86 CPU vendor: $vendor" >&2
            exit 1
          fi
          printf 'vendor=%s\nnpt=%s\namd_npt=%s\n' "$vendor" "$npt" "$amd_npt" >> "$GITHUB_OUTPUT"
      - name: Run required KVM completion and full-VMM tests
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          mkdir -p snapshot-report

          run_exact() {
            local package=$1
            local binary=$2
            local test_name=$3
            local label=$4
            local log="snapshot-report/${label}.log"
            printf '%s\n' "cargo test --locked --release -p ${package} --test ${binary} ${test_name} -- --ignored --exact --test-threads=1 --nocapture" | tee "snapshot-report/${label}.command"
            cargo test --locked --release -p "$package" --test "$binary" "$test_name" \
              -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee "$log"
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"
          }

          run_exact vmm-backend kvm_smoke serviced_pio_is_exactly_snapshottable_without_guest_execution pio
          run_exact vmm-backend kvm_smoke serviced_msr_is_exactly_snapshottable_without_guest_execution msr
          run_exact vmm-backend kvm_smoke serviced_exception_payload_round_trips_and_empty_restore_clears_it exception-payload
          run_exact vmm-backend kvm_smoke serviced_mmio_is_exactly_snapshottable_across_scalar_rmw_and_movdqu mmio-backend
          run_exact vmm-core x86_cpu_snapshots live_kvm::mmio_rmw_finishes_before_full_vmm_snapshot mmio-full-vmm
      - name: PAE full-VMM snapshot gate
        if: ${{ steps.host.outputs.amd_npt != 'true' }}
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -euo pipefail
          printf '%s\n' 'PAE_STATUS=required-gate' | tee snapshot-report/pae-status.txt
          printf '%s\n' 'cargo test --locked --release -p vmm-core --test x86_cpu_snapshots live_kvm::pae_cached_pdptrs_survive_full_vmm_snapshot_restore -- --ignored --exact --test-threads=1 --nocapture' | tee snapshot-report/pae-full-vmm.command
          cargo test --locked --release -p vmm-core --test x86_cpu_snapshots \
            live_kvm::pae_cached_pdptrs_survive_full_vmm_snapshot_restore \
            -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee snapshot-report/pae-full-vmm.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' snapshot-report/pae-full-vmm.log
      - name: AMD default-NPT guest-authored PAE observation (known unresolved)
        if: ${{ steps.host.outputs.amd_npt == 'true' }}
        continue-on-error: true
        env:
          CARGO_TERM_COLOR: never
          NPT_REPORT_DIR: ${{ github.workspace }}/snapshot-report/npt-guest-write
        run: |
          set -euo pipefail
          mkdir -p "$NPT_REPORT_DIR"
          printf 'PAE_STATUS=%s\n' 'known-unresolved-amd-default-npt-guest-authored-observation' | tee snapshot-report/pae-status.txt
          printf '%s\n' 'cargo test --locked --release -p vmm-core --test x86_cpu_snapshots live_kvm::amd_default_npt_pae_guest_write_observations -- --ignored --exact --test-threads=1 --nocapture' | tee snapshot-report/pae-full-vmm.command
          set +e
          cargo test --locked --release -p vmm-core --test x86_cpu_snapshots \
            live_kvm::amd_default_npt_pae_guest_write_observations \
            -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee snapshot-report/pae-full-vmm.log
          pipeline_status=("${PIPESTATUS[@]}")
          cargo_rc=${pipeline_status[0]}
          tee_rc=${pipeline_status[1]}
          set -e
          printf 'PAE_TEST_EXIT=%s\nPAE_TEE_EXIT=%s\n' "$cargo_rc" "$tee_rc" | tee -a snapshot-report/pae-status.txt
          if [[ "$tee_rc" -ne 0 ]]; then
            printf '%s\n' 'The PAE observation log could not be retained.' >&2
            exit "$tee_rc"
          fi
          if grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' snapshot-report/pae-full-vmm.log; then
            [[ "$cargo_rc" -eq 0 ]] || exit "$cargo_rc"
            printf '%s\n' 'PAE_OBSERVATION=guest-authored-test-passed-on-amd-default-npt' | tee -a snapshot-report/pae-status.txt
          elif [[ "$cargo_rc" -ne 0 ]] && grep -Fq 'running 1 test' snapshot-report/pae-full-vmm.log && \
              grep -Fq 'test result: FAILED. 0 passed; 1 failed; 0 ignored;' snapshot-report/pae-full-vmm.log; then
            printf 'PAE_OBSERVATION=%s\n' 'guest-authored-strict-test-failed-on-amd-default-npt' | tee -a snapshot-report/pae-status.txt
            printf '%s\n' 'The strict guest-authored PAE oracle failed on AMD default NPT; retaining the raw diagnostic outcome without qualification.'
            exit "$cargo_rc"
          else
            printf 'PAE_OBSERVATION=%s\n' 'unexpected-harness-or-infrastructure-failure' | tee -a snapshot-report/pae-status.txt
            exit 1
          fi
      - name: Validate AMD default-NPT PAE observation classification
        if: ${{ always() && steps.host.outputs.amd_npt == 'true' }}
        env:
          # Public diagnostic status, not a credential.
          KNOWN_PAE_FAILURE: PAE_OBSERVATION=guest-authored-strict-test-failed-on-amd-default-npt # pragma: allowlist secret
        run: |
          set -euo pipefail
          status=snapshot-report/pae-status.txt
          log=snapshot-report/pae-full-vmm.log
          test -s "$status"
          test -s "$log"
          grep -Fq 'PAE_TEE_EXIT=0' "$status"
          phase_files=(memory.bin vm-state.bin state-blob.bin guest-bytes.bin summary.txt)
          phase_dirs=(
            original-endpoint
            save-and-continue-stop
            save-and-continue-stop-repeat
            save-and-continue-endpoint
            cold-unobserved-endpoint
            cold-observed-stop
            cold-observed-stop-repeat
            cold-observed-endpoint
          )
          require_phase_evidence() {
            local phase file
            for phase in "${phase_dirs[@]}"; do
              for file in "${phase_files[@]}"; do
                test -s "snapshot-report/npt-guest-write/${phase}/${file}"
              done
            done
          }
          if grep -Fq 'PAE_OBSERVATION=guest-authored-test-passed-on-amd-default-npt' "$status"; then
            grep -Fq 'PAE_TEST_EXIT=0' "$status"
            grep -Fq 'running 1 test' "$log"
            grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"
            require_phase_evidence
            printf '%s\n' 'AMD default-NPT PAE observation passed; raw evidence retained and reported as observational.'
          elif grep -Fq "$KNOWN_PAE_FAILURE" "$status"; then
            grep -Eq '^PAE_TEST_EXIT=[1-9][0-9]*$' "$status"
            grep -Fq 'running 1 test' "$log"
            grep -Fq 'test result: FAILED. 0 passed; 1 failed; 0 ignored;' "$log"
            grep -Fq 'guest-authored original and save-and-continue futures differ' "$log"
            require_phase_evidence
            printf '%s\n' 'AMD default-NPT PAE strict oracle failed as an expected diagnostic outcome; this is not qualification.'
          else
            printf '%s\n' 'AMD default-NPT PAE observation has no valid pass/fail classification.' >&2
            cat "$status" >&2
            exit 1
          fi
      - name: XSAVE guest-written bytes required gate
        if: always()
        env:
          CARGO_TERM_COLOR: never
          XSAVE_CONTINUATION_REPORT_DIR: ${{ github.workspace }}/snapshot-report/xsave
        run: |
          set -euo pipefail
          mkdir -p "$XSAVE_CONTINUATION_REPORT_DIR"
          printf '%s\n' 'XSAVE_STATUS=required-gate' | tee snapshot-report/xsave-status.txt
          printf '%s\n' 'cargo test --locked --release -p vmm-core --test x86_cpu_snapshots live_kvm::xsave_guest_bytes_survive_cold_continuation -- --ignored --exact --test-threads=1 --nocapture' | tee snapshot-report/xsave.command
          cargo test --locked --release -p vmm-core --test x86_cpu_snapshots \
            live_kvm::xsave_guest_bytes_survive_cold_continuation \
            -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee snapshot-report/xsave.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' snapshot-report/xsave.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x86-snapshot-hardware-${{ github.run_id }}-replica-${{ matrix.replica }}
          path: snapshot-report
          if-no-files-found: error
          retention-days: 30
