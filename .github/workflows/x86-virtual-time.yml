name: Diagnostic / exact Linux checkpoint captures
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  CARGO_BUILD_JOBS: 4
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
jobs:
  checkpoints:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Record source and host identity
        run: |
          mkdir reports
          git rev-parse HEAD > reports/checkout.txt
          uname -a > reports/kernel.txt
          lscpu > reports/cpu.txt
          printf '%s\n' 'Bounded pair of same-seed Linux boots; exact retained checkpoint bytes. No universal snapshot qualification.' > reports/scope.txt
      - name: Download previously built unchanged guest inputs
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 10281314898
          run-id: 34643587353
          github-token: ${{ github.token }}
          path: guest-inputs
          merge-multiple: true
      - name: Verify and stage pinned guest inputs
        run: |
          printf '%s\n' \
            '14e7412186dcac3717b252d2565b04ec75c7f927f94570ea460244122b1c3db7  guest-inputs/MANIFEST.sha256' \
            '60a9498071e72a65078e0cc8c66fe78b830740bffb32ff40c7e40f72ce5e855b  guest-inputs/x86_64/bzImage' \
            '49aa012124f80e8fda3bcd5873ce24470e33ae961ed42fb0ee323f5e6abf2744  guest-inputs/x86_64/initramfs.cpio.gz' \
            > reports/guest-inputs.sha256
          sha256sum -c reports/guest-inputs.sha256
          printf '%s\n' 'run=34643587353' 'artifact=10281314898' \
            'source=69eb758a623e941456d3375dc39752a6e1a60153' \
            'archive_sha256=4f74fa22e381df73c712bbba6d09378c4fceb32e7a92bba08f9a3f04e7619dbb' \
            > reports/guest-source.txt
          mkdir -p consonance/harmony-linux/build
          cp guest-inputs/x86_64/bzImage guest-inputs/x86_64/initramfs.cpio.gz consonance/harmony-linux/build/
      - name: Prepare toolchain and KVM
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          rustc --version > reports/rustc.txt
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -c /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          ls -l /dev/kvm > reports/kvm-device.txt
      - name: Build the exact diagnostic test
        run: cargo test --locked --release -p vmm-core --test x86_kvm_linux_virtual_time --no-run
      - name: Compare one bounded pair and retain the first discrepancy
        env:
          X2_CHECKPOINT_REPORT_DIR: ${{ github.workspace }}/reports/checkpoint-capture
          X2_CHECKPOINT_MAX_STEPS: 200000
          X2_WALL_SECS: 900
        run: |
          printf '%s\n' 'x2_first_divergence_checkpoint_captures; exact; ignored; one pair; total steps<=200000; wall<=900s; external timeout=960s' > reports/command.txt
          timeout -k 10 960 cargo test --locked --release -p vmm-core --test x86_kvm_linux_virtual_time \
            x2_first_divergence_checkpoint_captures -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee reports/checkpoints.log
          grep -q '^test result: ok. 1 passed; 0 failed; 0 ignored;' reports/checkpoints.log
          grep -q '^X2_CHECKPOINT_MATCHED_FINITE_PAIR ' reports/checkpoints.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-checkpoint-captures-${{ github.run_id }}-${{ matrix.replica }}
          path: reports
          if-no-files-found: error
          retention-days: 30
