# SPDX-License-Identifier: AGPL-3.0-or-later
# The searcher's deeper analysis. An instrumented build and run of the whole
# crate costs more than a pull request budget allows, so it runs on a schedule;
# the routing is registered in scripts/ci_contract.py.
name: Checks / Dissonance / Analysis

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dissonance-analysis-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal --component llvm-tools-preview
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dissonance-coverage
          workspaces: dissonance -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Region coverage of the searcher
        run: |
          cargo llvm-cov nextest --manifest-path dissonance/Cargo.toml --release \
            --all-features --lcov --output-path lcov.info --fail-under-regions 88
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dissonance-coverage-${{ github.run_id }}
          path: lcov.info
          if-no-files-found: warn
