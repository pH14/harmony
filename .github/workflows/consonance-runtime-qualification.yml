# SPDX-License-Identifier: AGPL-3.0-or-later
name: Checks / Consonance / Guest Runtime Qualification

on:
  schedule:
    - cron: "11 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0
  HARMONY_GUEST_TOOLCHAIN: nightly-2026-06-16
  HARMONY_PLATFORM_KERNEL: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64/bzImage
  HARMONY_PLATFORM_INITRAMFS: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz
  HARMONY_PLATFORM_FIXTURE: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64/fixture

jobs:
  runtime-artifacts:
    name: Exact Runtime Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$HARMONY_RUST_TOOLCHAIN" --profile minimal
          rustup default "$HARMONY_RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Prepare the exact runtime
        uses: ./.github/actions/exact-platform-runtime
        with:
          report: platform-smoke
      - name: Reject boot without the Harmony clock
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          bash consonance/harmony-linux/linux/test-missing-host-clock.sh \
            "$HARMONY_PLATFORM_KERNEL" "$HARMONY_PLATFORM_INITRAMFS"
      - name: Enable hardware backend
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Extended platform replay
        run: |
          set -o pipefail
          for repetition in 1 2 3; do
            timeout -k 10 720 cargo test --locked --release -p oci-support --test platform --test process_platform -- --ignored --nocapture \
              2>&1 | tee "platform-smoke/replay-$repetition.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-qualification-${{ github.run_id }}
          path: platform-smoke
          if-no-files-found: warn
          retention-days: 14
