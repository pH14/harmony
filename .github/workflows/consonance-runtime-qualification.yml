name: Checks / Consonance / Guest Runtime Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capacity:
    name: Nested VMX Capacity / ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Read nested VMX capacity
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          lscpu
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          cc -O2 -Wall -Wextra -Werror consonance/harmony-linux/linux/nested-kvm-check.c -o /tmp/nested-kvm-check
          /tmp/nested-kvm-check
