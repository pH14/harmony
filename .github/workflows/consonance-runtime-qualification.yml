# SPDX-License-Identifier: AGPL-3.0-or-later
name: Qualification / Final Fresh Nested Image
on:
  workflow_dispatch:
    inputs:
      nested_host_only:
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  nested-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        slot: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 71f0663ef73dd2de5d8e7508831fd86e15a0e3a9
      - name: Check Intel nested VMX
        run: |
          set -euo pipefail
          mkdir -p replay-evidence
          git rev-parse HEAD >replay-evidence/source-commit.txt
          uname -a >replay-evidence/host.txt
          lscpu >>replay-evidence/host.txt
          sudo chmod a+rw /dev/kvm
          cc -O2 -Wall -Wextra -Werror consonance/harmony-linux/linux/nested-kvm-check.c -o /tmp/nested-kvm-check
          /tmp/nested-kvm-check | tee replay-evidence/host-kvm.txt
      - name: Reuse exact boot inputs and search stream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          gh run download 36892879857 --name nested-host-inputs-36892879857 --dir nested-inputs
          gh run download 36892879857 --name nested-host-36892879857 --dir recorded
      - uses: Swatinem/rust-cache@v2
      - name: Build the final inner OCI image
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          mkdir -p fresh-inputs
          bash consonance/nested-driver/build-image.sh fresh-inputs/nested-driver.oci
      - name: Repeated and cold outer restore matrix
        env:
          NESTED_HOST_KERNEL: ${{ github.workspace }}/nested-inputs/bzImage-nested-host
          NESTED_OCI_INITRAMFS: ${{ github.workspace }}/nested-inputs/initramfs-oci.cpio.gz
          NESTED_DRIVER_IMAGE: ${{ github.workspace }}/fresh-inputs/nested-driver.oci
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          timeout -k 10 180 taskset -c "$cpu" cargo test --locked --release -p nested-driver --test nested_restore outer_nested_state_snapshot_matrix -- --ignored --exact --nocapture 2>&1 | tee replay-evidence/nested-restore.log
          set +e
          timeout -k 10 120 taskset -c "$cpu" cargo test --locked --release -p nested-driver --features omit-nested-state --test nested_restore outer_nested_state_snapshot_matrix -- --ignored --exact --nocapture >replay-evidence/nested-restore-omission.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          test "$result" -ne 124
          test "$result" -ne 137
          grep -Fq 'NESTED_MATRIX uninterrupted=pass' replay-evidence/nested-restore-omission.log
          grep -Fq 'NESTED_MATRIX capture_only=pass' replay-evidence/nested-restore-omission.log
          grep -Fq 'NESTED_MATRIX restore_attempt=1' replay-evidence/nested-restore-omission.log
          ! grep -Fq 'NESTED_MATRIX restore=1 pass' replay-evidence/nested-restore-omission.log
      - name: Standard search and full recorded replay
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          cargo build --locked --release -p harmony-cli
          common=(search fresh-inputs/nested-driver.oci --package nested --kernel nested-inputs/bzImage-nested-host --base-initramfs nested-inputs/initramfs-oci.cpio.gz --ram-mib 512 --seed 42)
          set +e
          timeout -k 10 360 taskset -c "$cpu" target/release/harmony "${common[@]}" --executions 100 --wall-minutes 5 --out replay-evidence/search 2>&1 | tee replay-evidence/search.log
          search_result=${PIPESTATUS[0]}
          printf '%s\n' "$search_result" >replay-evidence/search-exit-code.txt
          timeout -k 10 360 taskset -c "$cpu" target/release/harmony "${common[@]}" --replay replay-evidence/search/stream.jsonl --out replay-evidence/replay 2>&1 | tee replay-evidence/replay.log
          replay_result=${PIPESTATUS[0]}
          printf '%s\n' "$replay_result" >replay-evidence/replay-exit-code.txt
          set -e
          test "$search_result" -eq 0
          test "$replay_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nested-search-replay-${{ github.run_id }}-${{ matrix.os }}-${{ matrix.slot }}
          path: replay-evidence
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nested-fresh-inputs-${{ github.run_id }}-${{ matrix.os }}-${{ matrix.slot }}
          path: fresh-inputs
          retention-days: 14
