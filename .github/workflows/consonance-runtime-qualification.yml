# SPDX-License-Identifier: AGPL-3.0-or-later
name: Qualification / Nested Search RAM Audit
on:
  workflow_dispatch:
    inputs:
      nested_host_only:
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  nested-host:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Intel nested VMX
        run: |
          set -euo pipefail
          mkdir -p replay-evidence
          git rev-parse HEAD >replay-evidence/source-commit.txt
          uname -a >replay-evidence/host.txt
          lscpu >>replay-evidence/host.txt
          sudo chmod a+rw /dev/kvm
          cc -O2 -Wall -Wextra -Werror consonance/harmony-linux/linux/nested-kvm-check.c -o /tmp/nested-kvm-check
          /tmp/nested-kvm-check | tee replay-evidence/host-kvm.txt
      - name: Reuse exact boot inputs and search stream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          gh run download 36892879857 --name nested-host-inputs-36892879857 --dir nested-inputs
          gh run download 36892879857 --name nested-host-36892879857 --dir recorded
      - uses: Swatinem/rust-cache@v2
      - name: Direct inner restore sequence
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          timeout -k 10 180 taskset -c "$cpu" cargo test --locked --release -p nested-driver --test live direct_restore_stutters -- --ignored --exact --nocapture 2>&1 | tee replay-evidence/direct.log
      - name: Search and replay with RAM and result audits
        env:
          HARMONY_NESTED_RAM_AUDIT: "1"
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          cargo build --locked --release -p harmony-cli
          common=(search nested-inputs/nested-driver.oci --package nested --kernel nested-inputs/bzImage-nested-host --base-initramfs nested-inputs/initramfs-oci.cpio.gz --ram-mib 512 --seed 42)
          set +e
          HARMONY_NESTED_RESULT_AUDIT=replay-evidence/search-audit timeout -k 10 360 taskset -c "$cpu" target/release/harmony "${common[@]}" --executions 100 --wall-minutes 5 --out replay-evidence/search 2>&1 | tee replay-evidence/search.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" >replay-evidence/search-exit-code.txt
          HARMONY_NESTED_RESULT_AUDIT=replay-evidence/replay-audit timeout -k 10 360 taskset -c "$cpu" target/release/harmony "${common[@]}" --replay replay-evidence/search/stream.jsonl --out replay-evidence/replay 2>&1 | tee replay-evidence/replay.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" >replay-evidence/replay-exit-code.txt
          set -e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nested-search-replay-${{ github.run_id }}
          path: replay-evidence
          retention-days: 14
