# SPDX-License-Identifier: AGPL-3.0-or-later
name: Qualification / Consonance Guest Runtime
on:
  workflow_dispatch:
    inputs:
      nested_host_only:
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
jobs:
  nested-host:
    name: Nested RAM Probe
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Intel nested VMX
        run: |
          set -euo pipefail
          mkdir -p nested-ram-evidence
          git rev-parse HEAD >nested-ram-evidence/source-commit.txt
          uname -a >nested-ram-evidence/host.txt
          lscpu >>nested-ram-evidence/host.txt
          sudo chmod a+rw /dev/kvm
          cc -O2 -Wall -Wextra -Werror consonance/harmony-linux/linux/nested-kvm-check.c -o /tmp/nested-kvm-check
          /tmp/nested-kvm-check | tee nested-ram-evidence/host-kvm.txt
          cat /sys/module/kvm_intel/parameters/{nested,pml,ept,enable_shadow_vmcs} >>nested-ram-evidence/host-kvm.txt
      - name: Install Rust and reuse exact diagnostic boot inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
          gh run download 36883653704 --name nested-host-inputs-36883653704 --dir nested-inputs
      - uses: Swatinem/rust-cache@v2
      - name: Compare incremental capture and full RAM restore control
        env:
          NESTED_HOST_KERNEL: ${{ github.workspace }}/nested-inputs/bzImage-nested-host
          NESTED_OCI_INITRAMFS: ${{ github.workspace }}/nested-inputs/initramfs-oci.cpio.gz
          NESTED_DRIVER_IMAGE: ${{ github.workspace }}/nested-inputs/nested-driver.oci
        run: |
          set -euo pipefail
          cpu=$(python3 -c 'import os; print(min(os.sched_getaffinity(0)))')
          timeout -k 10 300 taskset -c "$cpu" cargo test --locked --release -p nested-driver --test nested_restore outer_nested_state_snapshot_matrix -- --ignored --exact --test-threads=1 --nocapture 2>&1 | tee nested-ram-evidence/probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nested-ram-probe-${{ github.run_id }}
          path: nested-ram-evidence
          retention-days: 14
