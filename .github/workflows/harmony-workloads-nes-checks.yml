# SPDX-License-Identifier: AGPL-3.0-or-later
# NES games searched through the assembled product: the Dissonance searcher
# drives QuickNES inside a Consonance guest, and every mutation restores a
# whole-VM snapshot. The native adapter composition is checked separately in
# Checks / Dissonance Workloads / NES. Backend Equivalence is a registered
# schedule-only exception recorded in scripts/ci_contract.py.
name: Checks / Harmony Workloads / NES

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: harmony-nes-checks-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0
  HARMONY_GUEST_TOOLCHAIN: nightly-2026-06-16
  NOVA_BUILD: workloads/nes/build/nova
  HARMONY_QUICKNES_BUILD_JOBS: "2"

jobs:
  nova:
    name: Nova
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Determine whether this check is applicable
        id: scope
        uses: ./.github/actions/ci-scope
        with:
          kind: harmony_nes
      - name: Initialize the evidence directory
        if: steps.scope.outputs.enabled == 'true'
        run: mkdir -p harmony-nes-check
      - name: Install Nova build tools
        if: steps.scope.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binutils cc65 curl ffmpeg g++ git
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.enabled == 'true'
        with:
          shared-key: harmony-nes-nova
          workspaces: |
            . -> target
            workloads/nes -> target
      - name: Reproduce the pinned Nova ROM and QuickNES core
        if: steps.scope.outputs.enabled == 'true'
        run: |
          workloads/nes/scripts/build-nova-rom.sh "${NOVA_BUILD}"
          scripts/build-quicknes-core.sh "${NOVA_BUILD}/quicknes_libretro.so"
      - name: Restore the qualified guest runtime
        if: steps.scope.outputs.enabled == 'true'
        uses: ./.github/actions/platform-runtime
        with:
          report: harmony-nes-check
      - name: Recover the NES guest image
        id: guest-image
        if: steps.scope.outputs.enabled == 'true'
        uses: ./.github/actions/nes-guest-image
      - name: Require an exact NES guest image
        if: steps.scope.outputs.enabled == 'true' && steps.guest-image.outputs.hit != 'true'
        run: |
          echo '::error::No NES guest image matches this source. Run Benchmarks / Harmony Workloads / NES on this branch to publish one, then rerun this check.'
          exit 1
      - name: Grant nested KVM access
        if: steps.scope.outputs.enabled == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          grep -m1 'model name' /proc/cpuinfo | tee harmony-nes-check/runner.txt
      - name: Build the observation oracle and the CLI
        if: steps.scope.outputs.enabled == 'true'
        run: |
          cargo build --locked --release --manifest-path workloads/nes/Cargo.toml \
            -p nes-workload --features consonance --bin nova-consonance-observation-oracle
          cargo build --locked --release --manifest-path workloads/nes/Cargo.toml --bin nes-film
          cargo build --locked --release -p harmony-cli
      - name: Whole-VM and direct observations agree
        if: steps.scope.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          timeout -k 10 420 \
            workloads/nes/target/release/nova-consonance-observation-oracle \
              --kernel consonance/harmony-linux/build/x86_64/bzImage \
              --platform-initramfs consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
              --image consonance/harmony-linux/build/nes.oci \
              --rom "${NOVA_BUILD}/nova.nes" \
              --core "${NOVA_BUILD}/quicknes_libretro.so" \
              --seed 20260901 --sequences 2 --actions-per-sequence 4 \
            2>&1 | tee harmony-nes-check/observation-oracle.txt
          grep -Eq 'NOVA_CONSONANCE_OBSERVATION_ORACLE_OK sequences=2 actions=[1-9][0-9]* seed=[0-9a-f]{16} stream_sha256=[0-9a-f]{64}$' \
            harmony-nes-check/observation-oracle.txt
      - name: Search Nova through Consonance guest execution
        if: steps.scope.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          timeout -k 10 300 target/release/harmony search --package nes --backend consonance \
            --kernel consonance/harmony-linux/build/x86_64/bzImage \
            --base-initramfs consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
            --image consonance/harmony-linux/build/nes.oci \
            --core "${NOVA_BUILD}/quicknes_libretro.so" \
            --seed 20260901 --workers 1 --executions 4 \
            --out harmony-nes-check/search "${NOVA_BUILD}/nova.nes" \
            2>&1 | tee harmony-nes-check/console.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          run = Path("harmony-nes-check/search")
          prepared = json.loads((run / "prepared.json").read_text())
          if prepared["execution"]["backend"] != "consonance":
              raise SystemExit(
                  "the Harmony NES check did not execute through Consonance: "
                  f"{prepared['execution']['backend']}"
              )
          report = json.loads((run / "report.json").read_text())
          if report.get("executions_completed", 0) <= 0:
              raise SystemExit("the Harmony NES check admitted no executions")
          stream = (run / "stream.jsonl").read_text().splitlines()
          if not any(json.loads(line).get("event") == "job" for line in stream[1:]):
              raise SystemExit("the Harmony NES check recorded no job event")
          PY
      - name: Capture the guest-produced tape natively with game audio
        if: steps.scope.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          cp workloads/nes/NOVA-ARTIFACT-LICENSE.md harmony-nes-check/ARTIFACT-LICENSE.md
          cp workloads/nes/nova-versions.env harmony-nes-check/
          workloads/nes/target/release/nes-film --game nova \
            --rom "${NOVA_BUILD}/nova.nes" \
            --core "${NOVA_BUILD}/quicknes_libretro.so" \
            --rom-sha256 "$(sha256sum "${NOVA_BUILD}/nova.nes" | cut -d' ' -f1)" \
            --core-sha256 "$(sha256sum "${NOVA_BUILD}/quicknes_libretro.so" | cut -d' ' -f1)" \
            --input harmony-nes-check/search/witness-input.json \
            --evidence harmony-nes-check/search/result.json \
            --recorded-backend consonance \
            --out harmony-nes-check/film --max-frames 4096
          python3 scripts/verify-nes-films.py harmony-nes-check/film/film.json --min-seconds 2
          python3 -c 'import json; film=json.load(open("harmony-nes-check/film/film.json")); assert film["endpoint_bridged"] and not film["evidence_verified"]; print(film["provenance"])'
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.enabled == 'true'
        with:
          name: harmony-nes-nova-${{ github.run_id }}
          path: harmony-nes-check
          if-no-files-found: error
          retention-days: 14

  backend-equivalence:
    name: Backend Equivalence
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchains
        run: |
          rustup toolchain install "$HARMONY_RUST_TOOLCHAIN" --profile minimal
          rustup default "$HARMONY_RUST_TOOLCHAIN"
          rustup toolchain install "$HARMONY_GUEST_TOOLCHAIN" --profile minimal \
            --component rust-src --target x86_64-unknown-linux-musl
      - name: Install NES and platform build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binutils bison build-essential bzip2 cc65 cpio flex g++ kmod libelf-dev libssl-dev python3 shellcheck wget
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: harmony-nes-backend-equivalence
          workspaces: |
            . -> target
            cli -> target
            workloads/nes -> target
            workloads/nes-guest -> target
            workloads/nes-machine -> target
            dissonance -> dissonance/target
      - name: Reproduce pinned Nova and QuickNES artifacts
        run: |
          workloads/nes/scripts/build-nova-rom.sh "${NOVA_BUILD}"
          HARMONY_QUICKNES_STATIC_OUTPUT="${NOVA_BUILD}/libquicknes_libretro.a" \
            scripts/build-quicknes-core.sh "${NOVA_BUILD}/quicknes_libretro.so"
      - name: Restore the qualified guest runtime
        id: runtime
        uses: ./.github/actions/platform-runtime
        with:
          require-exact: 'false'
          report: package-backend-report
      - name: Build the canonical guest runtime when none was published
        if: steps.runtime.outputs.scope != 'exact-input'
        run: |
          set -euo pipefail
          rm -rf consonance/harmony-linux/build/x86_64
          make -C consonance/harmony-linux fetch
          HARMONY_RDTSC_ALLOWLIST="$GITHUB_WORKSPACE/consonance/harmony-linux/linux/rdtsc-allowlist-gha.txt" \
          HARMONY_RDRAND_ALLOWLIST="$GITHUB_WORKSPACE/consonance/harmony-linux/linux/rdrand-allowlist-gha.txt" \
            consonance/harmony-linux/scripts/build-platform-runtime.sh
      - name: Verify the guest runtime matches this source
        run: |
          set -euo pipefail
          python3 consonance/harmony-linux/scripts/runtime-artifacts.py verify --architecture x86_64 \
            --artifacts consonance/harmony-linux/build/x86_64 \
            --output package-backend-report/platform-provenance.json
          python3 -c 'import json; assert json.load(open("package-backend-report/platform-provenance.json"))["scope"] == "exact-input"'
      - name: Build the ROM-free NES guest image
        env:
          HARMONY_QUICKNES_STATIC_LIB: ${{ github.workspace }}/workloads/nes/build/nova/libquicknes_libretro.a
        run: |
          make -C consonance/harmony-linux fetch
          workloads/nes-guest/build-base-image.sh
          test -s consonance/harmony-linux/build/nes.oci.sha256
          test -s consonance/harmony-linux/build/nes.oci/index.json
      - name: Grant nested KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Build the backend oracle and the CLI
        run: |
          cargo build --locked --release --manifest-path workloads/nes/Cargo.toml \
            --features consonance --bin nes-backend-oracle
          cargo build --locked --release -p harmony-cli
      - name: Compare Nova on the native and Consonance backends
        run: |
          mkdir -p package-backend-report
          timeout -k 10 900 \
            workloads/nes/target/release/nes-backend-oracle \
              "${NOVA_BUILD}/nova.nes" \
              "${NOVA_BUILD}/quicknes_libretro.so" \
              consonance/harmony-linux/build/x86_64/bzImage \
              consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
              consonance/harmony-linux/build/nes.oci \
            2>&1 | tee package-backend-report/nes-backend-oracle.txt
          grep -Eq '^NES_BACKEND_ORACLE_OK actions=[1-9][0-9]* sha256=[0-9a-f]{64}$' \
            package-backend-report/nes-backend-oracle.txt
      - name: Run bounded CLI searches on both explicit backends
        env:
          PACKAGE_SEED: "20260901"
          PACKAGE_WORKERS: "1"
          PACKAGE_EXECUTIONS: "8"
        run: |
          rm -rf package-native package-consonance
          target/release/harmony search --package nes --backend native \
            --core "${NOVA_BUILD}/quicknes_libretro.so" \
            --seed "${PACKAGE_SEED}" --workers "${PACKAGE_WORKERS}" \
            --executions "${PACKAGE_EXECUTIONS}" \
            --out package-native "${NOVA_BUILD}/nova.nes"
          target/release/harmony search --package nes --backend consonance \
            --kernel consonance/harmony-linux/build/x86_64/bzImage \
            --base-initramfs consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
            --image consonance/harmony-linux/build/nes.oci \
            --seed "${PACKAGE_SEED}" --workers "${PACKAGE_WORKERS}" \
            --executions "${PACKAGE_EXECUTIONS}" \
            --out package-consonance "${NOVA_BUILD}/nova.nes"
          python3 - <<'PY'
          import json
          from pathlib import Path

          native = json.loads(Path("package-native/prepared.json").read_text())
          consonance = json.loads(Path("package-consonance/prepared.json").read_text())
          if native["workload"] != consonance["workload"]:
              raise SystemExit("native and Consonance workload identities differ")
          if native["search"] != consonance["search"]:
              raise SystemExit("native and Consonance search identities differ")
          if native["execution"]["backend"] != "native":
              raise SystemExit("the native search did not record the native backend")
          if consonance["execution"]["backend"] != "consonance":
              raise SystemExit("the Consonance search did not record the Consonance backend")
          for directory in (Path("package-native"), Path("package-consonance")):
              for name in ("prepared.json", "stream.jsonl", "report.json", "checkpoint.json"):
                  if not (directory / name).is_file():
                      raise SystemExit(f"{directory / name} was not produced")
          def jobs(directory):
              return [row for line in Path(directory, "stream.jsonl").read_text().splitlines()
                      if (row := json.loads(line)).get("event") in ("job", "skip")]
          if jobs("package-native") != jobs("package-consonance"):
              raise SystemExit("native and Consonance campaign choices or semantic results differ")
          print("native and Consonance searches have equal identities, choices, and semantic results")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmony-nes-backend-equivalence-${{ github.run_id }}
          path: |
            package-backend-report
            package-native/prepared.json
            package-native/report.json
            package-native/stream.jsonl
            package-consonance/prepared.json
            package-consonance/report.json
            package-consonance/stream.jsonl
          if-no-files-found: warn
          retention-days: 30
