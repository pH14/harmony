name: Retained Linux Continuation Qualification
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0
jobs:
  x3-artifact:
    name: Retained Linux Continuation Executable
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9673f33363395f0850cd2cb5e704432d33434180
      - uses: actions/download-artifact@v4
        with:
          name: x86-guest-image
          path: nix-guest-output
          run-id: 39109973065
          github-token: ${{ github.token }}
      - name: Verify locked Linux image
        run: |
          set -euo pipefail
          (cd nix-guest-output && sha256sum -c guest-image-report.txt)
          echo 'b13eb72fd5c0d438fe5e454da93f64e6171a7754b544e201ee6a6cc63c94d91e  nix-guest-output/x86_64/bzImage' | sha256sum -c
          mkdir provenance
          cp nix-guest-output/guest-image-report.txt provenance/
          printf '%s\n' 'retained image run: 39109973065' 'image source: 953fa4bf49f2e997e90886367f674f2bc313dec6' 'qualification source: 9673f33363395f0850cd2cb5e704432d33434180' > provenance/source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: x3-kernel-provenance
          path: provenance
      - name: Install retained executable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal --target x86_64-unknown-linux-musl
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build owned PID 1 and retain one execution artifact
        run: |
          source consonance/harmony-linux/linux/versions.lock
          mkdir -p consonance/harmony-linux/dl
          curl --fail --location --retry 3 "$KERNEL_URL" -o "consonance/harmony-linux/dl/$(basename "$KERNEL_URL")"
          bash consonance/harmony-linux/linux/build-continuation-initramfs.sh
          python3 scripts/qualify-linux-continuation.py bundle x3-bundle \
            --kernel nix-guest-output/x86_64/bzImage \
            --initramfs consonance/harmony-linux/build/initramfs-continuation.cpio.gz
      - uses: actions/upload-artifact@v4
        with:
          name: x3-executable
          path: x3-bundle
          if-no-files-found: error

  x3-export:
    name: Linux Composed Continuation Export
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: x3-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9673f33363395f0850cd2cb5e704432d33434180
      - uses: actions/download-artifact@v4
        with:
          name: x3-executable
          path: x3-bundle
      - name: Run local continuation arms and retain a completed cut
        run: |
          sudo chmod 666 /dev/kvm
          sudo cat /sys/class/dmi/id/product_uuid | tr '[:upper:]' '[:lower:]' > "$RUNNER_TEMP/host-instance-id"
          python3 scripts/qualify-linux-continuation.py run x3-bundle x3-export \
            --test linux_snapshot_continuation::composed_linux_snapshot_continuation \
            --host-id-file "$RUNNER_TEMP/host-instance-id" --ignored
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x3-export
          path: x3-export
          if-no-files-found: error

  x3-import:
    name: Linux Composed Continuation Import — Replica ${{ matrix.replica }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [x3-artifact, x3-export]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9673f33363395f0850cd2cb5e704432d33434180
      - uses: actions/download-artifact@v4
        with:
          name: x3-executable
          path: x3-bundle
      - uses: actions/download-artifact@v4
        with:
          name: x3-export
          path: x3-export
      - name: Import exact retained Linux snapshot on another host
        run: |
          sudo chmod 666 /dev/kvm
          sudo cat /sys/class/dmi/id/product_uuid | tr '[:upper:]' '[:lower:]' > "$RUNNER_TEMP/host-instance-id"
          python3 scripts/qualify-linux-continuation.py run x3-bundle x3-import \
            --test linux_snapshot_continuation::composed_linux_snapshot_continuation \
            --host-id-file "$RUNNER_TEMP/host-instance-id" --import-from x3-export --ignored
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x3-import-${{ matrix.replica }}
          path: x3-import
          if-no-files-found: error

  x3-compare:
    name: Linux Composed Continuation Results
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [x3-export, x3-import]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9673f33363395f0850cd2cb5e704432d33434180
      - name: Require complete export and import jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os; assert all(job["result"] == "success" for job in json.loads(os.environ["JOB_RESULTS"]).values())'
      - uses: actions/download-artifact@v4
        with:
          name: x3-executable
          path: x3-bundle
      - uses: actions/download-artifact@v4
        with:
          name: x3-export
          path: x3-export
      - uses: actions/download-artifact@v4
        with:
          pattern: x3-import-*
          path: x3-imports
      - name: Require supported cross-vendor continuation
        run: |
          python3 scripts/qualify-linux-continuation.py compare x3-bundle \
            x3-export/receipt.json x3-qualification.json x3-imports/*/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x3-qualification
          path: x3-qualification.json
          if-no-files-found: error

