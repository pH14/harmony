name: Linux Continuation State Diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0
jobs:
  diagnostics:
    name: Retained Cut State Diagnostics — Replica ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: x3-executable
          path: bundle
          run-id: 39160052957
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: x3-export
          path: exported
          run-id: 39159236856
          github-token: ${{ github.token }}
      - name: Run exact original cut with state diagnostics
        run: |
          sudo chmod 666 /dev/kvm
          chmod +x bundle/linux_snapshot_continuation
          mkdir evidence
          cat /proc/cpuinfo > evidence/cpuinfo
          sudo cat /sys/class/dmi/id/product_uuid > evidence/host-id
          uname -a > evidence/kernel
          cp bundle/identity.json evidence/
          set +e
          X3_ARTIFACTS="$PWD/bundle" X3_IMPORT="$PWD/exported/cut" X3_DIAGNOSTICS_DIR="$PWD/evidence/state" bundle/linux_snapshot_continuation composed_linux_snapshot_continuation --ignored --exact --nocapture --test-threads=1 > evidence/execution.log 2>&1
          result=$?
          echo "$result" > evidence/exit-code
          tar -czf state-diagnostics.tar.gz evidence
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-diagnostics-${{ matrix.replica }}
          path: state-diagnostics.tar.gz
          if-no-files-found: error
