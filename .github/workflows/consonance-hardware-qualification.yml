name: Checks / Consonance / Hardware Qualification

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  historical-mmio:
    name: Historical MMIO — Replica ${{ matrix.replica }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0beac8cdb
      - name: Record exact source and host
        run: |
          set -euo pipefail
          mkdir -p mmio-history-report
          git rev-parse HEAD > mmio-history-report/source-revision.txt
          git show -s --format='%H%n%P%n%ci%n%s' HEAD > mmio-history-report/source-commit.txt
          printf 'replica=%s\n' '${{ matrix.replica }}' > mmio-history-report/replica.txt
          uname -a > mmio-history-report/host.txt
          lscpu >> mmio-history-report/host.txt
          cat /proc/cpuinfo > mmio-history-report/cpuinfo.txt
          if test -r /sys/module/kvm_intel/parameters/ept; then
            cat /sys/module/kvm_intel/parameters/ept > mmio-history-report/intel-ept.txt
          fi
      - name: Install toolchain
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup default 1.97.0
      - name: Grant KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
      - name: Run 16 instrumented historical MMIO trials
        run: |
          set -euo pipefail
          cargo test --locked --release -p vmm-core --test x86_cpu_snapshots --no-run > mmio-history-report/build.log 2>&1
          failed=0
          for trial in $(seq -w 0 15); do
            directory="$PWD/mmio-history-report/trial-$trial"
            mkdir -p "$directory"
            set +e
            MMIO_CONTINUATION_REPORT_DIR="$directory" timeout -k 10 60 \
              cargo test --locked --release -p vmm-core --test x86_cpu_snapshots \
              live_kvm::mmio_rmw_finishes_before_full_vmm_snapshot \
              -- --ignored --exact --test-threads=1 --nocapture \
              > "$directory/test.log" 2>&1
            result=$?
            set -e
            printf 'exit=%s\n' "$result" > "$directory/status.txt"
            if [[ "$result" -ne 0 ]]; then failed=1; fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-mmio-${{ github.run_id }}-replica-${{ matrix.replica }}
          path: mmio-history-report
          if-no-files-found: error
