# SPDX-License-Identifier: AGPL-3.0-or-later
name: Benchmarks / Historical bugs

# Historical searches are deliberately off the pull-request path. Pull
# requests have their own short smoke checks; these campaigns run on the
# current default-branch build nightly or when an operator dispatches them.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      executions:
        description: Execution ceiling per search campaign (case default when empty)
        required: false
        type: string
      replay_sessions:
        description: Total fresh replay-session cap per case (case default when empty)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: historical-bugs-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  manifest:
    name: Read historical case manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      runnable_matrix: ${{ steps.read.outputs.runnable_matrix }}
      search_matrix: ${{ steps.read.outputs.search_matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and expand case manifests
        id: read
        run: |
          set -euo pipefail
          python3 scripts/historical-manifest.py --check
          matrix=$(python3 scripts/historical-manifest.py --matrix)
          runnable_matrix=$(python3 scripts/historical-manifest.py --runnable-matrix)
          search_matrix=$(python3 scripts/historical-manifest.py --search-matrix)
          {
            printf 'matrix=%s\n' "${matrix}"
            printf 'runnable_matrix=%s\n' "${runnable_matrix}"
            printf 'search_matrix=%s\n' "${search_matrix}"
          } >>"${GITHUB_OUTPUT}"
      - name: Summarize runnable and deferred cases
        run: |
          set -euo pipefail
          {
            echo "## Historical case manifest"
            echo
            echo "| case | software | CI status | reason |"
            echo "|---|---|---|---|"
            python3 scripts/historical-manifest.py | while IFS=$'\t' read -r case state reason; do
              echo "| ${case} | $(jq -r '.software' "workloads/bugs/historical/${case}/case.json") | ${state} | ${reason:-—} |"
            done
          } >>"${GITHUB_STEP_SUMMARY}"

  guest:
    name: Build the canonical platform runtime
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Compute platform source key
        id: source
        run: echo "key=$(python3 consonance/harmony-linux/scripts/runtime-artifacts.py source-key --architecture x86_64)" >>"$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: runtime
        with:
          path: consonance/harmony-linux/build/x86_64
          key: consonance-platform-v1-x86_64-${{ steps.source.outputs.key }}
      - name: Build exact platform artifacts
        if: steps.runtime.outputs.cache-hit != 'true'
        env:
          HARMONY_RDTSC_ALLOWLIST: ${{ github.workspace }}/consonance/harmony-linux/linux/rdtsc-allowlist-gha.txt
          HARMONY_RDRAND_ALLOWLIST: ${{ github.workspace }}/consonance/harmony-linux/linux/rdrand-allowlist-gha.txt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential flex bison libelf-dev libssl-dev bc cpio kmod bzip2 wget python3
          rustup toolchain install nightly-2026-06-16 --profile minimal --component rust-src --target x86_64-unknown-linux-musl
          make -C consonance/harmony-linux fetch
          consonance/harmony-linux/scripts/build-platform-runtime.sh
      - name: Verify exact platform inputs
        run: |
          python3 consonance/harmony-linux/scripts/runtime-artifacts.py verify --architecture x86_64 \
            --artifacts consonance/harmony-linux/build/x86_64 --output platform-provenance.json
          python3 -c 'import json; assert json.load(open("platform-provenance.json"))["scope"] == "exact-input"'
      - uses: actions/upload-artifact@v4
        with:
          name: historical-guest-${{ github.run_id }}
          path: |
            consonance/harmony-linux/build/x86_64/bzImage
            consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz
          if-no-files-found: error
          retention-days: 1

  tools:
    name: Build Harmony
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build tools
        run: |
          cargo build --locked --release -p harmony-cli
          mkdir -p tools
          cp target/release/harmony tools/harmony
      - uses: actions/upload-artifact@v4
        with:
          name: historical-tools-${{ github.run_id }}
          path: tools
          if-no-files-found: error
          retention-days: 1

  images:
    name: Build ${{ matrix.id }} workload images
    needs: [manifest, guest]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.runnable_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build both pinned arms
        env:
          CASE_DIR: ${{ matrix.dir }}
          IMAGE_PREFIX: ${{ matrix.image_prefix }}
        run: |
          set -euo pipefail
          case_json="${CASE_DIR}/case.json"
          context=$(jq -er .image.context "${case_json}")
          dockerfile=$(jq -er .image.dockerfile "${case_json}")
          mkdir -p oci-images
          for arm in vulnerable control; do
            version=$(jq -er --arg arm "${arm}" '.arms[$arm].version' "${case_json}")
            mapfile -t build_args < <(jq -r --arg arm "${arm}" \
              '.image.build_args[$arm] // {} | to_entries[] | "\(.key)=\(.value)"' "${case_json}")
            args=()
            for build_arg in "${build_args[@]}"; do
              args+=(--build-arg "${build_arg}")
            done
            tag="harmony-${IMAGE_PREFIX}:${version}"
            docker build --pull "${args[@]}" --tag "${tag}" --file "${dockerfile}" "${context}"
            docker save --output "oci-images/${IMAGE_PREFIX}-${version}.oci" "${tag}"
            test -s "oci-images/${IMAGE_PREFIX}-${version}.oci"
          done
      - name: Record workload image checksums
        run: |
          set -euo pipefail
          (cd oci-images && sha256sum -- *.oci >MANIFEST.sha256)
          (cd oci-images && sha256sum -c MANIFEST.sha256)
      - name: Save the PostgreSQL smoke image cache
        if: matrix.id == 'postgres-cic-corruption'
        uses: actions/cache/save@v4
        with:
          path: oci-images
          key: pgcic-oci-v1-${{ hashFiles('workloads/bugs/historical/postgres-cic-corruption/image/**', 'workloads/bugs/historical/postgres-cic-corruption/case.json') }}
      - uses: actions/upload-artifact@v4
        with:
          name: historical-images-${{ matrix.id }}-${{ github.run_id }}
          path: oci-images
          if-no-files-found: error
          retention-days: 1

  search:
    name: Search ${{ matrix.id }} · ${{ matrix.arm }} arm
    needs: [manifest, guest, images, tools]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.search_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.search_timeout_minutes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: historical-guest-${{ github.run_id }}
          path: guest
      - uses: actions/download-artifact@v4
        with:
          name: historical-tools-${{ github.run_id }}
          path: tools
      - uses: actions/download-artifact@v4
        with:
          name: historical-images-${{ matrix.id }}-${{ github.run_id }}
          path: oci-images
      - name: Grant nested KVM access
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
      - name: Run current-build discovery campaign
        env:
          CASE_DIR: ${{ matrix.dir }}
          CASE_ID: ${{ matrix.id }}
          ARM: ${{ matrix.arm }}
          SOFTWARE_NAME: ${{ matrix.software }}
          WORKLOAD_VERSION: ${{ matrix.workload_version }}
          IMAGE_PREFIX: ${{ matrix.image_prefix }}
          HORIZON_MS: ${{ matrix.horizon_ms }}
          RAM_MIB: ${{ matrix.ram_mib }}
          SEED: ${{ matrix.seed }}
          WORKERS: ${{ matrix.workers }}
          ACTIONS: ${{ matrix.actions }}
          EXECUTIONS: ${{ inputs.executions || matrix.executions }}
          WALL_MINUTES: ${{ matrix.wall_minutes }}
          KNOBS: ${{ matrix.knobs }}
          ORACLE_ASSERTION: ${{ matrix.oracle_assertion }}
          ORACLE_EVIDENCE: ${{ matrix.oracle_evidence }}
        run: scripts/historical-search.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-search-${{ matrix.id }}-${{ matrix.arm }}-${{ github.run_id }}
          path: reports
          if-no-files-found: warn
          retention-days: 30

  differential:
    name: Differential replay ${{ matrix.id }}
    needs: [manifest, guest, images, tools, search]
    if: always()
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.manifest.outputs.runnable_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: historical-guest-${{ github.run_id }}
          path: guest
      - uses: actions/download-artifact@v4
        with:
          name: historical-tools-${{ github.run_id }}
          path: tools
      - uses: actions/download-artifact@v4
        with:
          name: historical-images-${{ matrix.id }}-${{ github.run_id }}
          path: oci-images
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: historical-search-${{ matrix.id }}-vulnerable-${{ github.run_id }}
          path: reports
      - name: Grant nested KVM access
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm
      - name: Replay the first current-build finding on the fixed arm
        env:
          CASE_DIR: ${{ matrix.dir }}
          CASE_ID: ${{ matrix.id }}
          SOFTWARE_NAME: ${{ matrix.software }}
          VULNERABLE_VERSION: ${{ matrix.vulnerable_version }}
          CONTROL_VERSION: ${{ matrix.control_version }}
          IMAGE_PREFIX: ${{ matrix.image_prefix }}
          HORIZON_MS: ${{ matrix.horizon_ms }}
          RAM_MIB: ${{ matrix.ram_mib }}
          KNOBS: ${{ matrix.knobs }}
          ORACLE_ASSERTION: ${{ matrix.oracle_assertion }}
          ORACLE_EVIDENCE: ${{ matrix.oracle_evidence }}
          REPLAY_ARMS: control
          REPLAY_REPEATS: 1
          REPLAY_TIMEOUT_SECONDS: ${{ matrix.replay_timeout_seconds }}
          MAX_REPLAY_SESSIONS: ${{ inputs.replay_sessions || matrix.replay_max_sessions }}
          PLANNED_REPLAY_SESSIONS: ${{ matrix.planned_replay_sessions }}
        run: |
          set -euo pipefail
          if [[ ! "${MAX_REPLAY_SESSIONS}" =~ ^[1-9][0-9]*$ ]] ||
             (( MAX_REPLAY_SESSIONS < PLANNED_REPLAY_SESSIONS )); then
            echo "${CASE_ID}: replay cap ${MAX_REPLAY_SESSIONS} is below the aggregate plan of ${PLANNED_REPLAY_SESSIONS} sessions" >&2
            exit 1
          fi
          input="reports/${CASE_ID}.vulnerable.search/first-bug-input.json"
          if [[ -s "${input}" ]]; then
            scripts/historical-replay.sh discovery "${input}"
          else
            mkdir -p "reports/${CASE_ID}.control.discovery"
            jq -n --arg status search-miss --arg case_id "${CASE_ID}" \
              '{case_id:$case_id, mode:"discovery", status:$status}' \
              >"reports/${CASE_ID}.control.discovery/panel-status.json"
            echo "${CASE_ID}: no current-build finding was available for differential replay" >&2
          fi
      - name: Replay manifest-declared clean samples within the cap
        env:
          SAMPLE_PATHS_JSON: ${{ toJSON(matrix.sample_paths) }}
          MAX_REPLAY_SESSIONS: ${{ inputs.replay_sessions || matrix.replay_max_sessions }}
          CASE_DIR: ${{ matrix.dir }}
          CASE_ID: ${{ matrix.id }}
          SOFTWARE_NAME: ${{ matrix.software }}
          VULNERABLE_VERSION: ${{ matrix.vulnerable_version }}
          CONTROL_VERSION: ${{ matrix.control_version }}
          IMAGE_PREFIX: ${{ matrix.image_prefix }}
          HORIZON_MS: ${{ matrix.horizon_ms }}
          RAM_MIB: ${{ matrix.ram_mib }}
          KNOBS: ${{ matrix.knobs }}
          ORACLE_ASSERTION: ${{ matrix.oracle_assertion }}
          ORACLE_EVIDENCE: ${{ matrix.oracle_evidence }}
          REPLAY_ARMS: vulnerable
          REPLAY_REPEATS: 2
          REPLAY_TIMEOUT_SECONDS: ${{ matrix.replay_timeout_seconds }}
          PLANNED_REPLAY_SESSIONS: ${{ matrix.planned_replay_sessions }}
        run: |
          set -euo pipefail
          if [[ ! "${MAX_REPLAY_SESSIONS}" =~ ^[1-9][0-9]*$ ]] ||
             (( MAX_REPLAY_SESSIONS < PLANNED_REPLAY_SESSIONS )); then
            echo "${CASE_ID}: replay cap ${MAX_REPLAY_SESSIONS} is below the aggregate plan of ${PLANNED_REPLAY_SESSIONS} sessions" >&2
            exit 1
          fi
          remaining=${MAX_REPLAY_SESSIONS}
          input="reports/${CASE_ID}.vulnerable.search/first-bug-input.json"
          if [[ -s "${input}" ]]; then
            remaining=$((remaining - 1))
          fi
          mapfile -t samples < <(jq -r '.[]' <<<"${SAMPLE_PATHS_JSON}")
          for sample in "${samples[@]}"; do
            [[ -n "${sample}" ]] || continue
            if (( remaining < 2 )); then
              echo "${CASE_ID}: replay cap exhausted before sample ${sample}" >&2
              exit 1
            fi
            MAX_REPLAY_SESSIONS=${remaining} scripts/historical-replay.sh sample "${sample}"
            remaining=$((remaining - 2))
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-differential-${{ matrix.id }}-${{ github.run_id }}
          path: reports
          if-no-files-found: warn
          retention-days: 30

  report:
    name: Render historical panel
    needs: [manifest, guest, tools, images, search, differential]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: historical-search-*-${{ github.run_id }}
          path: reports
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: historical-differential-*-${{ github.run_id }}
          path: reports
          merge-multiple: true
      - name: Render the roster from this run's reports
        run: |
          set -euo pipefail
          python3 scripts/historical-manifest.py --check
          python3 scripts/render-historical-bugs.py --reports reports
          {
            echo "## Historical panel roster"
            echo
            sed -n '/render-historical-bugs:begin/,/render-historical-bugs:end/p' \
              workloads/bugs/historical/README.md | grep -v render-historical-bugs
          } >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-roster-${{ github.run_id }}
          path: workloads/bugs/historical/README.md
          if-no-files-found: warn
          retention-days: 30
