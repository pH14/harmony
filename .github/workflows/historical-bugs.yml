# Diagnostic branch only: replay the pinned reference with observation logging.
name: Snapshot KVM reproduction
on:
  workflow_dispatch:
    inputs:
      reference:
        description: Run the pinned historical investigation
        type: boolean
        default: true
      retire_completions:
        description: Test zero-instruction completion retirement after serviced exits
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: snapshot-reproduction-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reference:
    if: ${{ inputs.reference }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostics
      - uses: actions/checkout@v4
        with:
          ref: 7c1f9e89ab9eb232b8a72cdae29198dad11e9ce6
          path: reference
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34441848506
          name: guest-images-34441848506
          path: reference/guest
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34441848506
          name: oci-images-34441848506
          path: reference/oci-images
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34441848506
          name: harmony-tools-34441848506
          path: reference/tools
      - name: Record provenance and instrument reference
        env:
          RETIRE_COMPLETIONS: ${{ inputs.retire_completions }}
        run: |
          mkdir -p reference/reports
          git -C reference rev-parse HEAD > reference/reports/reference-head.txt
          sha256sum reference/guest/* reference/oci-images/* reference/tools/* > reference/reports/input-sha256.txt
          flags=()
          if [[ "$RETIRE_COMPLETIONS" == true ]]; then flags+=(--retire-completions); fi
          python3 diagnostics/.github/scripts/snapshot-diagnostics.py reference "${flags[@]}"
          git -C reference diff > reference/reports/instrumentation.patch
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reference -> target
          shared-key: snapshot-reference
      - name: Build instrumented shipping CLI
        working-directory: reference
        run: |
          cargo build --locked --release -p harmony-cli 2>&1 | tee reports/build.log
          cp target/release/harmony tools/harmony
          chmod +x tools/*
          sha256sum tools/* > reports/instrumented-tools-sha256.txt
      - name: Run unchanged investigation acceptance on KVM
        working-directory: reference
        env:
          CASE_ID: postgres-cic-corruption
          HORIZON_MS: 500
          RAM_MIB: 1024
          VULNERABLE_VERSION: '14.3'
          ORACLE_ASSERTION: 2
          KNOBS: faultlab.churn_rows=20 faultlab.churn_slices=2 faultlab.churn_rounds=1200
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          uname -a > reports/host.txt
          lscpu >> reports/host.txt
          .github/scripts/historical-investigate.sh bugs/historical/postgres-cic-corruption/witness.json 2>&1 | tee reports/investigation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-reproduction-${{ github.run_id }}
          path: reference/reports
          retention-days: 14
          if-no-files-found: error

  completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test completion retirement and cold restore on real KVM
        shell: bash
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/head.txt
          cp .github/scripts/snapshot-completion-test.rs consonance/vmm-backend/tests/kvm_smoke.rs
          git diff > reports/test.patch
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          uname -a > reports/host.txt
          cargo test --locked -p vmm-backend --test kvm_smoke completion_retirement -- --ignored --test-threads=1 2>&1 | tee reports/completion.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-kvm-${{ github.run_id }}
          path: reports
          retention-days: 14
