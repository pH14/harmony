# Diagnostic branch only: replay the pinned reference with observation logging.
name: Snapshot KVM reproduction
on:
  workflow_dispatch:
    inputs:
      reference:
        description: Run the pinned historical investigation
        type: boolean
        default: true
      retire_completions:
        description: Test zero-instruction completion retirement after serviced exits
        type: boolean
        default: false
      backend_boundaries:
        description: Test backend-owned completion with raw report hashes and execution identity checks
        type: boolean
        default: false
      cpu_snapshot:
        description: Qualify versioned CPU snapshots with the PAE cached-PDPTR witness
        type: boolean
        default: false
      msr_snapshot:
        description: Qualify MSR, PIO and fragmented MMIO snapshot completion boundaries
        type: boolean
        default: false
      cli_continuation:
        description: Compare actual original, fork, cold and split CLI endpoint identity
        type: boolean
        default: false
      candidate_ref:
        description: Exact candidate commit or branch for snapshot qualification
        type: string
        default: codex/snapshot-cpu-state
permissions:
  contents: read
  actions: read
concurrency:
  group: snapshot-reproduction-${{ github.ref }}-${{ inputs.cpu_snapshot }}-${{ inputs.msr_snapshot }}
  cancel-in-progress: false
jobs:
  cli-continuation:
    if: ${{ inputs.cli_continuation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostics
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34441848506
          name: guest-images-34441848506
          path: candidate/guest
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34441848506
          name: oci-images-34441848506
          path: candidate/oci-images
      - name: Record host and candidate provenance
        working-directory: candidate
        run: |
          set -euo pipefail
          mkdir -p reports
          git rev-parse HEAD > reports/candidate-head.txt
          git -C ../diagnostics rev-parse HEAD > reports/diagnostic-head.txt
          uname -a > reports/host.txt
          lscpu >> reports/host.txt
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sha256sum guest/* oci-images/* > reports/input-sha256.txt
          python3 ../diagnostics/.github/scripts/candidate-continuation.py --self-test
      - name: Install static guest toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            candidate -> target
            candidate/workloads/fault-agent -> target
      - name: Build candidate CLI and fault agent
        working-directory: candidate
        run: |
          set -euo pipefail
          cargo build --locked --release -p harmony-cli
          cargo build --locked --release --manifest-path workloads/fault-agent/Cargo.toml --target x86_64-unknown-linux-musl
          mkdir -p tools
          cp target/release/harmony tools/harmony
          cp workloads/fault-agent/target/x86_64-unknown-linux-musl/release/fault-agent tools/fault-agent
          file tools/fault-agent | grep -Eiq static
          sha256sum tools/* > reports/tool-sha256.txt
      - name: Original, fork, cold and split identity on real KVM
        working-directory: candidate
        run: python3 ../diagnostics/.github/scripts/candidate-continuation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-continuation-kvm-${{ github.run_id }}
          path: candidate/reports
          if-no-files-found: error
          retention-days: 7
  reference:
    if: ${{ inputs.reference }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: diagnostics
      - uses: actions/checkout@v4
        with:
          ref: 7c1f9e89ab9eb232b8a72cdae29198dad11e9ce6
          path: reference
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34441848506
          name: guest-images-34441848506
          path: reference/guest
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34441848506
          name: oci-images-34441848506
          path: reference/oci-images
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 34441848506
          name: harmony-tools-34441848506
          path: reference/tools
      - name: Record provenance and instrument reference
        env:
          RETIRE_COMPLETIONS: ${{ inputs.retire_completions }}
          BACKEND_BOUNDARIES: ${{ inputs.backend_boundaries }}
        run: |
          mkdir -p reference/reports
          git -C reference rev-parse HEAD > reference/reports/reference-head.txt
          sha256sum reference/guest/* reference/oci-images/* reference/tools/* > reference/reports/input-sha256.txt
          flags=()
          if [[ "$RETIRE_COMPLETIONS" == true ]]; then flags+=(--retire-completions); fi
          if [[ "$BACKEND_BOUNDARIES" == true ]]; then
            test "$RETIRE_COMPLETIONS" == false
            git -C reference apply ../diagnostics/.github/scripts/kvm-completion-boundaries.patch
            git -C reference apply ../diagnostics/.github/scripts/report-digest.patch
            flags+=(--check-execution-identity)
          fi
          python3 diagnostics/.github/scripts/snapshot-diagnostics.py reference "${flags[@]}"
          if [[ "$BACKEND_BOUNDARIES" == true ]]; then
            python3 diagnostics/.github/scripts/snapshot-inspection-tests.py reference/.github/scripts/historical-investigate.sh
          fi
          git -C reference diff > reference/reports/instrumentation.patch
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reference -> target
          shared-key: snapshot-reference
      - name: Build instrumented shipping CLI
        working-directory: reference
        run: |
          cargo build --locked --release -p harmony-cli 2>&1 | tee reports/build.log
          cp target/release/harmony tools/harmony
          chmod +x tools/*
          sha256sum tools/* > reports/instrumented-tools-sha256.txt
      - name: Run investigation acceptance on KVM
        working-directory: reference
        env:
          CASE_ID: postgres-cic-corruption
          HORIZON_MS: 500
          RAM_MIB: 1024
          VULNERABLE_VERSION: '14.3'
          ORACLE_ASSERTION: 2
          KNOBS: faultlab.churn_rows=20 faultlab.churn_slices=2 faultlab.churn_rounds=1200
        run: |
          trap 'cp "$GITHUB_STEP_SUMMARY" reports/step-summary.md' EXIT
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          uname -a > reports/host.txt
          lscpu >> reports/host.txt
          .github/scripts/historical-investigate.sh bugs/historical/postgres-cic-corruption/witness.json 2>&1 | tee reports/investigation.log
      - name: Compare original, cold and split guest events
        if: ${{ inputs.backend_boundaries }}
        run: python3 diagnostics/.github/scripts/snapshot-events-check.py reference/reports postgres-cic-corruption | tee reference/reports/events-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-reproduction-${{ github.run_id }}
          path: reference/reports
          retention-days: 14
          if-no-files-found: error

  completion:
    if: ${{ !inputs.cpu_snapshot && !inputs.msr_snapshot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Test completion retirement and cold restore on real KVM
        shell: bash
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/head.txt
          filter=completion_retirement
          if [[ '${{ inputs.backend_boundaries }}' == true ]]; then
            git apply .github/scripts/kvm-completion-boundaries.patch
            cp .github/scripts/snapshot-completion-boundary-test.rs consonance/vmm-backend/tests/kvm_smoke.rs
            filter=serviced_pio_is_exactly_snapshottable_without_guest_execution
          else
            cp .github/scripts/snapshot-completion-test.rs consonance/vmm-backend/tests/kvm_smoke.rs
          fi
          git diff > reports/test.patch
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          uname -a > reports/host.txt
          cargo test --locked -p vmm-backend --test kvm_smoke "$filter" -- --ignored --test-threads=1 2>&1 | tee reports/completion.log
          if [[ '${{ inputs.backend_boundaries }}' == true ]]; then
            git apply -R .github/scripts/kvm-completion-boundaries.patch
            set +e
            cargo test --locked -p vmm-backend --test kvm_smoke "$filter" -- --ignored --test-threads=1 > reports/completion-negative-control.log 2>&1
            control_status=$?
            set -e
            test "$control_status" -ne 0
            grep -q 'serviced PIO has already completed' reports/completion-negative-control.log
            echo 'Unmodified backend rejected at the expected serviced-PIO state assertion' >> reports/completion-negative-control.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-kvm-${{ github.run_id }}
          path: reports
          retention-days: 14

  cpu-snapshot:
    if: ${{ inputs.cpu_snapshot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: snapshot-cpu-candidate
      - name: Qualify CPU snapshot continuation on real KVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          git rev-parse HEAD > reports/candidate-head.txt
          uname -a > reports/host.txt
          lscpu >> reports/host.txt
          # AMD NPT loads guest PDPTRs from RAM; this witness specifically
          # exercises the cached SREGS2 state supplied by userspace. Shadow
          # paging retains that state on AMD (svm_cache_reg in upstream KVM).
          # This changes only the disposable job VM, before any vCPU exists.
          if [ -e /sys/module/kvm_amd/parameters/npt ]; then
            cat /sys/module/kvm_amd/parameters/npt > reports/amd-npt-before.txt
            sudo modprobe -r kvm_amd
            sudo modprobe kvm_amd npt=0
            cat /sys/module/kvm_amd/parameters/npt > reports/amd-npt-test.txt
            grep -Eq '^(N|0)$' reports/amd-npt-test.txt
          fi
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          cargo test --locked -p vm-state -p vmm-core --lib 2>&1 | tee reports/portable.log
          cargo test --locked -p vmm-core --test x86_cpu_snapshots -- --ignored --test-threads=1 --nocapture 2>&1 | tee reports/pae-kvm.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-snapshot-kvm-${{ github.run_id }}
          path: reports
          retention-days: 14

  msr-snapshot:
    if: ${{ inputs.msr_snapshot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: snapshot-msr-candidate
      - name: Qualify scalar completion snapshots on real KVM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          git rev-parse HEAD > reports/candidate-head.txt
          uname -a > reports/host.txt
          lscpu >> reports/host.txt
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm
          cargo test --locked -p vmm-backend --lib 2>&1 | tee reports/portable.log
          cargo test --locked -p vmm-backend --test kvm_smoke serviced_ -- --ignored --test-threads=1 --nocapture 2>&1 | tee reports/scalar-kvm.log
          cargo test --locked -p vmm-core --test x86_cpu_snapshots live_kvm::mmio_rmw_finishes_before_full_vmm_snapshot -- --ignored --test-threads=1 --nocapture 2>&1 | tee reports/mmio-vmm-kvm.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalar-snapshot-kvm-${{ github.run_id }}
          path: reports
          retention-days: 14
