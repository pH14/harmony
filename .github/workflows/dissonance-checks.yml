# SPDX-License-Identifier: AGPL-3.0-or-later
name: Checks / Dissonance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: dissonance-checks-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0
  # The searcher's tests run the real selection machinery, so a debug build
  # spends longer in the search than it does compiling.
  CARGO_PROFILE: release

jobs:
  scope:
    name: Change Selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_checks: ${{ steps.rust_checks.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: rust_checks
        uses: ./.github/actions/ci-scope
        with:
          kind: rust_checks
          target: dissonance-checks.yml

  archive:
    name: Archive
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal --component clippy
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: dissonance-archive
          workspaces: dissonance -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Lint the searcher
        run: |
          cargo clippy --locked --manifest-path dissonance/Cargo.toml --release \
            --all-features --all-targets -- -D warnings
      - name: Retention, cell keys and the input draw
        run: |
          set -euo pipefail
          filter=$(python3 scripts/ci_contract.py nextest-filter searcher 'Archive')
          cargo nextest run --locked --manifest-path dissonance/Cargo.toml --release \
            --all-features -p searcher --lib -E "$filter"
      - name: Account for every searcher module test
        run: python3 scripts/check-test-partition.py searcher

  scheduling:
    name: Scheduling
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: dissonance-scheduling
          workspaces: dissonance -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Horizons, step estimates and worker parallelism
        run: |
          set -euo pipefail
          filter=$(python3 scripts/ci_contract.py nextest-filter searcher 'Scheduling')
          cargo nextest run --locked --manifest-path dissonance/Cargo.toml --release \
            --all-features -p searcher --lib -E "$filter"
          cargo nextest run --locked --manifest-path dissonance/Cargo.toml --release \
            --all-features -p searcher --test adaptive_durations

  search-coordination:
    name: Search Coordination
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: dissonance-search-coordination
          workspaces: dissonance -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Continuations, entropy and the adapter interface
        run: |
          set -euo pipefail
          filter=$(python3 scripts/ci_contract.py nextest-filter searcher 'Search Coordination')
          cargo nextest run --locked --manifest-path dissonance/Cargo.toml --release \
            --all-features -p searcher --lib -E "$filter"
          cargo nextest run --locked --manifest-path dissonance/Cargo.toml --release \
            --all-features -p searcher --test interfaces

  campaign-recording-and-replay:
    name: Campaign Recording and Replay
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: dissonance-campaign
          workspaces: dissonance -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Campaign records and their replay
        run: |
          set -euo pipefail
          filter=$(python3 scripts/ci_contract.py nextest-filter searcher 'Campaign Recording and Replay')
          cargo nextest run --locked --manifest-path dissonance/Cargo.toml --release \
            --all-features -p searcher --lib -E "$filter"
          cargo nextest run --locked --manifest-path dissonance/Cargo.toml --release \
            --all-features -p searcher --test adaptive_campaign
