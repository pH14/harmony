# SPDX-License-Identifier: AGPL-3.0-or-later
name: Acceptance / Linux snapshot consistency smoke

on:
  pull_request:
    paths: ["consonance/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "flake.nix", "flake.lock", ".github/workflows/snapshot-linux-smoke.yml"]
  push:
    branches: [main]
    paths: ["consonance/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "flake.nix", "flake.lock", ".github/workflows/snapshot-linux-smoke.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
concurrency:
  group: snapshot-linux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  HARMONY_RUST_TOOLCHAIN: 1.97.0

jobs:
  linux-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize evidence
        run: |
          mkdir -p linux-consistency-report
          git rev-parse HEAD >linux-consistency-report/commit.txt
          uname -a >linux-consistency-report/host.txt
          lscpu >>linux-consistency-report/host.txt
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: Compute shared platform source key
        id: source
        run: echo "key=$(python3 consonance/harmony-linux/scripts/runtime-artifacts.py source-key --architecture x86_64)" >>"$GITHUB_OUTPUT"
      - name: Restore exact qualified platform
        id: exact
        uses: actions/cache/restore@v4
        with:
          path: consonance/harmony-linux/build/x86_64
          key: consonance-platform-v1-x86_64-${{ steps.source.outputs.key }}
      - name: Locate exact qualification handoff
        id: handoff
        if: steps.exact.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KEY: ${{ steps.source.outputs.key }}
        run: |
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="consonance-platform-v1-x86_64-$SOURCE_KEY" -F per_page=100 \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .workflow_run.id // empty')
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.handoff.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.handoff.outputs.run_id }}
          name: consonance-platform-v1-x86_64-${{ steps.source.outputs.key }}
          path: consonance/harmony-linux/build/x86_64
      - name: Require source-correct Linux fixtures
        run: |
          python3 consonance/harmony-linux/scripts/runtime-artifacts.py verify --architecture x86_64 \
            --artifacts consonance/harmony-linux/build/x86_64 --output linux-consistency-report/provenance.json
          python3 -c 'import json; assert json.load(open("linux-consistency-report/provenance.json"))["scope"] == "exact-input", "Run the platform publisher on this source before qualifying Linux snapshots"'
          test -s consonance/harmony-linux/build/x86_64/initramfs.cpio.gz
      - name: Stage verified Linux fixture
        run: |
          cp consonance/harmony-linux/build/x86_64/bzImage consonance/harmony-linux/build/bzImage
          cp consonance/harmony-linux/build/x86_64/initramfs.cpio.gz consonance/harmony-linux/build/initramfs.cpio.gz
          cp consonance/harmony-linux/build/x86_64/runtime-manifest.json linux-consistency-report/runtime-manifest.json
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Build Linux consistency test
        run: cargo test --locked --release -p vmm-core --test x86_kvm_linux_virtual_time --no-run
      - name: Compare two complete same-seed Linux execution logs
        env:
          X2_BOOTS: "2"
          X2_WALL_SECS: "55"
        run: |
          set -euo pipefail
          timeout -k 10 240 cargo test --locked --release -p vmm-core \
            --test x86_kvm_linux_virtual_time x2_same_seed_boots_one_normalized_log \
            -- --ignored --exact --test-threads=1 --nocapture \
            2>&1 | tee linux-consistency-report/test.txt
          grep -Fqx 'X2_BOOTS=2' linux-consistency-report/test.txt
          grep -Eq '^X2_EVENTS=[1-9][0-9]*$' linux-consistency-report/test.txt
          grep -Fqx 'X2_DIVERGENCES=0' linux-consistency-report/test.txt
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' linux-consistency-report/test.txt
      - name: Failure-only paired-checkpoint diagnostic
        if: failure()
        continue-on-error: true
        run: |
          set -euo pipefail
          event=""
          if [[ -f linux-consistency-report/test.txt ]]; then
            event="$(sed -nE 's/.*event_index: ([0-9]+), field: StateHash.*/\1/p' linux-consistency-report/test.txt | sed -n '1p')"
          fi
          if [[ -z "${event}" ]]; then
            cat >linux-consistency-report/paired-checkpoint-diagnostic-unavailable.txt <<'EOF'
          X2_PAIRED_DIAGNOSTIC_UNAVAILABLE no StateHash divergence index was found in test.txt
          EOF
            exit 0
          fi
          printf '%s\n' "${event}" >linux-consistency-report/original-divergence-event.txt
          X2_WALL_SECS=120 \
          X2_PAIRED_REPORT="$PWD/linux-consistency-report/x2-paired-checkpoint" \
            timeout -k 10 180 cargo test --locked --release -p vmm-core \
              --test x86_kvm_linux_virtual_time x2_paired_boots_retain_first_checkpoint_difference \
              -- --ignored --exact --test-threads=1 --nocapture \
              2>&1 | tee linux-consistency-report/paired-checkpoint-diagnostic.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-linux-smoke-${{ github.run_id }}
          path: linux-consistency-report
          if-no-files-found: error
          retention-days: 14
