name: box

# The HARDWARE lane (docs/TESTING.md, "the runner-label scheme for hardware
# lanes"). Everything in `quality.yml` is a CONTENT check that a hosted runner
# can answer; the gates here need bare metal — a real /dev/kvm, the patched KVM
# modules, hardware performance counters, and quiet pinned cores.
#
# ## This workflow is INERT until a box registers
#
# Each job below is keyed on a self-hosted runner **label set**. GitHub only
# schedules a job when a runner matching every label is registered; with no such
# runner, these jobs simply never schedule and the workflow is a no-op. That is
# deliberate: the lane is a drop-in, landed now so the day a box is registered
# needs no workflow edit and no archaeology into which command ran which gate.
#
# `workflow_dispatch` only — **no schedule**. The box is a shared, leased
# resource: a cron-triggered run would take a core out from under whoever is
# using it, and a determinism gate contending with another workload is a gate
# whose result means nothing (that is what the pinned cores are for). A human
# starts a run when a window is free.
#
# ## The label scheme
#
# The first three labels are CAPABILITIES (self-hosted, has KVM, this
# architecture); the fourth is the CHIP BASELINE IDENTITY. A gate that depends
# on a specific chip names that chip; a gate that merely needs KVM does not.
# This is what stops a determinism gate from scheduling onto the wrong silicon
# and reporting a green that means nothing.
#
#   [self-hosted, kvm, x86_64, det-cfl-v1]   the x86 determinism box
#   [self-hosted, kvm, arm64,  msr1]         the arm64 box
#
# Adding a box means registering a runner with the matching labels and adding
# its `HostId` variant in consonance/acceptance-suite/src/manifest.rs — the
# acceptance matrix's host axis and these labels name the same hosts.

on:
  workflow_dispatch:
    inputs:
      gates:
        description: >-
          Space-separated gate names for the x86 lane (see
          `scripts/box-gates.sh --list`). Empty runs every gate, in order.
        required: false
        default: ""
      skip:
        description: >-
          Space-separated gate names to skip on the x86 lane. Useful to drop the
          multi-hour workload gates from a short window.
        required: false
        default: ""

# One hardware run at a time, repo-wide. Two concurrent runs would contend for
# the same pinned cores and the same KVM modules — and the module revert of one
# would land under the other's live guest. `cancel-in-progress: false`: a
# half-finished run must be allowed to reach its revert step.
concurrency:
  group: box-hardware
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The x86 determinism box: the packaged hardware suite. `scripts/box-gates.sh`
  # owns the gate ordering (pvclock's g0 smoke first), the core pinning, and the
  # patched-module load/revert discipline — this job only invokes it, so the
  # hand-run path on the box and the CI path are the same path.
  x86:
    name: x86 hardware suite (det-cfl-v1)
    runs-on: [self-hosted, kvm, x86_64, det-cfl-v1]
    # Long enough for the multi-hour workload gates; a run that exceeds it has
    # wedged, and failing loudly beats holding the box's cores indefinitely.
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - name: Show the gate list
        run: scripts/box-gates.sh --list
      - name: Run the hardware gates
        # The dispatch inputs reach the shell through `env`, never through
        # `${{ }}` interpolation into the script body — interpolation would
        # splice attacker-chosen text straight into a command line.
        env:
          GATES: ${{ inputs.gates }}
          SKIP: ${{ inputs.skip }}
        run: |
          args=()
          if [[ -n "$GATES" ]]; then
            read -r -a names <<< "$GATES"
            args+=("${names[@]}")
          fi
          if [[ -n "$SKIP" ]]; then
            read -r -a skips <<< "$SKIP"
            args+=(--skip "${skips[@]}")
          fi
          scripts/box-gates.sh ${args[@]+"${args[@]}"}
      - name: Confirm the box was left on stock KVM
        # The script reverts after every patched gate and verifies each revert.
        # This is the belt-and-braces check on the run as a whole: the box is
        # shared, and a patched module left loaded silently changes the meaning
        # of the next person's run. `if: always()` so it also runs after a
        # failed gate — that is precisely when a module is most likely stranded.
        if: always()
        run: |
          size=$(awk '$1 == "kvm" { print $2 }' /proc/modules | head -n1)
          expected="${STOCK_KVM_SIZE:-1396736}"
          if [[ "$size" != "$expected" ]]; then
            echo "::error::box left with kvm module size '$size' (stock is $expected) — \
          the patched modules are still loaded. Revert them before the next run."
            exit 1
          fi
          echo "box is on stock KVM (kvm size $size)"

  # The arm64 box: the CPU-qualification lane (docs/TESTING.md, rung 1).
  #
  # The qualification suite does not exist yet — it is specified in TESTING.md
  # and built in a later PR. Until then this lane runs the portable arm64 checks
  # on real arm64 silicon (which the x86 CI can only cross-CHECK, never run) and
  # states plainly what is still missing. It reports what it DID, and names what
  # it did not: an unbuilt suite must never read as a passing one.
  arm64-cpu-qualification:
    name: arm64 CPU qualification (msr1)
    runs-on: [self-hosted, kvm, arm64, msr1]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder — the CPU-qualification suite is not built yet
        run: |
          echo "CPU qualification (docs/TESTING.md, rung 1) is SPECIFIED, NOT BUILT."
          echo "This lane exists so the day the suite lands it has a runner and a home."
          echo
          echo "What rung 1 must answer on this chip, once built:"
          echo "  * classify every advertised instruction/feature as"
          echo "    deterministically-pure / must-trap / forbidden"
          echo "  * per-chip exactness: does a retired-branch deadline land where"
          echo "    the machinery says it lands, with this chip's real skid"
          echo "  * per-chip save/restore fixpoint over the full vCPU state"
          echo "  * FIRST QUESTION for this box: is FEAT_ECV present? The"
          echo "    paravirtualized-clock design (docs/PARAVIRT-CLOCK.md) exists"
          echo "    to survive its absence, so this is an output, not an"
          echo "    assumption."
          echo
          echo "Chip identification, recorded now so the first qualification run has a baseline:"
          uname -srm
          (grep -m1 -E 'CPU implementer|CPU part|Features' /proc/cpuinfo || true)
      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Install CI cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The portable suite, run on real arm64 silicon. quality.yml cross-CHECKS
      # the workspace for aarch64 but cannot execute a single test there; this
      # is the first place the arch-neutral engine actually runs on the ISA it
      # claims to be neutral about.
      - name: Portable suite on native arm64
        run: cargo nextest run --all-features
      - name: Clippy on native arm64
        run: cargo clippy --all-features --all-targets -- -D warnings
