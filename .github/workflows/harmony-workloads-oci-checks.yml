# SPDX-License-Identifier: AGPL-3.0-or-later
# Applications packaged as OCI images, executed through Consonance. Container
# Execution and PostgreSQL are bounded per-pull-request checks; Docker and K3s
# are registered schedule-only exceptions recorded in scripts/ci_contract.py,
# because each builds a pinned multi-hundred-megabyte image and boots it twice.
name: Checks / Harmony Workloads / OCI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: harmony-oci-checks-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0
  HARMONY_PLATFORM_KERNEL: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64/bzImage
  HARMONY_PLATFORM_INITRAMFS: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz
  HARMONY_PLATFORM_FIXTURE: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64/fixture

jobs:
  container-execution:
    name: Container Execution
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Determine whether this check is applicable
        id: scope
        uses: ./.github/actions/ci-scope
        with:
          kind: consonance_platform
      - name: Install pinned host toolchain
        if: steps.scope.outputs.enabled == 'true'
        run: |
          rustup toolchain install "$HARMONY_RUST_TOOLCHAIN" --profile minimal
          rustup default "$HARMONY_RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.enabled == 'true'
        with:
          shared-key: harmony-oci-container-execution
      - name: Restore the qualified guest runtime
        if: steps.scope.outputs.enabled == 'true'
        uses: ./.github/actions/platform-runtime
        with:
          report: container-execution-evidence
      - name: Enable the hardware backend
        if: steps.scope.outputs.enabled == 'true'
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Run and restore containers inside the guest
        if: steps.scope.outputs.enabled == 'true'
        run: |
          set -o pipefail
          timeout -k 10 720 cargo test --locked --release -p oci-support \
            --test platform --test process_platform -- --ignored --nocapture \
            2>&1 | tee container-execution-evidence/replay.log
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.enabled == 'true'
        with:
          name: harmony-oci-container-execution-${{ github.run_id }}
          path: container-execution-evidence
          if-no-files-found: error
          retention-days: 14

  postgresql:
    name: PostgreSQL
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Determine whether this check is applicable
        id: scope
        uses: ./.github/actions/ci-scope
        with:
          kind: harmony_oci
      - name: Initialize the evidence directory
        if: steps.scope.outputs.enabled == 'true'
        run: mkdir -p pg-check
      - name: Name the pinned workload image
        id: image-key
        if: steps.scope.outputs.enabled == 'true'
        run: echo "key=pgcic-oci-v1-${{ hashFiles('workloads/bugs/historical/postgres-cic-corruption/image/**', 'workloads/bugs/historical/postgres-cic-corruption/case.json') }}" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.enabled == 'true'
        with:
          shared-key: harmony-oci-postgresql
      - name: Restore the qualified guest runtime
        if: steps.scope.outputs.enabled == 'true'
        uses: ./.github/actions/platform-runtime
        with:
          report: pg-check
      - name: Restore the pinned PostgreSQL workload image
        if: steps.scope.outputs.enabled == 'true'
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: oci-images
          # The historical benchmark's image job publishes this same key after
          # verifying the layout's checksums.
          key: ${{ steps.image-key.outputs.key }}
      - name: Locate the exact workload image handoff
        id: image-handoff
        if: steps.scope.outputs.enabled == 'true' && steps.image-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_KEY: ${{ steps.image-key.outputs.key }}
        run: |
          run_id=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f name="$IMAGE_KEY" -F per_page=100 \
            --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | last | .workflow_run.id // empty')
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
      - name: Require exact workload image inputs
        if: steps.scope.outputs.enabled == 'true' && steps.image-cache.outputs.cache-hit != 'true' && steps.image-handoff.outputs.run_id == ''
        run: |
          echo '::error::No PostgreSQL workload image matches this source. Run Benchmarks / Harmony Workloads / Historical Bugs on this branch to publish one, then rerun this check.'
          exit 1
      - name: Clear superseded cached workload images
        if: steps.scope.outputs.enabled == 'true' && steps.image-handoff.outputs.run_id != ''
        run: rm -rf oci-images
      - uses: actions/download-artifact@v4
        if: steps.scope.outputs.enabled == 'true' && steps.image-handoff.outputs.run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.image-handoff.outputs.run_id }}
          name: ${{ steps.image-key.outputs.key }}
          path: oci-images
      - name: Verify the workload image layout
        if: steps.scope.outputs.enabled == 'true'
        run: |
          test -s oci-images/pgcic-14.3.oci
          test -s oci-images/MANIFEST.sha256
          (cd oci-images && sha256sum -c MANIFEST.sha256)
      - name: Build the CLI
        if: steps.scope.outputs.enabled == 'true'
        run: cargo build --locked --release -p harmony-cli
      - name: Search PostgreSQL faults through Consonance
        if: steps.scope.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          timeout -k 10 180 \
            target/release/harmony search --package faults \
              oci-images/pgcic-14.3.oci --backend consonance \
              --kernel consonance/harmony-linux/build/x86_64/bzImage \
              --base-initramfs consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz \
              --seed 1 --workers 1 --executions 4 --actions 4 \
              --ram-mib 1024 \
              --knobs 'faultlab.churn_rows=20 faultlab.churn_slices=2 faultlab.churn_rounds=20' \
              --wall-minutes 1 --out pg-check/search \
            2>&1 | tee pg-check/console.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          run = Path("pg-check/search")
          report = json.loads((run / "report.json").read_text())
          summary = json.loads((run / "campaign-summary.json").read_text())
          if report.get("executions", 0) <= 0:
              raise SystemExit("the PostgreSQL check admitted no executions")
          if report.get("execution_ticks", 0) <= 0:
              raise SystemExit("the PostgreSQL check clocked no guest ticks")
          if summary.get("archive_entries", 0) <= 0:
              raise SystemExit("the PostgreSQL check retained no archive work")
          stream = (run / "stream.jsonl").read_text().splitlines()
          if not any(json.loads(line).get("event") == "job" for line in stream[1:]):
              raise SystemExit("the PostgreSQL check recorded no admitted job")
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.enabled == 'true'
        with:
          name: harmony-oci-postgresql-${{ github.run_id }}
          path: pg-check
          if-no-files-found: error
          retention-days: 14

  nested-runtime:
    name: ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Docker
            id: docker
            markers: |
              DK38: OCI workload: nested runc
              DK38: launching official postgres OCI container via nested runc
              DK38: GUEST_READY
          - name: K3s
            id: k3s
            markers: |
              K8S49: CLUSTER_UP
              K8S49: POSTGRES_READY
              K8S49: client connected to the postgres pod over the CNI
              K8S49: CNI pod IPs:
              K8S49: result rc=0 (client workload completed over the CNI)
    env:
      HARMONY_GUEST_DIR: ${{ github.workspace }}/consonance/harmony-linux/build/x86_64
      WORKLOAD: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Initialize the evidence directory
        run: mkdir -p nested-runtime-report/build-logs nested-runtime-report/console nested-runtime-report/runs
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$HARMONY_RUST_TOOLCHAIN" --profile minimal
          rustup default "$HARMONY_RUST_TOOLCHAIN"
      - name: Install workload image build tools
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends \
              bc binutils bison build-essential bzip2 cpio curl \
              flex g++ jq kmod libelf-dev libssl-dev musl-tools python3 wget xz-utils
            sudo systemctl enable --now containerd
            sudo ctr version
          } 2>&1 | tee nested-runtime-report/host-setup.log
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: harmony-oci-nested-runtime
      - name: Restore the qualified guest runtime
        uses: ./.github/actions/platform-runtime
        with:
          report: nested-runtime-report
      - name: Build the pinned workload image
        run: |
          set -euo pipefail
          {
            sudo env PATH="$PATH" \
              HARMONY_DOWNLOAD_DIR="$GITHUB_WORKSPACE/consonance/harmony-linux/dl" \
              HARMONY_ARTIFACT_DIR="$GITHUB_WORKSPACE/consonance/harmony-linux/build" \
              GUEST_BUILD_ROOT=/tmp/harmony-workload-build \
              make -C workloads/guest-images fetch
            sudo env PATH="$PATH" \
              HARMONY_DOWNLOAD_DIR="$GITHUB_WORKSPACE/consonance/harmony-linux/dl" \
              HARMONY_ARTIFACT_DIR="$GITHUB_WORKSPACE/consonance/harmony-linux/build" \
              GUEST_BUILD_ROOT=/tmp/harmony-workload-build \
              make -C workloads/guest-images "${WORKLOAD}-image"
          } 2>&1 | tee nested-runtime-report/workload-build.log
      - name: Collect workload build diagnostics
        if: always()
        run: |
          set -euo pipefail
          if [[ -d /tmp/harmony-workload-build ]]; then
            sudo find /tmp/harmony-workload-build -type f -name '*.log' \
              -exec cp -f {} nested-runtime-report/build-logs/ \; || true
          fi
          if [[ -d consonance/harmony-linux/build/oci-images ]]; then
            find consonance/harmony-linux/build/oci-images -type f -print0 \
              | sort -z | xargs -0r sha256sum >nested-runtime-report/workload-layouts.sha256
            sudo chown -R "$(id -u):$(id -g)" consonance/harmony-linux/build/oci-images 2>/dev/null || true
          fi
          sudo chown -R "$(id -u):$(id -g)" nested-runtime-report 2>/dev/null || true
      - name: Verify the workload image layout
        run: |
          set -euo pipefail
          layout="consonance/harmony-linux/build/oci-images/${WORKLOAD}.oci"
          test -d "$layout"
          test -s "$layout/index.json"
          test -s "$layout/oci-layout"
      - name: Build the CLI
        run: cargo build --locked --release -p harmony-cli 2>&1 | tee nested-runtime-report/cli-build.log
      - name: Grant nested KVM access
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          stat -c '%n mode=%a owner=%U group=%G' /dev/kvm | tee nested-runtime-report/kvm.txt
          grep -m1 'model name' /proc/cpuinfo | tee nested-runtime-report/runner.txt
      - name: Verify CLI host and guest preflight
        run: target/release/harmony preflight --json | tee nested-runtime-report/preflight.json
      - name: Run the workload twice through the canonical runtime
        env:
          MARKERS: ${{ matrix.markers }}
        run: |
          set -euo pipefail
          report=nested-runtime-report
          image="$GITHUB_WORKSPACE/consonance/harmony-linux/build/oci-images/${WORKLOAD}.oci"
          for repetition in 1 2; do
            out="$report/runs/${WORKLOAD}-${repetition}"
            rm -rf "$out"
            # The shell watchdog outlives the CLI budget so a timed-out run can
            # still persist its partial serial log.
            timeout -k 10 1260 target/release/harmony oci run "$image" \
              --seed 20260901 --ram-mib 2048 --timeout 1200 --console --out "$out" \
              2>&1 | tee "$report/console/${WORKLOAD}-${repetition}.txt"
            test -s "$out/serial.log"
            test -s "$out/run.json"
            jq -e '.container_rc == 0 and .runtime_rc == 0' "$out/run.json" >/dev/null
            if [[ "$WORKLOAD" == k3s ]]; then
              grep -Eq $'^GUEST_READY\r?$' "$out/serial.log"
            fi
            while IFS= read -r marker; do
              [[ -z "$marker" ]] && continue
              grep -Fq "$marker" "$out/serial.log"
            done <<<"$MARKERS"
          done
          cmp -s "$report/runs/${WORKLOAD}-1/serial.log" "$report/runs/${WORKLOAD}-2/serial.log"
          test "$(jq -r .serial_sha256 "$report/runs/${WORKLOAD}-1/run.json")" = \
            "$(jq -r .serial_sha256 "$report/runs/${WORKLOAD}-2/run.json")"
          sha256sum "$report/runs/${WORKLOAD}-1/serial.log" >"$report/${WORKLOAD}-serial.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmony-oci-${{ matrix.id }}-${{ github.run_id }}
          path: |
            nested-runtime-report
            consonance/harmony-linux/build/oci-images
          if-no-files-found: warn
          retention-days: 30
