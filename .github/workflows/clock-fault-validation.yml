# SPDX-License-Identifier: AGPL-3.0-or-later
# Scratch validation of clock faults on NATS JetStream key-value. Lives only
# on the validation branch.
name: Scratch / Clock Fault Validation

on:
  push:
    branches: [claude/clock-fault-validation]

permissions:
  contents: read
  actions: read

env:
  HARMONY_RUST_TOOLCHAIN: 1.97.0
  HARMONY_GUEST_TOOLCHAIN: nightly-2026-06-16

defaults:
  run:
    shell: bash

jobs:
  runtime:
    name: Exact runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the exact runtime
        uses: ./.github/actions/exact-platform-runtime

  cli:
    name: Build the paired CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          rustup toolchain install "$HARMONY_RUST_TOOLCHAIN" --profile minimal
          rustup default "$HARMONY_RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build the paired CLI
        run: bash scripts/build-consonance-cli-pair.sh paired-cli
      - uses: actions/upload-artifact@v4
        with:
          name: clock-cli
          path: paired-cli
          retention-days: 3

  run:
    name: ${{ matrix.version }} ${{ matrix.variant }}
    needs: [runtime, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: [v2.10.20]
        variant: [history]
    steps:
      - uses: actions/checkout@v4
      - name: Restore the guest runtime
        uses: ./.github/actions/platform-runtime
        with:
          report: evidence
      - uses: actions/download-artifact@v4
        with:
          name: clock-cli
          path: paired-cli
      - uses: actions/download-artifact@v4
        if: matrix.version != 'v2.10.20'
        with:
          name: clock-image-${{ matrix.version }}
          path: images
      - uses: actions/download-artifact@v4
        if: matrix.version == 'v2.10.20'
        with:
          name: clock-build
          path: finding
          run-id: 39410317486
          github-token: ${{ github.token }}
      - name: Place the finding image
        if: matrix.version == 'v2.10.20'
        run: |
          mkdir -p images
          mv finding/images/nats-kv-clock.oci images/nats-kv-v2.10.20.oci
          rm -rf finding
      - uses: actions/setup-go@v5
        with:
          go-version-file: workloads/harness/kit/go.mod
          cache: false
      - name: Enable KVM
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          chmod +x paired-cli/harmony paired-cli/harmony-consonance-host
          sha256sum images/*.oci
      - name: Run
        env:
          VERSION: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          image="$PWD/images/nats-kv-$VERSION.oci"
          if [ "$VARIANT" = explain ] || [ "$VARIANT" = history ]; then
            bash .github/clock-validation/run.sh "$VARIANT" "$image"
          else
            bash .github/clock-validation/run.sh variant "$image" "$VARIANT" 12
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-${{ matrix.version }}-${{ matrix.variant }}
          path: evidence
          retention-days: 7
