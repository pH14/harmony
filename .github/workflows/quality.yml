name: quality

# Enforcement runs on GITHUB-HOSTED runners (ubuntu-latest). harmony is a public
# repo, so standard Linux runners are free with unlimited minutes — the reason these
# jobs used to run on the self-hosted determinism box (private-repo minutes were
# exhausted, "not to be paid for") is gone. Every job here is a CONTENT check: fmt,
# clippy -D warnings, cargo-deny, nextest, coverage, mutation, Kani, public-api, and
# the arm-altra pre-build apparatus incl. its Miri gate. None of them need bare metal
# — a cache-thrashed slower run produces the same artifact and the same hash, so the
# runner's microarchitecture and contention do not affect the verdict
# (docs/BOX-PINNING.md, "CI runner isolation": "Correctness gates are contention-
# immune").
#
# What STAYS on the box (NOT in this workflow, and never was): the ~23
# live_*/determinism/seal-rate/PMU gates that need a real /dev/kvm, the patched KVM
# module, hardware perf counters, and quiet pinned cores. Those run out-of-band
# through the box run-window tooling (now in the harmony-development repo).
# Formalizing them as a dispatchable `runs-on: [self-hosted, kvm]` job is a documented
# follow-up (see the migration PR description); until then the box's role is unchanged.
#
# Cargo tools (cargo-nextest, cargo-deny, cargo-llvm-cov, cargo-mutants) are installed
# per-job with taiki-e/install-action (prebuilt binaries, seconds). The shared-temp
# race that once flaked install-action — and forced pre-provisioning on the box — was
# a property of CONCURRENT jobs sharing one self-hosted /tmp; on GHA every job gets a
# fresh, isolated runner, so it cannot recur. Swatinem/rust-cache caches the cargo
# registry + target dir across runs so only changed crates recompile.
#
# macOS portability (conventions rule 6) is held by developers running the gates
# locally on macOS and by the fast .githooks/pre-push hook. A `macos-latest` leg could
# be added to `gates` cheaply now that hosted minutes are free — left out for now.

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gating: fmt, clippy (enforces clippy.toml), cargo-deny, and the test suite.
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Install CI cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny@0.19.9
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: cargo deny
        run: cargo deny check
      # The root `cargo deny check` only sees the root workspace. License-check the
      # out-of-workspace manifests too (consonance/acceptance-suite/payloads + the cargo-fuzz harnesses), so
      # their deps — e.g. libfuzzer-sys's NCSA-licensed LLVM runtime — are asserted
      # AGPL-compatible against the same allow-list (task 91).
      - name: cargo deny (guest + fuzz manifests)
        run: |
          cargo deny --manifest-path consonance/acceptance-suite/payloads/Cargo.toml check --config deny.toml licenses
          cargo deny --manifest-path consonance/control-proto/fuzz/Cargo.toml check --config deny.toml licenses
      - name: cargo nextest
        run: cargo nextest run --all-features
      # The ARCH-BOUNDARY seam gate (tasks/108). The whole point of the `Arch` trait
      # + engine/vendor split is that a NON-x86 vendor can be added additively — but
      # nothing else in CI would ever notice if that stopped being true, because this
      # box is x86-64 and every other gate compiles only for it. Cross-CHECK (not
      # run) the workspace for aarch64-linux: it type-checks the arch-neutral engine
      # against a target where the x86 KVM substrate is cfg'd OUT, so an x86 leak into
      # the engine — or a `cfg(target_os = "linux")` that should have been
      # `cfg(all(target_os = "linux", target_arch = "x86_64"))` — fails HERE instead
      # of on the day someone starts the ARM backend. (`kvm_bindings` exposes a
      # different `kvm_regs` per arch, so an ungated x86 substrate does not even
      # parse on aarch64 — that is exactly what this catches.)
      #
      # CARGO_FEATURE_NO_NEON: blake3's build script compiles a NEON `.c` for aarch64
      # and needs an aarch64 C toolchain we do not ship. This is a CHECK — no aarch64
      # artifact is ever linked or run — so steering blake3 to its NEON-free path is
      # sound and keeps the gate free of a cross-compiler dependency.
      - name: cross-check aarch64 (the arch seam must stay additive)
        run: |
          rustup target add aarch64-unknown-linux-gnu
          CARGO_FEATURE_NO_NEON=1 cargo clippy --target aarch64-unknown-linux-gnu \
            --all-features --all-targets -- -D warnings
      # harmony-linux/sdk is an out-of-workspace `no_std` crate (its own Cargo.toml), so the
      # root fmt/clippy/nextest above never see it. Gate it explicitly on its own
      # manifest — its host-side loopback tests (duplicate-coordinate rejection,
      # emission dispositions, determinism) must stay green like any other crate.
      - name: harmony-linux/sdk gates (out-of-workspace manifest)
        run: |
          cargo fmt --manifest-path harmony-linux/sdk/Cargo.toml --all -- --check
          cargo clippy --manifest-path harmony-linux/sdk/Cargo.toml --all-features --all-targets -- -D warnings
          cargo test --manifest-path harmony-linux/sdk/Cargo.toml --all-features
          # License-check its deps against the same allow-list (like the guest/fuzz
          # manifests above) — the root `cargo deny` never sees this manifest.
          cargo deny --manifest-path harmony-linux/sdk/Cargo.toml check --config deny.toml licenses
          # no_std build proof: the crate and its deps must compile for the bare
          # metal target the guest actually runs in (host-only tests can't catch a
          # std leak). Fails the gate if anything pulls in std.
          rustup target add x86_64-unknown-none
          cargo build --manifest-path harmony-linux/sdk/Cargo.toml --lib --target x86_64-unknown-none
      # Actually LINK the SDK-instrumented demo guest for bare metal — from its own
      # dir, so consonance/acceptance-suite/payloads/.cargo/config.toml (target + linker) applies. The
      # harmony-linux/sdk `--lib` proof above compiles the library, but only a full payload
      # link exercises the SDK end-to-end against the boot shim; a regression that
      # breaks the demo (the box gate's guest) would otherwise surface only on the box.
      - name: consonance/acceptance-suite/payloads sdk-demo build (bare metal, from its dir)
        working-directory: consonance/acceptance-suite/payloads
        run: cargo build -p sdk-demo
      # harmony-linux/play-agent (task 86) is out-of-workspace (its own manifest).
      # Gate it explicitly or it rots green. The portable brain
      # (chord decode, RAM map, billboard, mock-core agent loop) tests everywhere;
      # the native bin build compiles the cfg(linux) libretro-FFI + hugetlb +
      # doorbell glue, which the macOS dev host skips. Dynamic glibc build (it
      # dlopens the pinned core at runtime), so the native build IS the ship
      # target here — no musl step.
      - name: harmony-linux/play-agent gates (out-of-workspace manifest)
        run: |
          cargo fmt --manifest-path harmony-linux/play-agent/Cargo.toml --all -- --check
          cargo clippy --manifest-path harmony-linux/play-agent/Cargo.toml --all-features --all-targets -- -D warnings
          cargo test --manifest-path harmony-linux/play-agent/Cargo.toml --all-features
          cargo deny --manifest-path harmony-linux/play-agent/Cargo.toml check --config deny.toml licenses
          cargo build --manifest-path harmony-linux/play-agent/Cargo.toml --bin play-agent
      # harmony-linux/libvoidstar (task 43) is a C subtree with its own Makefile — the
      # root cargo gates never see it, and nothing else in CI builds it, so a change
      # that broke the clean-room ABI shim would merge green. `make test-libvoidstar`
      # builds the .so under the strict warning set (-Werror -Wconversion -Wpedantic),
      # runs the ABI mock test (tests/abi_test.c), and asserts the exported symbol set
      # (check-symbols.sh). Runs on any host — no Linux/KVM needed — so the C shim is
      # gated here even though the guest-image repro that installs the .so is box-only.
      - name: harmony-linux/libvoidstar ABI (C subtree, out-of-workspace)
        run: make -C harmony-linux test-libvoidstar
      # dissonance/differential-lineage is a standalone workspace root, so the
      # root gates above never see it — gate it explicitly or its test suite
      # rots green. --locked: the committed Cargo.lock
      # pins differential-dataflow/timely.
      # (Benchmarks are NOT run here — REPORT.md documents the local command.)
      - name: dissonance/differential-lineage gates (out-of-workspace manifest)
        run: |
          cargo fmt --manifest-path dissonance/differential-lineage/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path dissonance/differential-lineage/Cargo.toml --all-features --all-targets -- -D warnings
          cargo test --locked --manifest-path dissonance/differential-lineage/Cargo.toml --all-features
          # Release build: the benchmark (REPORT.md) is release-only, and cargo
          # test above builds only the dev profile — a release-only codegen or
          # link regression would otherwise escape CI (J6).
          cargo build --locked --release --manifest-path dissonance/differential-lineage/Cargo.toml --all-targets
          cargo deny --manifest-path dissonance/differential-lineage/Cargo.toml check --config deny.toml licenses

  # Miri (UB validation for the `unsafe` crates) was MOVED to the nightly workflow
  # (.github/workflows/nightly.yml). Rationale (2026-06-24): on the shared `ci.slice`
  # under PR concurrency the Miri run was OOM/timeout-flaky (SIGKILL/137) and
  # *blocked merges on resource limits, not bugs* — and across this project's history
  # it has not caught a UB bug (most `unsafe` here is `cfg(linux)` KVM/perf syscalls +
  # the doorbell `asm!`, which Miri cannot run; the real bugs came from the cross-model
  # review pass, mutants, the contract audit, and the box determinism gates). Miri stays
  # a UB *safety net*, just nightly + manually-dispatchable, not a per-PR gate.
  # The unsafe⇒Miri review-bar rule (AGENTS.md / pr-review) still applies: when a PR's
  # diff adds/changes `unsafe`, run Miri locally on that crate
  # (`cargo +nightly-2026-06-16 miri test -p <crate>`) and quote it in the review.
  # (The OOM/timeout flakiness was a shared-box-contention artifact; a dedicated 16 GB
  # GHA runner may make Miri MORE reliable — hm-w9s tracks re-measuring it.)

  # Gating: region-coverage floor measured from reality (docs/CODE-QUALITY.md,
  # "Coverage baseline"). Ratchet FLOOR up as coverage improves; never pick a
  # round number. Hardened by quality-b.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Install CI cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # `--ignore-filename-regex` drops the box-only `cfg(linux)` substrate paths
      # from the coverage denominator: the stock-KVM path
      # (`consonance/vmm-backend/src/kvm.rs`, `…/src/kvm/`, `…/src/kvm_sys.rs`), the
      # task-21 determinism backend (`…/src/patched_kvm.rs`), the task-47 run_until
      # PMU syscall orchestration (`…/src/pmu_sys.rs` — its PURE config `pmu.rs`
      # stays covered), vmm-core's `perf_event` work counter
      # (`consonance/vmm-core/src/work_perf.rs`). This
      # coverage job runs **without `--ignored`** (and on every crate's matrix), so
      # the box-only `#[ignore]` integration tests that exercise the FFI / perf
      # orchestration end-to-end never run here — counting those paths would only
      # drag the floor, and running live KVM/perf in this job is impossible on a
      # hosted runner (no /dev/kvm, no patched module). They are verified instead by
      # those `#[ignore]` box tests and by Miri (which still *executes* `kvm.rs`'s
      # synthetic-`kvm_run` unit tests — incl. the KVM_EXIT_DETERMINISM decode — so a
      # logic regression still fails the suite, just not coverage-*counted*).
      # `consonance/acceptance-suite/src/realvmm.rs` is excluded on the same grounds:
      # it is the acceptance runner's real-VMM composition root and needs a
      # real `/dev/kvm`, the patched modules, and built payloads, so no portable test can
      # reach it. The
      # coverage-gated set is the portable, platform-agnostic logic the splits
      # factored out: `region`/`run_buf`, the value types, the run-loop contract
      # (`mock`/`run_loop`), and vmm-core's `work::WorkSource`/`ScriptedWork` + V-time
      # completion. See the crates' IMPLEMENTATION.md.
      - name: cargo llvm-cov (region floor 90%)
        run: |
          cargo llvm-cov nextest --all-features --lcov --output-path lcov.info \
            --ignore-filename-regex 'consonance/vmm-backend/src/(kvm(\.rs|_sys\.rs|/)|patched_kvm\.rs|pmu_sys\.rs)|consonance/vmm-core/src/vendor/x86/work_perf\.rs|consonance/acceptance-suite/src/realvmm\.rs' \
            --fail-under-regions 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: lcov.info

  # Gating (quality-c): mutation testing on the PR diff. `--in-diff` mutates
  # only lines the PR changed, so a PR that adds under-tested logic fails here
  # even though full-tree mutation is too slow for per-PR CI. Config (test tool,
  # timeouts, main.rs exclusion) lives in mutants.toml. Skipped on pushes to
  # main, where there is no diff to compare against.
  #
  # Sharded 4-way: a single-job run was killed by hosted-runner preemption at
  # ~59 min twice in a row on a 274-mutant diff (hm-4w7q) — each shard tests a
  # deterministic quarter of the mutant list so every leg finishes well inside
  # the preemption window.
  #
  # Runner survivability (hm-y53x). The ~59-min kills were diagnosed as genuine
  # hosted-runner preemption: the killed steps logged "The runner has received a
  # shutdown signal" at ~57-59 min, while two sibling runs on the same diff ran
  # 83 and 126 min uninterrupted (so it is NOT a fixed timeout — a timeout would
  # cut every run at the same mark), and no superseding push fired the workflow
  # `concurrency` cancel at those marks (that path logs only "The operation was
  # canceled", with every job in the run stopping at the same instant). Two
  # no-cost defenses back up the sharding; a costed self-hosted/larger-runner
  # comparison for the residual is in docs/history/IMPLEMENTATION-task139.md.
  #   * an explicit `timeout-minutes` well above the ~59-min window and far below
  #     the 6h hosted-runner ceiling: a pathologically slow shard fails cleanly
  #     instead of burning hours (and doubles as a "this shard got too big,
  #     raise the shard count" tripwire), while the timeout itself never lands in
  #     the preemption window.
  #   * an infrastructure-only retry around each cargo-mutants call. Decision
  #     table, by cargo-mutants exit code (verified against v27.1.0):
  #       0        -> pass (all diffed mutants caught, or none in the diff)
  #       2 or 3   -> surviving / timed-out mutants: a REAL result. Fail now and
  #                   NEVER retry — a retry must not turn a real red green. The
  #                   mutants.toml 3x timeout multiplier already absorbs infra
  #                   slowness, so a residual exit 3 is a real signal too.
  #       other rc -> infrastructure/transient (baseline flake exit 4, OOM 137,
  #                   tool-install/network blip, an interrupted run): retry on
  #                   this runner up to the bound, then fail with that code.
  # Host preemption tears down the whole runner VM, so no in-job retry can
  # survive it; that residual is covered by the sharding above plus the
  # self-hosted option in the task-139 write-up.
  mutants:
    name: mutants (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Comfortably above the observed ~59-min preemption window and far below the
    # 6h hosted-runner job ceiling; calibrated for the 4-way-sharded job (typical
    # shard ~30-40 min). See the header comment (hm-y53x).
    timeout-minutes: 90
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          # `--in-diff` needs the merge-base, so fetch full history.
          fetch-depth: 0
      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Install CI cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Compute PR diff
        run: git diff "origin/${{ github.base_ref }}"...HEAD > pr.diff
      - name: cargo mutants --in-diff
        # Infra-only retry; exit-code decision table is in the mutants-job header
        # comment. Exit 2/3 (real surviving/timed-out mutants) is never retried.
        run: |
          for attempt in 1 2; do
            set +e; cargo mutants --no-shuffle --in-diff pr.diff --shard ${{ matrix.shard }}/4; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$rc" -eq 2 ] || [ "$rc" -eq 3 ]; then
              echo "::error::cargo-mutants real result (exit $rc: surviving/timed-out mutants) — not retrying"; exit "$rc"
            fi
            echo "::warning::cargo-mutants infrastructure failure (exit $rc), attempt $attempt/2 — retrying on this runner"; sleep 15
          done
          echo "::error::cargo-mutants infrastructure failure persisted after 2 attempts (exit $rc)"; exit "$rc"
      # harmony-linux/sdk is out-of-workspace (its own manifest), so the root run above
      # never mutates it even when the PR diff touches its files — leaving the SDK
      # harness (assert/buggify/state hooks + wire encode) ungated. Mutate its
      # diffed lines on their own manifest, mirroring the fmt/clippy/test/public-api
      # split the `gates` job already applies to harmony-linux/sdk. `--in-diff` filters to
      # the PR's changed harmony-linux/sdk lines; its own `.cargo/mutants.toml` (if any)
      # auto-discovers, else the run is config-free.
      - name: cargo mutants --in-diff (harmony-linux/sdk, out-of-workspace manifest)
        # Infra-only retry (same contract as the root step above).
        run: |
          for attempt in 1 2; do
            set +e; cargo mutants --manifest-path harmony-linux/sdk/Cargo.toml --no-shuffle --in-diff pr.diff --shard ${{ matrix.shard }}/4; rc=$?; set -e
            if [ "$rc" -eq 0 ]; then exit 0; fi
            if [ "$rc" -eq 2 ] || [ "$rc" -eq 3 ]; then
              echo "::error::cargo-mutants real result (exit $rc: surviving/timed-out mutants) — not retrying"; exit "$rc"
            fi
            echo "::warning::cargo-mutants infrastructure failure (exit $rc), attempt $attempt/2 — retrying on this runner"; sleep 15
          done
          echo "::error::cargo-mutants infrastructure failure persisted after 2 attempts (exit $rc)"; exit "$rc"

  # Gating (quality-f): formal proofs on saturating/bounded integer arithmetic
  # via Kani (bounded model checking). The `#[cfg(kani)]` harnesses in
  # `consonance/vtime/src/clock.rs`, `consonance/lapic/src/device.rs`,
  # `consonance/vmm-backend/src/region_proofs.rs`, and
  # `consonance/environment/src/envcodec.rs` prove "never panics / law holds for
  # ALL inputs" — strictly stronger than the proptest sampling. Kani is
  # Linux-only, so this job runs on a Linux runner. The proof files are
  # `cfg(kani)`-only (not compiled by the normal test suite, excluded from the
  # mutation gate in `.cargo/mutants.toml`), so this job is their *only* CI check
  # — every crate with proofs must appear below. See each crate's
  # IMPLEMENTATION.md ("Formal proofs (Kani)").
  kani:
    name: kani
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      # Kani downloads CBMC + its solver backends on `cargo kani setup` (minutes).
      # Cache the verifier binary + the setup dir so nightly reruns skip the download;
      # bump the key's version suffix when kani-verifier is upgraded.
      - name: Cache Kani toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          key: kani-${{ runner.os }}-v1
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: cargo kani (vtime + lapic + vmm-backend + environment)
        run: |
          cargo kani -p vtime
          cargo kani -p lapic
          cargo kani -p vmm-backend
          cargo kani -p environment

  # Gating: frozen public-API snapshots (quality-d). The per-crate
  # `public_api` tests regenerate each crate's public surface with
  # `cargo public-api` on the pinned nightly and diff it against the committed
  # `tests/public-api.txt`; any drift in a frozen contract
  # (AGENTS.md, "Frozen surfaces are contracts") fails here. Keep PINNED_NIGHTLY in sync
  # with the tests, the miri job, and docs/CODE-QUALITY.md.
  public-api:
    name: public-api
    runs-on: ubuntu-latest
    env:
      # cargo-public-api needs rustdoc-JSON, which is nightly-only. Pin it so
      # the snapshot output is reproducible across runs and machines.
      PINNED_NIGHTLY: nightly-2026-06-16
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchains (stable default + pinned nightly)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup toolchain install "${PINNED_NIGHTLY}" --profile minimal
      - uses: Swatinem/rust-cache@v2
      # The `public_api` snapshot tests shell out to `cargo public-api`; without
      # the binary they take a loud-skip branch and exit 0, so the gate reports
      # green-by-skipping rather than green-by-checking (hm-64j: vacuous since
      # #118, when the GHA migration moved this job off the pre-provisioned box).
      # Install it as a prebuilt binary (seconds), mirroring the fmt/clippy/deny
      # jobs — the pinned nightly above supplies the rustdoc-JSON it needs.
      # Pin the version: cargo-public-api's snapshot *formatting* is
      # version-dependent, so an unpinned upgrade could flip a byte-identical
      # surface to a spurious diff. 0.52.0 is the version the committed
      # tests/public-api.txt snapshots were generated with; pin it like
      # cargo-deny@0.19.9 above so the gate stays deterministic.
      - name: Install CI cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0
      - name: public-api snapshot tests
        run: |
          cargo test \
            -p hypercall-proto -p hypercall-doorbell -p snapshot-store -p unison -p vtime -p vm-state -p vmm-backend -p vmm-core -p lapic -p gicv3 -p telemetry -p environment -p control-proto -p explorer -p sdk-events -p flow -p matcher -p runtrace -p campaign-runner -p maze -p tactics-regime -p logtmpl -p resolution -p acceptance-suite \
            --test public_api -- --ignored --nocapture
          # revision-coordinator's snapshot test is NOT #[ignore]d (tasks/121,
          # PR #124 F12: it also gates the plain nextest suite), so it runs
          # without the `--ignored` filter above.
          cargo test -p revision-coordinator --test public_api -- --nocapture
          # harmony-linux/sdk is out-of-workspace (its own manifest), so it is not in the
          # `-p` list above — freeze its public surface on its own manifest.
          cargo test --manifest-path harmony-linux/sdk/Cargo.toml \
            --test public_api -- --ignored --nocapture
