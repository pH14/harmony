name: Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  HARMONY_KANI_VERSION: 0.67.0
  HARMONY_RUST_TOOLCHAIN: 1.97.0

jobs:
  gates:
    name: Lint, build, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The out-of-workspace Dissonance gate below scopes itself to the
          # first-parent diff (base -> PR merge, or previous -> pushed commit).
          fetch-depth: 2
      - name: Benchmark report checks
        run: node --test scripts/benchmark-report.test.cjs
      - name: Historical-bug oracle checks
        run: scripts/historical-oracle.test.sh
      - name: Historical-bug replay budget checks
        run: scripts/historical-replay.test.sh
      - name: Historical-bug search status checks
        run: scripts/historical-search.test.sh
      - name: Historical-bug manifest checks
        run: scripts/historical-manifest.test.sh
      - name: Kernel patch-series checks
        run: bash consonance/harmony-linux/linux/test-patch-series.sh
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal --component rustfmt,clippy
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
      - name: Install CI cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny@0.19.9
      - name: Cargo dependency boundaries
        run: |
          python3 -m unittest discover -s scripts -p test_check_dependency_boundaries.py
          python3 scripts/check-dependency-boundaries.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Custom lints
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 -m unittest discover -s scripts -p 'test_custom_lints.py'
          python3 -m unittest discover -s scripts -p 'test_ci_*.py'
          python3 -m unittest discover -s scripts -p 'test_*scope.py'
          python3 -m unittest discover -s benchmarks/search -p 'test_*.py'
          python3 scripts/custom-lints.py
          python3 scripts/strip-comments.py --check
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: cargo deny
        run: cargo deny check
      - name: cargo deny (guest + fuzz manifests)
        run: |
          cargo deny --manifest-path consonance/control-proto/fuzz/Cargo.toml check --config deny.toml licenses
      - name: cargo nextest
        run: cargo nextest run --all-features
      - name: N6 instruction sweep generators and negative controls
        run: |
          python3 consonance/harmony-linux/scripts/n6-instruction-sweep.py self-test
          python3 consonance/harmony-linux/scripts/n6-llsc-boundary.py
      - name: V-time cost fitter self-test
        run: python3 scripts/fit-vtime-costs.py --self-test
      - name: cross-check aarch64 (the arch seam must stay additive)
        run: |
          rustup target add aarch64-unknown-linux-gnu
          CARGO_FEATURE_NO_NEON=1 cargo clippy --target aarch64-unknown-linux-gnu \
            --all-features --all-targets -- -D warnings
      - name: consonance/harmony-linux/sdk gates (out-of-workspace manifest)
        run: |
          cargo fmt --manifest-path consonance/harmony-linux/sdk/Cargo.toml --all -- --check
          cargo clippy --manifest-path consonance/harmony-linux/sdk/Cargo.toml --all-features --all-targets -- -D warnings
          cargo test --manifest-path consonance/harmony-linux/sdk/Cargo.toml --all-features
          # License-check its deps against the same allow-list (like the guest/fuzz
          # manifests above) — the root `cargo deny` never sees this manifest.
          cargo deny --manifest-path consonance/harmony-linux/sdk/Cargo.toml check --config deny.toml licenses
          # no_std build proof: the crate and its deps must compile for the bare
          # metal target the guest actually runs in (host-only tests can't catch a
          # std leak). Fails the gate if anything pulls in std.
          rustup target add x86_64-unknown-none
          cargo build --manifest-path consonance/harmony-linux/sdk/Cargo.toml --lib --target x86_64-unknown-none
      - name: workloads/nes-guest gates (out-of-workspace manifest)
        run: |
          cargo fmt --manifest-path workloads/nes-guest/Cargo.toml --all -- --check
          cargo clippy --manifest-path workloads/nes-guest/Cargo.toml --all-features --all-targets -- -D warnings
          # The static QuickNES feature needs the pinned external archive that
          # the Nova guest workflow supplies. Exercise the portable library
          # with all features, then the integration and Linux binary tests
          # through the archive-free dynamic-core profile. Cargo otherwise
          # links every binary while preparing an integration-test target.
          cargo test --manifest-path workloads/nes-guest/Cargo.toml --all-features --lib
          cargo test --manifest-path workloads/nes-guest/Cargo.toml --no-default-features --test agent --bin play-agent
          cargo deny --manifest-path workloads/nes-guest/Cargo.toml check --config deny.toml licenses
          cargo build --manifest-path workloads/nes-guest/Cargo.toml --bin play-agent
      - name: consonance/harmony-linux/libvoidstar ABI (C subtree, out-of-workspace)
        run: make -C consonance/harmony-linux test-libvoidstar
      - name: Fault workload instrumentation runtime
        run: make -C workloads/faults/runtime check
      - name: Dissonance search core gates
        run: |
          cargo fmt --manifest-path dissonance/Cargo.toml --all -- --check
          cargo build --locked --manifest-path dissonance/Cargo.toml --release
          cargo clippy --locked --manifest-path dissonance/Cargo.toml --release --all-features --all-targets -- -D warnings
          cargo test --locked --release --manifest-path dissonance/Cargo.toml --all-features
          cargo deny --manifest-path dissonance/Cargo.toml check

      - name: Workload support and fault toolkit gates
        run: |
          for package in nes-protocol fault-policy faults tools; do
            manifest="workloads/$package/Cargo.toml"
            cargo fmt --manifest-path "$manifest" --all -- --check
            cargo clippy --locked --manifest-path "$manifest" --all-features --all-targets -- -D warnings
            cargo test --locked --manifest-path "$manifest" --all-features
            cargo deny --manifest-path "$manifest" check --config deny.toml
          done

      - name: Platform guest crates
        run: |
          rustup target add x86_64-unknown-linux-musl
          for component in supervisor runtime-fixture; do
            manifest="consonance/harmony-linux/$component/Cargo.toml"
            cargo fmt --manifest-path "$manifest" --all -- --check
            cargo clippy --locked --manifest-path "$manifest" --all-targets -- -D warnings
            cargo test --locked --manifest-path "$manifest"
            cargo deny --manifest-path "$manifest" check --config deny.toml licenses
            cargo clippy --locked --manifest-path "$manifest" --target x86_64-unknown-linux-musl --all-targets -- -D warnings
          done

      - name: NES workload package gates
        run: |
          cargo fmt --manifest-path workloads/nes/Cargo.toml --all -- --check
          cargo fmt --manifest-path workloads/nes-machine/Cargo.toml --all -- --check
          cargo build --locked --manifest-path workloads/nes/Cargo.toml --release
          cargo clippy --locked --manifest-path workloads/nes/Cargo.toml --release --all-features --all-targets -- -D warnings
          cargo test --locked --manifest-path workloads/nes/Cargo.toml --release --all-features
          cargo test --locked --manifest-path workloads/nes-machine/Cargo.toml --all-features
          cargo deny --manifest-path workloads/nes/Cargo.toml check --config deny.toml

  kani:
    name: Kani proofs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Determine whether this test is applicable
        id: scope
        uses: ./.github/actions/ci-scope
        with:
          kind: kani
      - name: Install stable toolchain
        if: steps.scope.outputs.enabled == 'true'
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.enabled == 'true'
      - name: Cache Kani toolchain
        if: steps.scope.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          key: kani-${{ runner.os }}-${{ env.HARMONY_KANI_VERSION }}
      - name: Install Kani
        if: steps.scope.outputs.enabled == 'true'
        run: |
          if ! cargo kani --version 2>/dev/null | grep -Fq "${HARMONY_KANI_VERSION}"; then
            cargo install --locked --force --version "${HARMONY_KANI_VERSION}" kani-verifier
          fi
          cargo kani setup
      - name: cargo kani (vtime + lapic + vmm-backend + fault-policy)
        if: steps.scope.outputs.enabled == 'true'
        run: |
          cargo kani -p vtime
          cargo kani -p lapic
          cargo kani -p vmm-backend
          cargo kani --manifest-path workloads/fault-policy/Cargo.toml

  public-api:
    name: Public API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PINNED_NIGHTLY: nightly-2026-06-16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Determine whether this test is applicable
        id: scope
        uses: ./.github/actions/ci-scope
        with:
          kind: public_api
      - name: Install toolchains (stable default + pinned nightly)
        if: steps.scope.outputs.enabled == 'true'
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
          rustup toolchain install "${PINNED_NIGHTLY}" --profile minimal
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.enabled == 'true'
      - name: Install CI cargo tools
        if: steps.scope.outputs.enabled == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-public-api@0.52.0
      - name: public-api snapshot tests
        if: steps.scope.outputs.enabled == 'true'
        run: |
          cargo test \
            -p hypercall-proto -p hypercall-doorbell -p snapshot-store -p unison -p vtime -p vm-state -p vmm-backend -p vmm-core -p lapic -p gicv3 -p telemetry -p environment -p control-proto \
            --test public_api -- --ignored --nocapture
          # consonance/harmony-linux/sdk is out-of-workspace (its own manifest), so it is not in the
          # `-p` list above — freeze its public surface on its own manifest.
          cargo test --manifest-path consonance/harmony-linux/sdk/Cargo.toml \
            --test public_api -- --ignored --nocapture
