# Release artifacts for the brew tap (pH14/homebrew-harmony): per-platform
# `harmony` binaries, pinned guest and UML runtimes, and language recipe SDKs.
# Runs on version tags. The tap formula pins these assets by sha256.
name: Release / Harmony
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    name: CLI — ${{ matrix.platform }}
    strategy:
      matrix:
        include:
          - runner: macos-14
            platform: macOS Arm64
            triple: aarch64-apple-darwin
          - runner: ubuntu-24.04
            platform: Linux x86-64
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            platform: Linux Arm64
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release -p harmony-cli
        env:
          HARMONY_RELEASE_VERSION: ${{ github.ref_name }}
      - run: tar -C target/release -czf harmony-${{ github.ref_name }}-${{ matrix.triple }}.tar.gz harmony
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.triple }}
          path: harmony-*.tar.gz

  guest:
    name: Guest Runtime — ${{ matrix.isa }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            isa: x86_64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            isa: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build canonical platform runtime
        env:
          GUEST_TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison libelf-dev libssl-dev bc cpio kmod bzip2 wget python3
          rustup toolchain install nightly-2026-06-16 --profile minimal --component rust-src --target "$GUEST_TARGET"
          make -C consonance/harmony-linux fetch
          consonance/harmony-linux/scripts/build-platform-runtime.sh
      - name: Verify exact platform inputs
        env:
          GUEST_ISA: ${{ matrix.isa }}
        run: |
          python3 consonance/harmony-linux/scripts/runtime-artifacts.py verify --architecture "$GUEST_ISA" \
            --artifacts "consonance/harmony-linux/build/$GUEST_ISA" --output platform-provenance.json
          python3 -c 'import json; assert json.load(open("platform-provenance.json"))["scope"] == "exact-input"'
      - name: Qualify the released runtime on hardware
        env:
          GUEST_ISA: ${{ matrix.isa }}
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          export HARMONY_PLATFORM_INITRAMFS="$GITHUB_WORKSPACE/consonance/harmony-linux/build/$GUEST_ISA/initramfs-oci.cpio.gz"
          export HARMONY_PLATFORM_FIXTURE="$GITHUB_WORKSPACE/consonance/harmony-linux/build/$GUEST_ISA/fixture"
          if [[ "$GUEST_ISA" == aarch64 ]]; then
            export HARMONY_PLATFORM_KERNEL="$GITHUB_WORKSPACE/consonance/harmony-linux/build/$GUEST_ISA/Image"
          else
            export HARMONY_PLATFORM_KERNEL="$GITHUB_WORKSPACE/consonance/harmony-linux/build/$GUEST_ISA/bzImage"
          fi
          timeout -k 10 720 cargo test --locked --release -p oci-support --test platform --test process_platform -- --ignored --nocapture
      - name: Package the runtime and checksum
        run: |
          isa=${{ matrix.isa }}
          kernel=bzImage
          if [[ "$isa" == aarch64 ]]; then kernel=Image; fi
          tar -C consonance/harmony-linux/build -czf harmony-guest-${{ github.ref_name }}-$isa.tar.gz "$isa/$kernel" "$isa/initramfs-oci.cpio.gz"
          sha256sum harmony-guest-*.tar.gz > harmony-guest-${{ github.ref_name }}-${{ matrix.isa }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: guest-${{ matrix.isa }}
          path: harmony-guest-*.tar.gz*

  uml:
    name: UML Runtime — ${{ matrix.isa }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            isa: x86_64
          - runner: ubuntu-24.04-arm
            isa: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build and package the pinned UML profile
        run: |
          nix run .#uml-images -- --output "$RUNNER_TEMP/profile/${{ matrix.isa }}"
          tar -C "$RUNNER_TEMP/profile" -czf harmony-uml-${{ github.ref_name }}-${{ matrix.isa }}.tar.gz ${{ matrix.isa }}
          sha256sum harmony-uml-*.tar.gz > harmony-uml-${{ github.ref_name }}-${{ matrix.isa }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: uml-${{ matrix.isa }}
          path: harmony-uml-*.tar.gz*

  sdk:
    name: Language SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Package the exact release source for language preparation
        run: |
          for isa in x86_64 aarch64; do
            asset="harmony-sdk-${{ github.ref_name }}-$isa.tar.gz"
            git archive --format=tar --prefix=sdk/ HEAD workloads/languages workloads/faults/runtime consonance/harmony-linux/libvoidstar consonance/harmony-linux/linux/go-runtime-guest workloads/bugs/historical/etcd-3.5-inconsistency/image/patches | gzip -n > "$asset"
            sha256sum "$asset" > "$asset.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: language-sdk
          path: harmony-sdk-*.tar.gz*

  publish:
    name: Publish
    needs: [cli, guest, uml, sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes harmony-*.tar.gz harmony-*.sha256
        env:
          GH_TOKEN: ${{ github.token }}
