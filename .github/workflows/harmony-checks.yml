# SPDX-License-Identifier: AGPL-3.0-or-later
name: Checks / Harmony

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: harmony-checks-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  HARMONY_RUST_TOOLCHAIN: 1.97.0

jobs:
  scope:
    name: Change Selection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_checks: ${{ steps.rust_checks.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: rust_checks
        uses: ./.github/actions/ci-scope
        with:
          kind: rust_checks
          target: harmony-checks.yml

  cli:
    name: CLI
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal --component clippy
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: harmony-cli
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Lint the assembled CLI
        run: cargo clippy -p harmony-cli --all-features --all-targets -- -D warnings
      - name: Configuration and investigation
        run: cargo nextest run --all-features -p harmony-cli

  consonance-host:
    name: Consonance Host
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain and musl linker
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: harmony-consonance-host-linux
      - name: Build both packaged executables
        run: |
          cargo build --locked -p harmony-cli --bin harmony
          cargo build --locked -p harmony-cli --target x86_64-unknown-linux-musl \
            --no-default-features --features consonance-host --bin harmony-consonance-host
      - name: Prove sealed launch and native QuickNES routing
        run: |
          python3 scripts/test-consonance-host-package.py \
            --frontend target/debug/harmony \
            --host target/x86_64-unknown-linux-musl/debug/harmony-consonance-host \
            --platform linux

  consonance-host-arm64:
    name: Consonance Host Arm64
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain and musl linker
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: harmony-consonance-host-arm64
      - name: Build both packaged executables
        run: |
          cargo build --locked -p harmony-cli --bin harmony
          cargo build --locked -p harmony-cli --target aarch64-unknown-linux-musl \
            --no-default-features --features consonance-host --bin harmony-consonance-host
      - name: Prove sealed launch and native QuickNES routing
        run: |
          python3 scripts/test-consonance-host-package.py \
            --frontend target/debug/harmony \
            --host target/aarch64-unknown-linux-musl/debug/harmony-consonance-host \
            --platform linux
      - name: Check the paired CLI on Arm64
        run: |
          set -euo pipefail
          cp target/aarch64-unknown-linux-musl/debug/harmony-consonance-host target/debug/
          status=0
          target/debug/harmony check --offline --json >check.json || status=$?
          cat check.json
          test "$(jq -r .os check.json)" = linux
          test "$(jq -r .architecture check.json)" = aarch64
          jq -e 'has("ready") and has("blockers")' check.json >/dev/null
          echo "check exit: ${status}"

  consonance-public-api:
    name: Consonance Host Public API
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain and musl linker
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: harmony-consonance-public-api-linux
      - name: Exercise public APIs inside a sealed static host
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUNNER: ${{ github.workspace }}/scripts/linux-sealed-test-runner.py
        run: |
          set -euo pipefail
          run_one() {
            local output
            output=$("$@" 2>&1) || { printf '%s\n' "$output"; return 1; }
            printf '%s\n' "$output"
            grep -Fxq 'running 1 test' <<<"$output"
            grep -Eq 'test result: ok\. 1 passed;' <<<"$output"
          }
          client_test() {
            run_one cargo test --locked --target x86_64-unknown-linux-musl \
              -p consonance-client --features in-process,uml --lib "$1" -- --exact
          }
          client_test session::tests::sealed_host_admits_public_session_identity
          client_test session::worker::tests::sealed_host_reexecs_a_public_worker
          client_test session::uml::tests::clean_guest_exit_remains_a_terminal_shutdown
          client_test session::uml::tests::host_signal_abandons_instead_of_reporting_guest_shutdown
          client_test session::uml::tests::host_clone_status_abandons_instead_of_reporting_guest_shutdown
          client_test session::uml::tests::capture_timeout_abandons_with_a_typed_watchdog_error
          client_test session::uml::tests::paused_restore_timeout_abandons_with_a_typed_watchdog_error
          client_test session::uml::tests::rejected_service_branch_cannot_leave_a_usable_rewound_uml_session
          client_test session::uml::tests::service_factory_aliasing_the_live_handler_abandons_the_session
          client_test session::worker::tests::worker_launcher_refuses_a_child_without_image_hello
          client_test session::worker::tests::killed_worker_processes_release_their_leases_and_keep_the_cache_consistent
          client_test image_identity::sealed_guard_tests::unexpected_executable_mapping_revokes_a_published_lease
          run_one cargo test --locked --target x86_64-unknown-linux-musl \
            -p host-code-identity --lib sealed_static::tests::cached_guard_rejects_unexpected_executable_mapping -- --exact
          run_one cargo test --locked --target x86_64-unknown-linux-musl \
            -p uml --lib recording::tests::sealed_host_admits_public_recording_round_trip -- --exact
          run_one cargo test --locked --target x86_64-unknown-linux-musl \
            -p uml --test terminal_console_limit console_limit_is_settled_after_a_provisional_terminal_stop -- --exact

  nes-adapter:
    name: NES Adapter
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal --component clippy \
            --target wasm32-unknown-unknown
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: harmony-nes-adapter
          workspaces: |
            workloads/nes -> target
            workloads/nes-games -> target
            workloads/nes-machine -> target
            workloads/nes-protocol -> target
            workloads/nes-guest -> target
      - name: Host-side NES adapter and machine
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/scripts/linux-clean-loader-test.sh
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path workloads/nes/Cargo.toml --release \
            --all-features --all-targets -- -D warnings
          cargo clippy --locked --manifest-path workloads/nes-games/Cargo.toml --release \
            --all-features --all-targets -- -D warnings
          cargo check --locked --manifest-path workloads/nes-games/Cargo.toml \
            --target wasm32-unknown-unknown
          cargo clippy --locked --manifest-path workloads/nes-protocol/Cargo.toml \
            --all-features --all-targets -- -D warnings
          cargo test --locked --manifest-path workloads/nes/Cargo.toml --release --all-features
          cargo test --locked --manifest-path workloads/nes-games/Cargo.toml --release --all-features
          cargo test --locked --manifest-path workloads/nes-machine/Cargo.toml --all-features
          cargo test --locked --manifest-path workloads/nes-protocol/Cargo.toml --all-features
      - name: Guest-side NES agent on its own manifest
        run: |
          set -euo pipefail
          manifest=workloads/nes-guest/Cargo.toml
          cargo clippy --manifest-path "$manifest" --all-features --all-targets -- -D warnings
          # The static QuickNES feature needs a pinned external archive, so the
          # integration and binary tests run through the archive-free
          # dynamic-core profile instead.
          cargo test --manifest-path "$manifest" --all-features --lib
          cargo test --manifest-path "$manifest" --no-default-features --test agent --bin play-agent
          cargo build --manifest-path "$manifest" --bin play-agent

  fault-injection:
    name: Fault Injection
    needs: scope
    if: needs.scope.outputs.rust_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        run: |
          rustup toolchain install "${HARMONY_RUST_TOOLCHAIN}" --profile minimal --component clippy
          rustup default "${HARMONY_RUST_TOOLCHAIN}"
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: harmony-fault-injection
          workspaces: |
            workloads/fault-policy -> target
            workloads/faults -> target
      - name: Fault policy, package and tooling
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/scripts/linux-clean-loader-test.sh
        run: |
          set -euo pipefail
          for package in fault-policy faults; do
            manifest="workloads/$package/Cargo.toml"
            cargo clippy --locked --manifest-path "$manifest" --all-features --all-targets -- -D warnings
            cargo test --locked --manifest-path "$manifest" --all-features
          done
      - name: Guest-side instrumentation runtime
        run: make -C workloads/faults/runtime check
