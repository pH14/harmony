# SPDX-License-Identifier: AGPL-3.0-or-later
name: Benchmarks / NES

# Search capability runs are separate from pull-request checks. This public
# panel uses only source-built games; licensed runs are kept on the private
# host through benchmarks/search/run-private.sh.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      panel:
        description: Public source-built search panel
        type: choice
        options: [public]
        default: public
        required: true

permissions:
  contents: read

concurrency:
  group: nes-search-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  public:
    name: Source-built NES capability panel
    if: github.event_name == 'schedule' || inputs.panel == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ASSET_ROOT: /tmp/nes-search-assets
      BUILD_ROOT: /tmp/nes-search-build
      RUN_ROOT: /tmp/nes-search-runs
      PUBLIC_ROOT: /tmp/nes-search-public
      HARMONY_STB_BUILD_JOBS: "2"
      HARMONY_QUICKNES_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Install source build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential curl git unzip python3 python3-pil cc65
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workloads/nes -> target
      - name: Reproduce source-built games and pinned core
        run: |
          set -euo pipefail
          workloads/nes/scripts/build-nova-rom.sh "${ASSET_ROOT}/nova"
          workloads/nes/scripts/build-stb-rom.sh "${ASSET_ROOT}/stb"
          scripts/build-quicknes-core.sh "${ASSET_ROOT}/quicknes_libretro.so"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/nes-search-assets')
          files = {
              'core': root / 'quicknes_libretro.so',
              'nova': root / 'nova' / 'nova.nes',
              'stb': root / 'stb' / 'stb.nes',
          }
          inventory = {
              name: {'path': str(path), 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
              for name, path in files.items()
          }
          (root / 'inventory.json').write_text(json.dumps(inventory, sort_keys=True))
          PY
      - name: Build an identified evaluation executable
        run: python3 benchmarks/search/eval.py build --out "${BUILD_ROOT}" --jobs 2
      - name: Run the registered source-built panel
        run: |
          set +e
          python3 benchmarks/search/eval.py run benchmarks/search/nightly.json \
            --assets "${ASSET_ROOT}/inventory.json" \
            --binary "${BUILD_ROOT}/nes-eval" \
            --build-info "${BUILD_ROOT}/build-info.json" \
            --out "${RUN_ROOT}" --jobs 4 --cpus 4 \
            --memory-capacity-mib 8192 --finish-seconds 120
          status=$?
          echo "run_status=${status}" >>"${GITHUB_ENV}"
          exit "${status}"
      - name: Export compact roster and report
        if: always()
        run: |
          set -euo pipefail
          if [[ -f "${RUN_ROOT}/results.json" ]]; then
            python3 benchmarks/search/eval.py export "${RUN_ROOT}" --out "${PUBLIC_ROOT}"
          else
            echo 'The common runner produced no matrix index.' >&2
            exit 1
          fi
      - name: Publish run summary
        if: always()
        run: |
          if [[ -f "${PUBLIC_ROOT}/roster.json" ]]; then
            python3 - "${PUBLIC_ROOT}/roster.json" <<'PY' >>"${GITHUB_STEP_SUMMARY}"
          import json
          import sys
          from collections import Counter

          rows = json.load(open(sys.argv[1]))
          counts = Counter(row['outcome'] for row in rows)
          print('## Source-built NES capability panel')
          print()
          print(f"{len(rows)} registered seed/case rows; outcomes: {dict(sorted(counts.items()))}")
          print('The full roster, per-case budgets, progress, replay confirmation, resources and failures are in the artifact report.')
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nes-public-search-${{ github.run_id }}
          path: /tmp/nes-search-public
          if-no-files-found: warn
          retention-days: 30

  report:
    name: report
    needs: [public]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/scripts/benchmark-report.cjs`)({github, context, core});
