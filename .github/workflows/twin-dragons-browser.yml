# SPDX-License-Identifier: AGPL-3.0-or-later
name: Checks / Dissonance Workloads / Twin Dragons Browser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twin-dragons-browser-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  twin-dragons-runtime:
    name: Twin Dragons Runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demos/twin-dragons/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust and browser build tools
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default 1.97.0
          cargo install wasm-pack --version 0.14.0 --locked
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 4.0.15
          "$RUNNER_TEMP/emsdk/emsdk" activate 4.0.15
      - name: Build pinned runtime
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          cd demos/twin-dragons
          npm ci
          ./tools/build-runtime.sh --runtime-only
          tar -czf "$RUNNER_TEMP/twin-dragons-runtime.tar.gz" public rust/pkg .build/twin-dragons-source
      - uses: actions/upload-artifact@v4
        with:
          name: twin-dragons-runtime
          path: ${{ runner.temp }}/twin-dragons-runtime.tar.gz
          if-no-files-found: error
          retention-days: 1

  twin-dragons-build:
    name: Twin Dragons Build
    needs: twin-dragons-runtime
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demos/twin-dragons/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust adapter tools
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default 1.97.0
          cargo install wasm-pack --version 0.14.0 --locked
      - uses: actions/download-artifact@v4
        with:
          name: twin-dragons-runtime
          path: ${{ runner.temp }}
      - name: Compose assets and build the static site
        run: |
          cd demos/twin-dragons
          tar -xzf "$RUNNER_TEMP/twin-dragons-runtime.tar.gz"
          npm ci
          ./tools/build-assets.sh
          npm run build
      - name: Lint and test the browser adapter
        run: |
          cargo clippy --locked --manifest-path demos/twin-dragons/rust/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path demos/twin-dragons/rust/Cargo.toml
          wasm-pack test --node demos/twin-dragons/rust
          cd demos/twin-dragons
          npm test
          python3 -m unittest discover -s tools -p test_launcher.py
      - name: Static demo and corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: twin-dragons-browser-dist
          path: demos/twin-dragons/dist
          if-no-files-found: error
      - name: Built runtime for the browser jobs
        uses: actions/upload-artifact@v4
        with:
          name: twin-dragons-browser-build
          path: |
            demos/twin-dragons/dist
            demos/twin-dragons/public
            demos/twin-dragons/rust/pkg
          if-no-files-found: error
          retention-days: 1

  twin-dragons-browser:
    name: Twin Dragons Browser — ${{ matrix.suite }}
    needs: twin-dragons-build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [games, interface]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demos/twin-dragons/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: twin-dragons-browser-build
          path: demos/twin-dragons
      - name: Execute the browser and verify exact films
        run: |
          cd demos/twin-dragons
          npm ci
          npx playwright install --with-deps chromium
          npm run preview -- --port 4173 > "$RUNNER_TEMP/twin-dragons-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          npm run "test:browser:${{ matrix.suite }}"
      - name: Browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: twin-dragons-browser-evidence-${{ matrix.suite }}
          path: demos/twin-dragons/test-results
          if-no-files-found: ignore
