# SPDX-License-Identifier: AGPL-3.0-or-later
# Each language fixture boots twice with a fixed seed and once under the park
# launcher. Language layers are cached by their own recipe inputs; the shared
# runtime is composed onto them in every run.
name: Checks / Harmony Workloads / Languages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      rebuild_images:
        description: Rebuild every language layer without cached build steps
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: harmony-languages-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HARMONY_RUST_TOOLCHAIN: 1.97.0
  HARMONY_GUEST_TOOLCHAIN: nightly-2026-06-16

jobs:
  scope:
    name: Change Selection
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      harmony_languages: ${{ steps.harmony_languages.outputs.enabled }}
      harmony_harness: ${{ steps.harmony_harness.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: harmony_languages
        uses: ./.github/actions/ci-scope
        with:
          kind: harmony_languages
      - id: harmony_harness
        uses: ./.github/actions/ci-scope
        with:
          kind: harmony_harness

  guest:
    name: Language Guest Runtime
    needs: scope
    if: needs.scope.outputs.harmony_languages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the exact guest runtime
        uses: ./.github/actions/exact-platform-runtime
        with:
          report: language-guest-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: language-guest-runtime
          path: consonance/harmony-linux/build/x86_64
          if-no-files-found: error
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-guest-evidence
          path: language-guest-evidence
          if-no-files-found: error
          retention-days: 14

  tools:
    name: Language CLI Tools
    needs: scope
    if: needs.scope.outputs.harmony_languages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain and musl linker
        run: |
          rustup toolchain install "$HARMONY_RUST_TOOLCHAIN" --profile minimal
          rustup default "$HARMONY_RUST_TOOLCHAIN"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: harmony-language-cli-tools
      - name: Build and verify the paired CLI
        run: |
          bash scripts/build-consonance-cli-pair.sh paired-cli
          python3 scripts/test-consonance-host-package.py \
            --frontend paired-cli/harmony \
            --host paired-cli/harmony-consonance-host --platform linux
      - uses: actions/upload-artifact@v4
        with:
          name: language-cli-tools
          path: paired-cli
          if-no-files-found: error
          retention-days: 14


  packaged-composition:
    name: Packaged Composition
    needs: [scope, guest, tools]
    if: needs.scope.outputs.harmony_languages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: language-cli-tools
          path: paired-cli
      - uses: actions/download-artifact@v4
        with:
          name: language-guest-runtime
          path: runtime/x86_64
      - name: Enable required native composition and package the retained producer bytes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools strace
          if [[ -c /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          tar -C paired-cli -czf cli.tar.gz harmony harmony-consonance-host
          tar -C runtime -czf runtime.tar.gz x86_64/bzImage x86_64/initramfs-oci.cpio.gz x86_64/runtime-manifest.json
          musl-gcc -O2 -static -Wl,-z,separate-code -Wall -Wextra -Werror \
            -o packaged-host-fixture cli/tests/fixtures/packaged-host.c
      - name: Exercise the packaged CLI and worker
        run: |
          python3 scripts/qualify-packaged-host.py --cli-archive cli.tar.gz \
            --runtime-archive runtime.tar.gz --fixture packaged-host-fixture \
            --output packaged-composition --evidence-archive packaged-composition-evidence.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-composition-evidence
          path: |
            packaged-composition/receipt.json
            packaged-composition-evidence.tar.gz
          if-no-files-found: error
          retention-days: 14


  images:
    name: Language Image — ${{ matrix.name }}
    needs: scope
    if: needs.scope.outputs.harmony_languages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: C, id: c }
          - { name: Rust, id: rust }
          - { name: Go, id: go }
          - { name: Python, id: python }
          - { name: Java, id: java }
    steps:
      - uses: actions/checkout@v4
      - id: key
        run: echo "key=language-base-v2-${{ matrix.id }}-$(python3 workloads/languages/image-key.py ${{ matrix.id }})" >>"$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: language-base/base.tar
          key: ${{ steps.key.outputs.key }}
      - name: Build or restore the language layer and compose the current runtime
        env:
          REBUILD_IMAGES: ${{ github.event_name == 'schedule' || inputs.rebuild_images }}
        run: bash workloads/languages/prepare-ci-image.sh ${{ matrix.id }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: language-base/base.tar
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: language-image-${{ matrix.id }}
          path: language-image/${{ matrix.id }}.tar
          if-no-files-found: error
          retention-days: 14

  check:
    name: Check — ${{ matrix.name }}
    needs: [scope, guest, images, tools]
    if: needs.scope.outputs.harmony_languages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: C, id: c }
          - { name: Rust, id: rust }
          - { name: Go, id: go }
          - { name: Python, id: python }
          - { name: Java, id: java }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: language-image-${{ matrix.id }}
          path: language-image
      - uses: actions/download-artifact@v4
        with:
          name: language-guest-runtime
          path: consonance/harmony-linux/build/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: language-cli-tools
          path: target/release
      - name: Restore paired CLI permissions and enable KVM
        run: |
          chmod +x target/release/harmony target/release/harmony-consonance-host
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          docker load --input language-image/${{ matrix.id }}.tar
      - name: Check admission, timer progress, park progress and replay identity
        run: timeout -k 10 720 bash workloads/languages/run-check.sh harmony-language-${{ matrix.id }}:local language-evidence
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-evidence-${{ matrix.id }}
          path: language-evidence
          if-no-files-found: error
          retention-days: 14

  c-investigation:
    name: C Investigation
    needs: [scope, guest, images, tools]
    if: needs.scope.outputs.harmony_languages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: language-image-c
          path: language-image
      - uses: actions/download-artifact@v4
        with:
          name: language-guest-runtime
          path: consonance/harmony-linux/build/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: language-cli-tools
          path: target/release
      - name: Restore paired CLI permissions and enable KVM
        run: |
          chmod +x target/release/harmony target/release/harmony-consonance-host
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          docker load --input language-image/c.tar
      - name: Check guest debugging, saved branches and search continuation
        run: timeout -k 10 1800 bash cli/tests/investigation.sh language-evidence/investigation
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-investigation-c
          path: language-evidence
          if-no-files-found: error
          retention-days: 14

  uml-profile:
    name: Language UML Profile
    needs: scope
    if: needs.scope.outputs.harmony_languages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the pinned UML profile
        run: |
          nix run .#uml-images -- --output "$RUNNER_TEMP/uml"
          cmp "$RUNNER_TEMP/uml/profile.json" consonance/uml/reviewed-profiles/x86_64.json
      - uses: actions/upload-artifact@v4
        with:
          name: language-uml-profile
          path: ${{ runner.temp }}/uml
          if-no-files-found: error
          retention-days: 14

  uml-command:
    name: UML Command Replay
    needs: [scope, guest, images, uml-profile, tools]
    if: needs.scope.outputs.harmony_languages == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: language-image-c
          path: language-image
      - uses: actions/download-artifact@v4
        with:
          name: language-guest-runtime
          path: consonance/harmony-linux/build/x86_64
      - uses: actions/download-artifact@v4
        with:
          name: language-uml-profile
          path: uml-profile
      - uses: actions/download-artifact@v4
        with:
          name: language-cli-tools
          path: target/release
      - name: Restore paired CLI permissions
        run: |
          chmod +x target/release/harmony target/release/harmony-consonance-host
          chmod +x uml-profile/linux
      - name: Verify plain command replay as an ordinary user on UML
        run: |
          mkdir -p "$RUNNER_TEMP/uml-command-image"
          cat > "$RUNNER_TEMP/uml-command-image/true.S" <<'ASM'
          .global _start
          _start:
              mov $60, %rax
              xor %rdi, %rdi
              syscall
          ASM
          cc -nostdlib -static -no-pie -Wl,-z,noexecstack \
            -o "$RUNNER_TEMP/uml-command-image/true" "$RUNNER_TEMP/uml-command-image/true.S"
          cat > "$RUNNER_TEMP/uml-command-image/Dockerfile" <<'DOCKERFILE'
          FROM scratch
          COPY true /bin/true
          DOCKERFILE
          docker build -t harmony-uml-command-safe:local "$RUNNER_TEMP/uml-command-image"
          docker save -o "$RUNNER_TEMP/uml-command-safe.tar" harmony-uml-command-safe:local
          timeout -k 10 300 bash cli/tests/uml-command.sh "$RUNNER_TEMP/uml-command-safe.tar" \
            "$GITHUB_WORKSPACE/uml-profile" \
            "$GITHUB_WORKSPACE/consonance/harmony-linux/build/x86_64/initramfs-oci.cpio.gz" \
            uml-command-evidence language-image/c.tar
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-uml-command-evidence
          path: uml-command-evidence
          if-no-files-found: error
          retention-days: 14

  harness:
    name: Harness Kit
    needs: scope
    if: needs.scope.outputs.harmony_harness == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: false
      - name: Vet and test the kit and build every target
        working-directory: workloads/harness
        run: |
          (cd kit && go vet ./... && go test ./...)
          for target in targets/*/; do
            (cd "$target" && go vet ./... && go build -o "$RUNNER_TEMP/harness-build/" ./...)
          done
      - name: Build the etcd image and check it without faults
        run: |
          runtime=$(bash workloads/languages/build-runtime.sh)
          docker build --build-arg HARMONY_RUNTIME_IMAGE="$runtime" \
            --build-arg ETCD_VERSION=v3.5.5 --build-arg HARNESS_BUNDLE=bundle-single \
            --file workloads/harness/targets/etcd/Dockerfile --tag harness-etcd:ci .
          python3 workloads/harness/native.py harness-etcd:ci --tool docker --for 30 --no-faults \
            | tee "$RUNNER_TEMP/native.json"
          tail -n 1 "$RUNNER_TEMP/native.json" | python3 -c 'import json, sys; r = json.load(sys.stdin); sys.exit(r["result"] != "clean" or "workload_exit" in r or not r["last_check"]["decided"] or not r["last_check"]["ops"])'
