# SPDX-License-Identifier: AGPL-3.0-or-later
name: Cached system packages
description: >-
  Install Ubuntu packages with apt, keeping the downloaded archives in the
  Actions cache so a run downloads only the package lists and any package newer
  than the cached copy. Every ref restores the newest entry for the Ubuntu
  release; main saves a new entry whenever the set of archives changed.
inputs:
  packages:
    description: Space-separated apt package names
    required: true
runs:
  using: composite
  steps:
    - name: Key the package archive cache
      id: key
      shell: bash
      run: echo "prefix=apt-archives-v3-${ImageOS:-unknown}-${RUNNER_ARCH}-" >>"$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v4
      id: restore
      with:
        path: ~/.cache/apt-archives
        key: ${{ steps.key.outputs.prefix }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Install packages from the cached archives and the mirror
      id: install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        PREFIX: ${{ steps.key.outputs.prefix }}
      run: |
        archives="$HOME/.cache/apt-archives"
        mkdir -p "$archives/partial"
        sudo apt-get update
        read -ra packages <<<"$PACKAGES"
        sudo apt-get install --yes --no-install-recommends \
          -o Dir::Cache::Archives="$archives" "${packages[@]}"
        sudo apt-get autoclean -o Dir::Cache::Archives="$archives"
        sudo rm -f "$archives/lock"
        sudo chown -R "$(id -u):$(id -g)" "$archives"
        contents=$(find "$archives" -maxdepth 1 -name '*.deb' -printf '%f\n' | sort | sha256sum | cut -c1-16)
        echo "contents=${contents}" >>"$GITHUB_OUTPUT"
        echo "key=${PREFIX}${contents}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"
        echo "Cached archives: $(find "$archives" -maxdepth 1 -name '*.deb' | wc -l) packages, $(du -sh "$archives" | cut -f1)."
    - uses: actions/cache/save@v4
      if: github.ref == 'refs/heads/main' && !startsWith(steps.restore.outputs.cache-matched-key, format('{0}{1}-', steps.key.outputs.prefix, steps.install.outputs.contents))
      with:
        path: ~/.cache/apt-archives
        key: ${{ steps.install.outputs.key }}
