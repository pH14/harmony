# actionlint configuration.
#
# The hardware lane (.github/workflows/box.yml) keys its jobs on self-hosted
# runner labels actionlint cannot know about. Declaring them here is what lets
# `actionlint` check those workflows instead of drowning them in
# unknown-label errors. It is also the authoritative list of hardware runner
# labels.
#
# The first labels are CAPABILITIES; the last is the CHIP BASELINE IDENTITY.
self-hosted-runner:
  labels:
    - kvm          # the runner exposes a usable /dev/kvm
    - x86_64       # architecture
    - det-cfl-v1   # chip baseline for the x86 CPU contract
    - msr1         # chip baseline: the arm64 box
