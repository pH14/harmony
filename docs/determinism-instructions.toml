#
# Frozen instruction-surface table for docs/DETERMINISM.md.
# A row is the unit of the N6 generated sweep. `claim` is deliberately limited
# to the two claims N6 permits: execute the handled operation, or prove that an
# unreachable entropy operation is both masked and rejected by the image audit.

schema = 1

[[instruction]]
id = "arm64-counter-frequency"
arch = "arm64"
channel = "time-and-identity"
operations = ["MRS CNTFRQ_EL0"]
claim = "execute"
layers = ["protocol", "image-audit"]
disposition = "The owned kernel obtains the fixed frequency from the Harmony contract; executable-image scans reject a raw read."
evidence = ["docs/VM-EXIT-COUNT-VTIME-STATUS.md#M1--the-M1-Max-boots-deterministically"]
verification = "tested-image-audit; generated hostile probe untested"

