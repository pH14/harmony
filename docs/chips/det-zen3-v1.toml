# SPDX-License-Identifier: AGPL-3.0-or-later
#
# det-zen3-v1 — the measured-constants pack for the AMD Zen 3 EPYC baseline.
#
# The chip is an EPYC 7313P, family 19h model 01h stepping 01h, microcode
# 0xa0011a9. Values recorded here come either from a source in this repository,
# from rr's production table, or from a stage of this suite run on the chip; each
# field names which. A field no run has measured carries an `absent` marker and
# the reason, so a consumer that needs it refuses rather than substituting a
# default — in particular, never substituting Intel's.
#
# `pack_hash` is the SHA-256 of the pack's canonical serialization with that field
# emptied, recomputed by `cpu-qualification` on load. Editing any value without
# resealing makes the pack fail to load.

[pack]
schema = "cpu-qualification-pack-v1"
baseline = "det-zen3-v1"
pack_hash = "ea23aaf6a9a47d79aaecfce134e1d7d61bffafd66c6879200ad29538f9a3538e"

[chip.vendor]
source = "/proc/cpuinfo vendor_id on the qualification box; docs/CPU-QUALIFICATION.md known-chip table AMD row"
value = "AuthenticAMD"

[chip.identity]
source = "/proc/cpuinfo cpu family 25, model 1, stepping 1 on the qualification box"
value = "19_01_01"

[chip.microcode_rev]
source = "/sys/devices/system/cpu/cpu0/microcode/version on the qualification box"
value = "0x000000000a0011a9"

[work_clock.event_config]
source = "rr src/PerfCounters.cc pmu_configs AMDZen ticks event; ratified for this program in issue #180"
value = "0x5100d1"

[work_clock.event_name]
source = "AMD PPR family 19h PMCx0D1; rr src/PerfCounters.cc comment 'RETIRED_CONDITIONAL_BRANCH_INSTRUCTIONS'"
value = "ExRetCond, retired conditional branch instructions"

[work_clock.counting_scope]
source = "consonance/cpu-qualification/src/perf_sys.rs PerfCounter, Scope::GuestOnly"
value = "PERF_TYPE_RAW, pinned, guest-only (exclude_host), sampling mode"

[skid.observed_max]
source = "the largest skid of this program's four stage-1 campaigns on the qualification box, 2026-08-25: A2 8034, C 8096, D 7991. Recomputed from the per-arm records in qualification-evidence/box/stage1-*/stage1.jsonl, outside the suite as well as inside it"
value = 8096

[skid.margin]
source = "twice skid.observed_max"
value = 16192

[skid.derivation]
source = "stage-1 campaign A2 on the qualification box"
value = "twice the largest skid this chip produced. Every delivered overflow reports the counter value at the interrupt; the skid is that value less the armed period. Across the campaigns the largest was 8096, on the loop_backedge payload at a period of 10000, and no campaign's maximum reached 8100. The distribution is concentrated far below it: every skid falls in the 10-to-10000 range with the bulk between 100 and 1000, and the smallest seen was 13. The factor of two is headroom over a maximum that is itself a tail observation, not a fitted bound. The campaigns themselves were judged against 16068, tighter than this, so the seal is not a bound widened to fit a result"

[skid.overshoot]
source = "consonance/vmm-backend/src/run_until.rs"
value = "an overflow that stops at or past the deadline raises SkidExceeded, which surfaces as a loud backend error rather than a clamped landing"

[count_offsets]
absent = "a count offset is the work an exit of a given class contributes on top of the guest's own, which stage 2 measures by landing exits of each class; stage 2 is not built, so no run on this chip has produced one. Stage 1 measures a different quantity, the fixed count around a payload loop, which is 6 work units for every payload class here and 7 for straight_line"

[event_density]
source = "stage-1 campaign A2 on the qualification box, 2026-08-25: 320 interrupt-free exactness windows across five payload classes and three interference conditions, 320000000 work-clock events judged against the analytical oracle with no mismatch. The density is the differential (count at n2 less count at n1) divided by the iteration difference, identical in every window"

[[event_density.value]]
payload_class = "loop_backedge"
events_per_iteration = 1

[[event_density.value]]
payload_class = "branch_dense"
events_per_iteration = 1

[[event_density.value]]
payload_class = "call_ret"
events_per_iteration = 1

[[event_density.value]]
payload_class = "straight_line"
events_per_iteration = 1

[[event_density.value]]
payload_class = "locked"
events_per_iteration = 1

[single_step.mechanism]
source = "spike/amd-epyc results/ae-2/single-step-ruling.md; consonance/vmm-backend/src/kvm_sys.rs enable_single_step"
value = "KVM_GUESTDBG_ENABLE | KVM_GUESTDBG_SINGLESTEP, which SVM implements through RFLAGS.TF and #DB. SVM has no monitor-trap facility, so the Intel MTF path does not exist on this chip"

[single_step.work_per_step]
absent = "measuring this needs the work clock read across a single-stepped guest and across the same guest running free. The spike single-step harness counts debug exits against an instruction oracle and never opens the work clock, and the suite's stage 2 is not built, so no run on this chip has produced the number"

[host_conditions]
source = "the host conditions the AMD entry of the known-chip table requires, in the states this program's box discipline puts them in; the two KVM module identities are the stock Debian 6.12.95 modules read on the box. The two sampling-ceiling expectations are what stage 1 needs to account for every overflow it arms: at the stock ceiling of 100000 samples a second over CONFIG_HZ 250, the kernel allows 400 sampling interrupts per tick and suppresses the rest, which cost campaign C 5548 arms of 1250000; at 100000000 with the dynamic throttle off, campaign D lost none"

[[host_conditions.value]]
condition = "nmi-watchdog-off"
expect = "off"
scope = "host"

[[host_conditions.value]]
condition = "governor-pinned"
expect = "performance"
scope = "every-core"

[[host_conditions.value]]
condition = "smt-policy"
expect = "off"
scope = "host"

[[host_conditions.value]]
condition = "kvm-present"
expect = "present, read-write"
scope = "host"

[[host_conditions.value]]
condition = "kvm-module-identity"
expect = "srcversion unrecorded, build-id 108ce949651645819c7b64a80808c9bccd7fe5c1"
scope = "kvm_amd"

[[host_conditions.value]]
condition = "kvm-module-identity"
expect = "srcversion unrecorded, build-id 61680f4470b7d6881ff0c25d941d35457316e90e"
scope = "kvm"

[[host_conditions.value]]
condition = "core-pinning"
expect = "pinned to cpu3"
scope = "host"

[[host_conditions.value]]
condition = "spec-lock-map-disabled"
expect = "disabled"
scope = "every-core"

[[host_conditions.value]]
condition = "ssb-mitigation-pinned"
expect = "on"
scope = "host"

[[host_conditions.value]]
condition = "perf-sample-ceiling"
expect = "100000000"
scope = "max-sample-rate"

[[host_conditions.value]]
condition = "perf-sample-ceiling"
expect = "0"
scope = "cpu-time-max-percent"

[[host_conditions.value]]
condition = "avic-off"
expect = "off"
scope = "host"
