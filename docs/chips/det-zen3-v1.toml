# SPDX-License-Identifier: AGPL-3.0-or-later
#
# det-zen3-v1 — the measured-constants pack for the AMD Zen 3 EPYC baseline.
#
# The chip is an EPYC 7313P, family 19h model 01h stepping 01h, microcode
# 0xa0011a9. Values recorded here come either from a source in this repository,
# from rr's production table, or from a stage of this suite run on the chip; each
# field names which. A field no run has measured carries an `absent` marker and
# the reason, so a consumer that needs it refuses rather than substituting a
# default — in particular, never substituting Intel's.
#
# `pack_hash` is the SHA-256 of the pack's canonical serialization with that field
# emptied, recomputed by `cpu-qualification` on load. Editing any value without
# resealing makes the pack fail to load.

[pack]
schema = "cpu-qualification-pack-v1"
baseline = "det-zen3-v1"
pack_hash = "08b8fd47f4a5a2bcda0b1b630928d08bed2c536656864a7351fbd4ed45f49564"

[chip.vendor]
source = "/proc/cpuinfo vendor_id on the qualification box; docs/CPU-QUALIFICATION.md known-chip table AMD row"
value = "AuthenticAMD"

[chip.identity]
source = "/proc/cpuinfo cpu family 25, model 1, stepping 1 on the qualification box"
value = "19_01_01"

[chip.microcode_rev]
source = "/sys/devices/system/cpu/cpu0/microcode/version on the qualification box"
value = "0x000000000a0011a9"

[work_clock.event_config]
source = "rr src/PerfCounters.cc pmu_configs AMDZen ticks event; ratified for this program in issue #180"
value = "0x5100d1"

[work_clock.event_name]
source = "AMD PPR family 19h PMCx0D1; rr src/PerfCounters.cc comment 'RETIRED_CONDITIONAL_BRANCH_INSTRUCTIONS'"
value = "ExRetCond, retired conditional branch instructions"

[work_clock.counting_scope]
source = "consonance/cpu-qualification/src/perf.rs Scope, and the three places stage 1 opens the counter: stage1_sys.rs open_counting(Scope::HostUser) and open_sampling(Scope::HostUser) for the host payloads and the overflow arms, guest_sys.rs open_counting(Scope::GuestOnly) for the guest payload"
value = "PERF_TYPE_RAW, pinned, never multiplexed. Two scopes are measured. Host-user (exclude_kernel, exclude_hv) carries the host payloads' exactness windows and every overflow arm, so the skid distribution below is host-user sampling scope. Guest-only (exclude_host) carries the guest payload's exactness windows, in counting mode; no measurement in this pack arms a sampling counter in guest-only scope"

[skid.observed_max]
source = "the largest skid of this program's four stage-1 campaigns on the qualification box, 2026-08-25, in the host-user sampling scope stage 1 measures: A2 8034, C 8096, D 7991, E 8007. It comes from campaign C, which did not pass its volume floor: 5548 of C's arms and 5542 of A2's were suppressed by the stock kernel sampling ceiling and are unaccounted, so the maximum is over 4988910 accounted arms of 5000000. Campaigns D and E, run after the ceiling was raised, lost none, and E's maximum is 8007; the larger of the two is sealed because it gives the more conservative margin. Recomputed from the per-arm records in qualification-evidence/box/stage1-*/stage1.jsonl.gz, outside the suite as well as inside it"
value = 8096

[skid.margin]
source = "twice skid.observed_max"
value = 16192

[skid.derivation]
source = "the four stage-1 campaigns on the qualification box"
value = "twice the largest skid this chip produced in the scope stage 1 measures. Every delivered overflow reports the counter value at the interrupt; the skid is that value less the armed period. This chip has two skid distributions and this pack does not pool them. Host-user sampling scope, the only scope stage 1 arms an overflow in: four campaigns of 1250000 arms, largest 8096 on the loop_backedge payload at a period of 10000, the bulk between 100 and 1000, smallest 13. Guest-only sampling scope, the scope a guest deadline is actually landed in because the overflow's interrupt has to leave the guest through a virtual-machine exit, measured twice in stage 2. The landing campaign, eight isolated cores, 419007 arms whose own skid the record carries: median 2915, p99 3251, p99.9 5371, p99.99 7583, smallest 1202, largest 37595 directly recorded, and four further late overflows on replay arms whose landing the campaign harness writes down only as a digest, recovering to 29884, 50432, 52737 and 56725. A fifteen-shard supplement, every target drawn above this margin so every arm armed an overflow, 720000 arms: median 2909, p99 3019, p99.9 5674, p99.99 7962, smallest 1194, largest 86738, 56 past this margin. The supplement splits that tail by core. Seven shards ran on cores the kernel keeps off, seven on cores it schedules on. The bulk is the same on both, median 2908 against 2910 and p99 3024 against 3014, and the tail is not: p99.99 7539 and largest 37616 on the isolated cores against p99.99 35346 and largest 86738 on the ordinary ones. Core isolation is therefore a condition of this baseline and stage 0 checks it. The margin covers the bulk of the guest-mode distribution and not its tail, and that is deliberate. Covering the tail would need a margin near 173476, which single-steps about 10.7 times more work on every landing and still would not be a bound: rr marks every Zen entry PMU_SKID_UNBOUNDED with a nominal 10000 it says is exceeded in rare cases, and this chip's tail agrees. An unbounded tail is handled by detection and retry, which skid.overshoot records, not by a larger constant. The stage-1 campaigns were judged against 16068, tighter than this seal, so the seal is not a bound widened to fit a result. A consumer landing a guest deadline must read this as the arm-early distance the machinery uses and not as a bound on guest-mode skid"

[skid.overshoot]
source = "consonance/vmm-backend/src/run_until.rs"
value = "an overflow that stops at or past the deadline raises SkidExceeded in consonance/vtime/src/planner.rs and surfaces as a loud backend error, never a clamped landing; consonance/vtime/tests/planner.rs skid_exceeding_margin_is_loud holds it. On this chip the tail is real and the handling is measured rather than assumed. Across this program's two stage-2 runs, 62 of 1558014 arms that armed an overflow stopped past the deadline, and every one of them was refused rather than accepted as a landing. The rate depends on the core. In the landing campaign, on isolated cores, 6 of 838014, 1 in 139669. In the supplement, 1 of 336000 on isolated cores and 55 of 384000 on ordinary ones, 1 in 336000 against 1 in 6981. Re-arming the same target is the correct response to SkidExceeded and it recovered every time it was tried: in the campaign the other arm of the same target, same margin, same core moments apart, landed exactly on all 6; in the supplement the harness re-armed automatically and 56 of 56 landed exactly. A run at a margin of 3072, just above the median skid, where a late overflow is ordinary rather than rare, gave the same answer with a real denominator: of 10000 arms, 113 needed a re-arm and 113 of them landed exactly, 111 after one re-arm and 2 after two. The retry itself is not in the code: the backend raises the error and stops there"

[count_offsets]
absent = "a count offset is the work an exit of a given class contributes on top of the guest's own, which stage 2 measures by landing exits of each class; stage 2 is not built, so no run on this chip has produced one. Stage 1 measures a different quantity, the fixed count around a payload loop, which recomputed from the raw records is 6 work units for branch_dense, call_ret, locked and loop_backedge, 7 for straight_line and 0 for the guest payload, with every one of 3072 samples per payload agreeing"

[event_density]
source = "stage-1 campaign E on the qualification box, 2026-08-25, the campaign whose report passes: 8136 interrupt-free exactness windows across five payload classes and three interference conditions plus the guest payload, 813600000 work-clock events judged against the analytical oracle with no mismatch. The density is the differential (count at n2 less count at n1) divided by the iteration difference, identical in every window; campaigns A2, C and D produced the same densities"

[[event_density.value]]
payload_class = "loop_backedge"
events_per_iteration = 1

[[event_density.value]]
payload_class = "branch_dense"
events_per_iteration = 1

[[event_density.value]]
payload_class = "call_ret"
events_per_iteration = 1

[[event_density.value]]
payload_class = "straight_line"
events_per_iteration = 1

[[event_density.value]]
payload_class = "locked"
events_per_iteration = 1

[single_step.mechanism]
source = "spike/amd-epyc results/ae-2/single-step-ruling.md; consonance/vmm-backend/src/kvm_sys.rs enable_single_step"
value = "KVM_GUESTDBG_ENABLE | KVM_GUESTDBG_SINGLESTEP, which SVM implements through RFLAGS.TF and #DB. SVM has no monitor-trap facility, so the Intel MTF path does not exist on this chip"

[single_step.work_per_step]
absent = "measuring this needs the work clock read across a single-stepped guest and across the same guest running free. The spike single-step harness counts debug exits against an instruction oracle and never opens the work clock, and the suite's stage 2 is not built, so no run on this chip has produced the number"

[host_conditions]
source = "the host conditions the AMD entry of the known-chip table requires, in the states this program's box discipline puts them in; the two KVM module identities are the stock Debian 6.12.95 modules read on the box. The two sampling-ceiling expectations are what stage 1 needs to account for every overflow it arms: at the stock ceiling of 100000 samples a second over CONFIG_HZ 250, the kernel allows 400 sampling interrupts per tick and suppresses the rest, which cost campaign C 5548 arms of 1250000; at 100000000 with the dynamic throttle off, campaign D lost none. The core-isolated expectation is what keeps the kernel from scheduling its own work on the measurement core: this program measured the guest-mode overshoot rate at 1 in 336000 on isolated cores and 1 in 6981 on ordinary ones, over 720000 arms drawn the same way on the same chip in the same run"

[[host_conditions.value]]
condition = "nmi-watchdog-off"
expect = "off"
scope = "host"

[[host_conditions.value]]
condition = "governor-pinned"
expect = "performance"
scope = "every-core"

[[host_conditions.value]]
condition = "smt-policy"
expect = "off"
scope = "host"

[[host_conditions.value]]
condition = "kvm-present"
expect = "present, read-write"
scope = "host"

[[host_conditions.value]]
condition = "kvm-module-identity"
expect = "srcversion unrecorded, build-id 3b96ce3a518f95c96edaf5ecbb7b0d97ddab4643"
scope = "kvm_amd"

[[host_conditions.value]]
condition = "kvm-module-identity"
expect = "srcversion unrecorded, build-id 5cb8ae6a19c6b3e74ebeb7e35d25029afe77b611"
scope = "kvm"

[[host_conditions.value]]
condition = "core-pinning"
expect = "pinned to cpu3"
scope = "host"

[[host_conditions.value]]
condition = "core-isolated"
expect = "isolated"
scope = "host"

[[host_conditions.value]]
condition = "spec-lock-map-disabled"
expect = "disabled"
scope = "every-core"

[[host_conditions.value]]
condition = "ssb-mitigation-pinned"
expect = "on"
scope = "host"

[[host_conditions.value]]
condition = "perf-sample-ceiling"
expect = "100000000"
scope = "max-sample-rate"

[[host_conditions.value]]
condition = "perf-sample-ceiling"
expect = "0"
scope = "cpu-time-max-percent"

[[host_conditions.value]]
condition = "avic-off"
expect = "off"
scope = "host"
