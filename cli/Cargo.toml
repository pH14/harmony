[package]
name = "harmony-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The `harmony` product CLI: host preflight and deterministic OCI workload runs"

[[bin]]
name = "harmony"
path = "src/main.rs"

[dependencies]
nes-workload = { version = "=0.1.0", path = "../workloads/nes", features = ["consonance"] }
# CLI dispatch (whitelist: clap is bins-only; this crate is a binary).
clap = { version = "4", features = ["derive"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
oci-support = { path = "../consonance/oci", version = "=0.1.0" }
faults-workload = { version = "=0.1.0", path = "../workloads/faults", features = ["consonance"] }
vmm-core = { path = "../consonance/vmm-core", version = "0.1.0" }
vmm-backend = { path = "../consonance/vmm-backend", version = "0.1.0" }
consonance-client = { path = "../consonance/client", version = "=0.1.0" }
environment = { path = "../consonance/environment", version = "=0.1.0" }

[lints]
workspace = true
