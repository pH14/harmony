[package]
name = "harmony-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The `harmony` product CLI: application preparation, deterministic search and investigation"
default-run = "harmony"

[[bin]]
name = "harmony"
path = "src/main.rs"
required-features = ["frontend"]

[[bin]]
name = "harmony-consonance-host"
path = "src/bin/harmony-consonance-host.rs"
required-features = ["consonance-host"]
test = false

[features]
default = ["frontend"]
frontend = ["dep:clap", "dep:tar", "dep:flate2"]
consonance-host = []

[dependencies]
postcard = { version = "=1.1.3", default-features = false, features = ["alloc", "use-std"] }
nes-workload = { version = "=0.1.0", path = "../workloads/nes", features = ["consonance"] }
clap = { version = "4", features = ["derive"], optional = true }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
tempfile = "3"
rustix = { version = "1.1.4", features = ["termios", "fs"] }
process-proto = { path = "../consonance/process-proto", version = "=0.1.0" }
toml = "0.8"
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
uml = { path = "../consonance/uml", version = "=0.1.0" }
oci-support = { path = "../consonance/oci", version = "=0.1.0" }
faults-workload = { version = "=0.1.0", path = "../workloads/faults", features = ["consonance"] }
searcher = { version = "=0.1.0", path = "../dissonance/searcher" }
environment = { version = "=0.1.0", path = "../consonance/environment" }
vmm-core = { path = "../consonance/vmm-core", version = "0.1.0" }
vmm-backend = { path = "../consonance/vmm-backend", version = "0.1.0" }
consonance-client = { path = "../consonance/client", version = "=0.1.0" }
host-code-identity = { path = "../consonance/host-code-identity", version = "=0.1.0" }
nested-driver = { path = "../consonance/nested-driver", version = "=0.1.0", features = ["host-search"] }

[lints]
workspace = true
